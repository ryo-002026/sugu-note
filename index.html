
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3eb">
<meta name="description" content="SUGU | 思いついたら、すぐ書ける。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>SUGU</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  color:#3b3833;
  background:#f7f3eb;
  --paper:#fffdf9;
  --cream:#f7f3eb;
  --cream2:#eee7dc;
  --ink:#3b3833;
  --muted:#8d867b;
  --line:#e9e1d5;
  --sage:#637b68;
  --sage-soft:#e8eee7;
  --clay:#b8795d;
  --clay-soft:#f6e8df;
  --gold:#bb9455;
  --danger:#b96b62;
  --shadow:0 6px 28px #5546380c;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
button,input,textarea,select{font:inherit}
button{border:0;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,
textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--sage);
  outline-offset:2px;
}
.hide{display:none!important}
.app{
  display:grid;
  grid-template-columns:350px minmax(0,1fr);
  height:100dvh;
  overflow:hidden;
}
.side{
  display:flex;
  flex-direction:column;
  min-height:0;
  background:var(--cream);
  border-right:1px solid var(--line);
}
.toolbar{
  display:flex;
  align-items:center;
  gap:5px;
  min-height:60px;
  padding:7px 12px;
  flex-shrink:0;
}
.side>.toolbar{border-bottom:1px solid var(--line)}
.brand{
  flex:1;
  padding-left:8px;
  color:#665244;
  font-family:Georgia,serif;
  font-size:25px;
  font-weight:700;
  letter-spacing:.16em;
}
.btn{
  display:grid;
  place-items:center;
  min-width:38px;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:19px;
  transition:background .15s;
}
.btn:hover:not(:disabled){background:var(--cream2)}
.btn.active{color:var(--clay)}
.status{
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
.spacer{flex:1}
.syncbar{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  padding:8px 16px;
  background:#f1ede5;
  border-bottom:1px solid var(--line);
  font-size:11px;
}
.syncbar span{
  flex:1;
  min-width:70px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.syncbtn{
  padding:6px 9px;
  border:1px solid #dfd5c9;
  border-radius:9px;
  background:var(--paper);
  font-size:11px;
}
.search{
  width:calc(100% - 32px);
  margin:15px 16px 11px;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
}
.filters{
  display:flex;
  gap:5px;
  padding:0 16px 12px;
  flex-wrap:wrap;
}
.chip{
  padding:8px 12px;
  border-radius:20px;
  color:#877c70;
  font-size:12px;
}
.chip.active{
  background:var(--sage-soft);
  color:#526b57;
  font-weight:700;
}
.sortbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 16px 10px;
}
.count{color:var(--muted);font-size:12px}
.sort-select{
  max-width:155px;
  padding:6px 8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--paper);
  color:#71695f;
  font-size:12px;
}
.list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:0 12px 16px;
}
.year-heading{
  display:flex;
  align-items:center;
  gap:12px;
  margin:17px 5px 10px;
  color:#8b7563;
  font-family:Georgia,serif;
  font-size:19px;
  letter-spacing:.07em;
}
.year-heading::after{
  content:"";
  flex:1;
  height:1px;
  background:#dcd2c5;
}
.item{
  position:relative;
  display:flex;
  align-items:stretch;
  min-height:105px;
  margin-bottom:7px;
  border:1px solid #eee7de;
  border-radius:14px;
  background:var(--paper);
  box-shadow:var(--shadow);
  cursor:pointer;
  overflow:hidden;
}
.item:hover{border-color:#d8cbbd}
.item.active{
  border-color:#a6b7a6;
  background:#f8faf5;
  box-shadow:inset 3px 0 var(--sage),var(--shadow);
}
.item-date{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  flex-shrink:0;
  width:65px;
  padding:10px 4px;
  border-right:1px solid #f0e9e1;
  color:var(--clay);
}
.item-month{
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
}
.item-day{
  font-family:Georgia,serif;
  font-size:38px;
  font-weight:400;
  line-height:1.13;
  font-variant-numeric:lining-nums;
}
.item-content{
  flex:1;
  min-width:0;
  padding:17px 7px 13px 13px;
}
.item-content strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
  line-height:1.5;
}
.item-content p{
  display:-webkit-box;
  margin:7px 0 0;
  overflow:hidden;
  color:#8d867d;
  font-size:12px;
  line-height:1.6;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow-wrap:anywhere;
}
.item-meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  color:#8a988b;
  font-size:11px;
}
.check-progress{
  display:inline-block;
  padding:3px 7px;
  border-radius:7px;
  background:var(--sage-soft);
  color:#5c775e;
  font-size:11px;
}
.item-actions{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  gap:1px;
  width:37px;
  padding:7px 5px 7px 0;
}
.item-icon{
  display:grid;
  place-items:center;
  width:29px;
  height:29px;
  border-radius:8px;
  color:#b8b0a5;
  font-size:18px;
}
.item-icon:hover{
  background:#f0eae1;
  color:var(--ink);
}
.item-icon.on{color:var(--gold)}
.item-icon.pin-on{color:var(--sage)}
.item-icon.delete{
  color:#c4b6ae;
  font-size:20px;
}
.item-icon.delete:hover{
  background:#f8e8e5;
  color:var(--danger);
}
.ghost-card{
  display:block;
  min-height:0;
  padding:15px 42px 15px 17px;
  border-color:#e4d7df;
  background:#f5eff3;
}
.ghost-card strong{
  display:block;
  color:#80677b;
  font-size:13px;
}
.ghost-card p{
  margin:7px 0 0;
  color:#917b8d;
  font-size:12px;
  line-height:1.6;
}
.ghost-close{
  position:absolute;
  top:7px;
  right:8px;
  width:30px;
  height:30px;
  border-radius:8px;
  font-size:19px;
}
.list-sentinel{
  height:8px;
  width:100%;
}
.side-bottom{
  display:flex;
  align-items:stretch;
  gap:8px;
  padding:11px 13px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:var(--cream);
  flex-shrink:0;
}
.bottom-icon{
  display:grid;
  place-items:center;
  width:44px;
  min-width:44px;
  min-height:49px;
  border:1px solid #ded4c8;
  border-radius:13px;
  background:var(--paper);
  color:#867769;
  font-size:20px;
}
.create-button{
  flex:1;
  min-width:0;
  min-height:49px;
  border-radius:13px;
  background:var(--sage);
  color:#fff;
  font-size:14px;
  font-weight:700;
  letter-spacing:.03em;
}
.create-button:hover{background:#506b55}
.editor{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  background:#fffdf9;
}
.editor>.toolbar{
  border-bottom:1px solid #f0ebe3;
}
.edit{
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  width:100%;
  max-width:920px;
  margin:auto;
  padding:23px 35px;
}
#title{
  width:100%;
  padding:13px 0;
  border:0;
  outline:0;
  background:none;
  color:var(--ink);
  font-size:24px;
  font-weight:700;
}
#body{
  flex:1;
  min-height:0;
  width:100%;
  padding:10px 0 20px;
  border:0;
  outline:0;
  resize:none;
  background:none;
  color:var(--ink);
  font-size:16px;
  line-height:1.85;
}
.checklist{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:9px 0 20px;
}
.check-row{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:44px;
}
.check-row input[type=checkbox]{
  width:19px;
  height:19px;
  accent-color:var(--sage);
  flex-shrink:0;
}
.check-text{
  flex:1;
  min-width:0;
  padding:9px 3px;
  border:0;
  border-bottom:1px solid #eee9e2;
  background:transparent;
  outline:0;
  font-size:16px;
}
.check-text.done{
  color:#a09c93;
  text-decoration:line-through;
}
.check-delete{
  width:30px;
  height:34px;
  color:#b7aca1;
  font-size:18px;
}
.check-add{
  padding:12px 3px;
  color:var(--sage);
  font-size:14px;
}
.edit-tools{
  display:flex;
  align-items:center;
  gap:8px;
  padding:5px 0 11px;
  flex-shrink:0;
}
.mode-button{
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  color:#81796e;
  font-size:12px;
}
.mode-button.on{
  background:var(--sage-soft);
  border-color:#c9d8c8;
  color:var(--sage);
}
.mode-hint{
  color:var(--muted);
  font-size:11px;
}
.link-preview{
  flex-shrink:0;
  max-height:120px;
  overflow-y:auto;
  padding:8px 0;
  border-top:1px solid var(--line);
  font-size:13px;
}
.link-preview:empty{display:none}
.link-preview small{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
}
.link-preview a{
  display:block;
  padding:5px 0;
  color:var(--sage);
  overflow-wrap:anywhere;
}
.copy-success{
  background:var(--sage-soft);
  color:var(--sage);
}
.empty-editor{
  flex:1;
  display:grid;
  place-items:center;
  padding:20px;
  color:#aaa297;
  font-size:14px;
  text-align:center;
}
.overlay{
  position:fixed;
  inset:0;
  z-index:30;
  display:grid;
  place-items:center;
  padding:18px;
  background:#332a2580;
}
.modal{
  width:min(480px,100%);
  max-height:90dvh;
  overflow:auto;
  padding:25px;
  border:1px solid #eee5db;
  border-radius:19px;
  background:var(--paper);
  box-shadow:0 20px 70px #21170e30;
}
.modal h2{
  margin:0 0 10px;
  color:#584b40;
  font-size:19px;
}
.modal p{
  white-space:pre-line;
  line-height:1.8;
  color:#756d63;
  font-size:14px;
}
.actions{
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px;
}
.action{
  padding:11px 16px;
  border-radius:10px;
  background:#eee8df;
  font-size:13px;
}
.action.primary{
  background:var(--sage);
  color:#fff;
}
.action.danger{
  background:var(--danger);
  color:#fff;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:40;
  display:flex;
  align-items:center;
  gap:12px;
  max-width:calc(100vw - 30px);
  padding:12px 16px;
  border-radius:12px;
  background:#514a40;
  color:#fff;
  box-shadow:0 6px 28px #0003;
  font-size:13px;
}
.toast button{
  color:#d8ebd8;
  font-weight:700;
  white-space:nowrap;
}
.settings-tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  padding:5px 0 13px;
  border-bottom:1px solid var(--line);
}
.settings-tab{
  flex-shrink:0;
  padding:9px 11px;
  border-radius:9px;
  color:#8a8075;
  font-size:12px;
}
.settings-tab.active{
  background:var(--sage-soft);
  color:var(--sage);
  font-weight:700;
}
.settings-list{padding-top:7px}
.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px 0;
  border-bottom:1px solid #eee8e0;
}
.setting-info{flex:1;min-width:0}
.setting-name{
  display:block;
  font-size:13px;
  font-weight:700;
}
.setting-desc{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.switch{
  position:relative;
  flex-shrink:0;
  width:43px;
  height:25px;
  border-radius:20px;
  background:#d4cdc3;
  transition:background .15s;
}
.switch::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 1px 4px #0002;
  transition:transform .15s;
}
.switch.on{background:var(--sage)}
.switch.on::after{transform:translateX(18px)}
.settings-note{
  margin-top:16px;
  color:var(--muted);
  font-size:11px;
  line-height:1.7;
}
.mobile{display:none}
@media(max-width:700px){
  .app{display:block}
  .side{
    position:fixed;
    inset:0;
    z-index:10;
    transform:translateX(-100%);
    transition:transform .12s ease;
  }
  .side.open{transform:translateX(0)}
  .editor{height:100dvh}
  .mobile{display:grid}
  .edit{padding:13px 19px}
  #title{font-size:21px}
  .btn{min-width:35px;width:35px}
  .list{padding:0 11px 15px}
  .item{min-height:100px}
  .item-date{width:64px}
}
@media(min-width:701px){
  .item-icon:not(.on):not(.pin-on){opacity:.6}
  .item:hover .item-icon{opacity:1}
}
</style>
</head>
<body>

<div class="app">
  <aside id="side" class="side">
    <header class="toolbar">
      <button id="closeList" class="btn mobile" title="一覧を閉じる">‹</button>
      <div class="brand">SUGU</div>
      <button id="settings" class="btn" title="設定" aria-label="設定">⚙</button>
      <button id="import" class="btn" title="バックアップを取り込む">⇩</button>
      <button id="export" class="btn" title="JSONバックアップを保存">⇧</button>
    </header>

    <div class="syncbar">
      <span id="account">ログインしていません</span>
      <button id="login" class="syncbtn">Googleログイン</button>
      <button id="logout" class="syncbtn hide">ログアウト</button>
      <button id="startSync" class="syncbtn hide">同期を開始</button>
    </div>

    <input id="search" class="search"
      placeholder="メモを検索" aria-label="メモを検索">

    <div class="filters">
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="ear">★ お気に入り</button>
      <button class="chip" data-filter="trash">ゴミ箱</button>
    </div>

    <div class="sortbar">
      <span id="count" class="count"></span>
      <select id="sort" class="sort-select" aria-label="並べ替え">
        <option value="updated">更新が新しい順</option>
        <option value="created">作成が新しい順</option>
        <option value="title">タイトル順</option>
      </select>
    </div>

    <div id="list" class="list" tabindex="-1"></div>

    <div class="side-bottom">
      <button id="paste" class="bottom-icon"
        title="コピーした文章からメモ">▣</button>
      <button id="sideNew" class="create-button">＋ すぐメモ</button>
      <button id="stats" class="bottom-icon"
        title="どうでもいい記録">▥</button>
    </div>
  </aside>

  <main class="editor">
    <header class="toolbar">
      <button id="openList" class="btn mobile" title="メモ一覧">‹</button>
      <span id="status" class="status">読み込み中</span>
      <div class="spacer"></div>
      <button id="syncMenu" class="btn" title="Googleログイン・同期">☁</button>
      <button id="new" class="btn" title="新規メモ">＋</button>
      <button id="copy" class="btn" title="本文をコピー">□</button>
      <button id="pin" class="btn" title="ピン留め">♧</button>
      <button id="ear" class="btn" title="お気に入り">☆</button>
      <button id="remove" class="btn" title="メモ削除">×</button>
    </header>

    <div id="editArea" class="edit">
      <input id="title" placeholder="タイトル"
        autocomplete="off" aria-label="タイトル">

      <div class="edit-tools">
        <button id="mode" class="mode-button">
          ☑ チェックリストにする
        </button>
        <span id="modeHint" class="mode-hint"></span>
      </div>

      <textarea id="body" placeholder="メモを書く…"
        aria-label="メモ本文" spellcheck="false"></textarea>

      <div id="checklist" class="checklist hide"></div>
      <div id="links" class="link-preview"></div>
    </div>

    <div id="emptyEditor" class="empty-editor hide">
      一覧からメモを選んでください
    </div>
  </main>
</div>

<input id="file" type="file"
  accept=".json,application/json" class="hide">

<div id="dialogs"></div>

<div id="toast" class="toast hide">
  <span id="toastText"></span>
  <button id="toastUndo" class="hide">元に戻す</button>
</div>

      ['syncControls','クラウド同期ボタン','ログイン・同期の操作を表示']
    ]
  }
];

let settings = {...DEFAULT_SETTINGS};

let db;

let filter = 'all';
let sortMode = 'updated';
let visibleLimit = 10;
let screen = 'list';
let copiedId = null;
let ghostDismissedDay = '';
let queue = Promise.resolve();
let failed = false;
let version = 0;
let toastTimer = null;
let undoInfo = null;
let modalOpen = false;
let settingsTab = 'list';
let listObserver = null;

let firebase = null;
let auth = null;
let firestore = null;
let cloudUser = null;
let syncEnabled = false;
let syncing = false;
let syncAgain = false;
let syncTimer = null;
let syncInterval = null;
let accountGeneration = 0;
let syncError = '';

const iso = () => new Date().toISOString();

function localGet(key) {
  try { return localStorage.getItem(key); }
  catch(e) { return null; }
}

function localSet(key,value) {
  try { localStorage.setItem(key,String(value)); }
  catch(e) {}
}

function loadSettings() {
  try {
    const stored = JSON.parse(
      localGet('sugu-settings-v1') || '{}'
    );

    for (const key of Object.keys(DEFAULT_SETTINGS)) {
      if (typeof stored[key] === 'boolean')
        settings[key] = stored[key];
    }
  } catch(e) {
    settings = {...DEFAULT_SETTINGS};
  }
}

function saveSettings() {
  localSet('sugu-settings-v1',JSON.stringify(settings));
}

function dateValue(s) {
  if (typeof s === 'number')
    return s < 1e11 ? s*1000 : s;

  if (!s) return 0;

  const v = String(s);
  const num = Number(v);

  if (/^\d{10,13}$/.test(v))
    return num < 1e11 ? num*1000 : num;

  const d = Date.parse(v) ||
    Date.parse(v.replace(' ','T'));

  return Number.isFinite(d) ? d : 0;
}

function dayKey() {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

function dateParts(n) {
  const raw = n.createdAt || n.updatedAt;
  const timestamp = dateValue(raw);

  if (!timestamp)
    return {year:'日付なし',month:'--',day:'--'};

  const d = new Date(timestamp);

  return {
    year:String(d.getFullYear()),
    month:String(d.getMonth()+1).padStart(2,'0'),
    day:String(d.getDate()).padStart(2,'0')
  };
}

function openDB() {
  return new Promise((resolve,reject) => {
    const r = indexedDB.open(DB,2);

    r.onupgradeneeded = () => {
      const d = r.result;

      if (!d.objectStoreNames.contains(TABLE))
        d.createObjectStore(TABLE,{keyPath:'id'});

      if (!d.objectStoreNames.contains(META))
        d.createObjectStore(META,{keyPath:'key'});
    };

    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);

    r.onblocked = () =>
      reject(Error('他のタブが保存領域を使用中です'));
  });
}

function getAll() {
  return new Promise((resolve,reject) => {
    const r = db.transaction(TABLE,'readonly')
      .objectStore(TABLE).getAll();

    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function getMeta(key) {
  return new Promise((resolve,reject) => {
    const r = db.transaction(META,'readonly')
      .objectStore(META).get(key);

    r.onsuccess = () => resolve(r.result?.value);
    r.onerror = () => reject(r.error);
  });
}

function setMeta(key,value) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(META,'readwrite');

    tx.objectStore(META).put({key,value});

    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function transaction(items) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(TABLE,'readwrite');
    const store = tx.objectStore(TABLE);

    for (const n of items)
      store.put({...n});

    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function enqueue(job) {
  const task = queue.then(job);

  queue = task.catch(e => {
    failed = true;
    $('status').textContent = '保存失敗';
    console.error(e);
  });

  return task;
}

function normalizeNote(raw,id=raw.id) {
  return {
    id,
    title:String(raw.title ?? ''),
    body:String(raw.body ?? ''),
    ear:!!raw.ear,
    pinned:!!raw.pinned,
    checklist:!!raw.checklist,
    checks:Array.isArray(raw.checks)
      ? raw.checks.map(Boolean) : [],
    createdAt:String(raw.createdAt ?? ''),
    updatedAt:String(raw.updatedAt ?? ''),
    deleted:!!raw.deleted,
    deletedAt:String(raw.deletedAt ?? '')
  };
}

function current() {
  return notes.find(n =>
    n.id === selected && !n.deleted
  );
}

function label(n) {
  return n.title ||
    n.body.split('\n').find(Boolean) ||
    '無題';
}

function sorted(includeDeleted=false) {
  const arr = notes.filter(n =>
    includeDeleted ? n.deleted : !n.deleted
  );

  arr.sort((a,b) => {
    if (!includeDeleted && !!a.pinned !== !!b.pinned)
      return a.pinned ? -1 : 1;

    if (includeDeleted) {
      return dateValue(b.deletedAt || b.updatedAt) -
        dateValue(a.deletedAt || a.updatedAt);
    }

    if (sortMode === 'created')
      return dateValue(b.createdAt) - dateValue(a.createdAt);

    if (sortMode === 'title') {
      const byTitle = label(a).localeCompare(label(b),'ja');

      if (byTitle !== 0) return byTitle;

      return dateValue(b.updatedAt) -
        dateValue(a.updatedAt);
    }

    return dateValue(b.updatedAt) -
      dateValue(a.updatedAt);
  });

  return arr;
}

function toast(message,undo=false) {
  clearTimeout(toastTimer);

  $('toastText').textContent = message;

  $('toastUndo').classList.toggle(
    'hide',!undo || !settings.undo
  );

  $('toast').classList.remove('hide');

  toastTimer = setTimeout(() => {
    $('toast').classList.add('hide');
    undoInfo = null;
  },6000);
}

function resetCopy() {
  copiedId = null;
  $('copy').textContent = '□';
  $('copy').classList.remove('copy-success');
}

function showScreen(next) {
  if (screen !== next) resetCopy();

  screen = next;
  localSet('sugu-screen',next);

  if (matchMedia('(max-width:700px)').matches) {
    $('side').classList.toggle(
      'open',next === 'list'
    );
  }
}

function openEditorHistory() {
  if (
    matchMedia('(max-width:700px)').matches &&
    history.state?.sugu !== 'edit'
  ) {
    history.pushState(
      {sugu:'edit'},'',location.href
    );
  }

  showScreen('edit');
}

function goList() {
  if (modalOpen) return;

  if (
    matchMedia('(max-width:700px)').matches &&
    history.state?.sugu === 'edit'
  ) {
    history.back();
  } else {
    showScreen('list');
  }
}

function updateLinks() {
  const root = $('links');
  root.replaceChildren();

  if (!settings.links) return;

  const matches = $('body').value.match(
    /https?:\/\/[^\s<>"'「」]+/g
  ) || [];

  const urls = [...new Set(matches)].slice(0,20);

  if (!urls.length) return;

  const caption = document.createElement('small');
  caption.textContent = '本文中のリンク';
  root.append(caption);

  for (const raw of urls) {
    const clean = raw.replace(
      /[.,。、）)\]】]+$/g,''
    );

    try {
      const url = new URL(clean);

      if (!['http:','https:'].includes(url.protocol))
        continue;

      const a = document.createElement('a');
      a.href = url.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = clean;

      root.append(a);
    } catch(e) {}
  }
}

function renderChecklist() {
  const n = current();
  const root = $('checklist');

  root.replaceChildren();

  if (!n || !n.checklist) return;

  const lines = n.body
    ? n.body.split('\n')
    : [''];

  lines.forEach((line,index) => {
    const row = document.createElement('div');
    row.className = 'check-row';

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = !!n.checks[index];
    box.setAttribute(
      'aria-label',`${index+1}番目を完了`
    );

    const text = document.createElement('input');
    text.type = 'text';
    text.className =
      'check-text' + (box.checked ? ' done' : '');
    text.value = line;
    text.placeholder = '項目を入力';
    text.setAttribute(
      'aria-label',`${index+1}番目の項目`
    );

    const del = document.createElement('button');
    del.className = 'check-delete';
    del.textContent = '×';
    del.title = '項目を削除';

    box.onchange = () => {
      n.checks[index] = box.checked;
      text.classList.toggle('done',box.checked);
      persist(n);
      render();
    };

    text.oninput = () => {
      const updated = n.body
        ? n.body.split('\n') : [''];

      updated[index] = text.value;
      n.body = updated.join('\n');
      $('body').value = n.body;

      persist(n);
    };

    text.onkeydown = e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addChecklistRow(index+1);
      }
    };

    del.onclick = () => {
      const updated = n.body
        ? n.body.split('\n') : [''];

      updated.splice(index,1);
      n.checks.splice(index,1);

      n.body = updated.join('\n');
      $('body').value = n.body;

      persist(n);
      renderChecklist();
      render();
    };

    row.append(box,text,del);
    root.append(row);
  });

  const add = document.createElement('button');
  add.className = 'check-add';
  add.textContent = '＋ 項目を追加';

  add.onclick = () => addChecklistRow(lines.length);

  root.append(add);
}

function addChecklistRow(index) {
  const n = current();

  if (!n || !n.checklist) return;

  const lines = n.body
    ? n.body.split('\n') : [];

  lines.splice(index,0,'');
  n.checks.splice(index,0,false);

  n.body = lines.join('\n');
  $('body').value = n.body;

  persist(n);
  renderChecklist();
  render();

  const inputs = $('checklist')
    .querySelectorAll('.check-text');

  inputs[index]?.focus();
}

function updateEditor() {
  const n = current();

  $('editArea').classList.toggle('hide',!n);
  $('emptyEditor').classList.toggle('hide',!!n);

  for (const id of ['copy','pin','ear','remove'])
    $(id).disabled = !n;

  if (!n) {
    $('title').value = '';
    $('body').value = '';
    $('links').replaceChildren();
    $('checklist').replaceChildren();
    resetCopy();
    return;
  }

  $('title').value = n.title;
  $('body').value = n.body;

  $('ear').textContent = n.ear ? '★' : '☆';
  $('pin').textContent = n.pinned ? '📌' : '♧';

  $('mode').textContent = n.checklist
    ? '☑ チェックリスト ON'
    : '☐ チェックリストにする';

  $('mode').classList.toggle('on',n.checklist);

  $('modeHint').textContent =
    n.checklist ? '1行につき1項目' : '';

  $('body').classList.toggle('hide',n.checklist);
  $('checklist').classList.toggle('hide',!n.checklist);

  renderChecklist();
  updateLinks();
}

function viewedMap() {
  try {
    return JSON.parse(
      localGet('sugu-viewed-v1') || '{}'
    );
  } catch(e) {
    return {};
  }
}

function recordView(id) {
  const map = viewedMap();
  map[id] = Date.now();

  const entries = Object.entries(map);

  if (entries.length > 1000) {
    entries.sort((a,b) => b[1]-a[1]);

    localSet(
      'sugu-viewed-v1',
      JSON.stringify(
        Object.fromEntries(entries.slice(0,1000))
      )
    );
  } else {
    localSet(
      'sugu-viewed-v1',
      JSON.stringify(map)
    );
  }
}

function ghostCandidate(list) {
  if (!settings.ghost) return null;
  if (ghostDismissedDay === dayKey()) return null;

  const viewed = viewedMap();
  const cutoff = Date.now() - 30*86400000;

  const candidates = list.filter(n => {
    const last = viewed[n.id] ||
      dateValue(n.createdAt || n.updatedAt);

    return last > 0 && last < cutoff;
  });

  if (!candidates.length) return null;

  return candidates[
    Math.floor(Date.now()/86400000) %
    candidates.length
  ];
}

function makeGhostCard(n) {
  const card = document.createElement('div');
  card.className = 'item ghost-card';
  card.dataset.id = n.id;

  const title = document.createElement('strong');
  title.textContent = '👻 メモの亡霊';

  const message = document.createElement('p');
  message.textContent =
    `「私のこと、覚えていますか。」 ${label(n)}`;

  const close = document.createElement('button');
  close.className = 'ghost-close';
  close.textContent = '×';
  close.title = '今日は表示しない';

  close.onclick = e => {
    e.stopPropagation();

    ghostDismissedDay = dayKey();

    localSet(
      'sugu-ghost-dismiss',
      ghostDismissedDay
    );

    render();
  };

  card.append(title,message,close);

  return card;
}

function makeItem(n) {
  const item = document.createElement('div');

  item.className =
    'item' + (n.id === selected ? ' active' : '');

  item.dataset.id = n.id;
  item.tabIndex = 0;
  item.setAttribute('role','button');
  item.setAttribute('aria-label',label(n));

  const parts = dateParts(n);

  const date = document.createElement('div');
  date.className = 'item-date';

  const month = document.createElement('span');
  month.className = 'item-month';
  month.textContent = parts.month + ' /';

  const day = document.createElement('span');
  day.className = 'item-day';
  day.textContent = parts.day;

  date.append(month,day);

  const content = document.createElement('div');
  content.className = 'item-content';

  const title = document.createElement('strong');
  title.textContent = label(n);

  const preview = document.createElement('p');

  if (n.checklist) {
    const lines = n.body
      ? n.body.split('\n') : [];

    preview.textContent =
      lines.filter(Boolean).slice(0,3).join(' / ') ||
      'チェックリスト';
  } else {
    preview.textContent =
      n.body.replace(/\s+/g,' ').slice(0,140);
  }

  content.append(title,preview);

  if (n.checklist && settings.checklistProgress) {
    const total = n.body
      ? n.body.split('\n').filter(Boolean).length
      : 0;

    const done = n.body
      ? n.body.split('\n').filter(
          (line,i) => line.trim() && n.checks[i]
        ).length
      : 0;

    const meta = document.createElement('div');
    meta.className = 'item-meta';

    const progress = document.createElement('span');
    progress.className = 'check-progress';
    progress.textContent = `☑ ${done}/${total}`;

    meta.append(progress);
    content.append(meta);
  }

  const actions = document.createElement('div');
  actions.className = 'item-actions';

  if (filter === 'trash') {
    const restore = document.createElement('button');
    restore.className = 'item-icon';
    restore.textContent = '↶';
    restore.title = 'メモを復元';
    restore.setAttribute('aria-label','メモを復元');

    restore.onclick = e => {
      e.stopPropagation();
      restoreNote(n.id);
    };

    actions.append(restore);
  } else {
    if (settings.pin) {
      const pin = document.createElement('button');

      pin.className =
        'item-icon' + (n.pinned ? ' pin-on' : '');

      pin.textContent = n.pinned ? '📌' : '♧';
      pin.title = n.pinned
        ? 'ピン留め解除' : 'ピン留め';

      pin.onclick = e => {
        e.stopPropagation();
        toggleField(n.id,'pinned');
      };

      actions.append(pin);
    }

    if (settings.favorites) {
      const star = document.createElement('button');

      star.className =
        'item-icon' + (n.ear ? ' on' : '');

      star.textContent = n.ear ? '★' : '☆';
      star.title = n.ear
        ? 'お気に入り解除' : 'お気に入り';

      star.onclick = e => {
        e.stopPropagation();
        toggleField(n.id,'ear');
      };

      actions.append(star);
    }

    if (settings.listDelete) {
      const del = document.createElement('button');

      del.className = 'item-icon delete';
      del.textContent = '×';
      del.title = 'メモを削除';
      del.setAttribute('aria-label','メモを削除');

      del.onclick = e => {
        e.stopPropagation();
        remove(n.id);
      };

      actions.append(del);
    }
  }

  item.append(date,content,actions);

  return item;
}

function makeYearHeading(year) {
  const heading = document.createElement('div');
  heading.className = 'year-heading';
  heading.textContent = year;
  return heading;
}

function render() {
  if (!db) return;

  if (listObserver) {
    listObserver.disconnect();
    listObserver = null;
  }

  const root = $('list');
  const oldScroll = root.scrollTop;

  const q = $('search').value.toLocaleLowerCase();
  const inTrash = filter === 'trash';
  const all = sorted(inTrash);

  const filtered = all.filter(n =>
    (filter !== 'ear' || n.ear) &&
    (n.title+'\n'+n.body)
      .toLocaleLowerCase()
      .includes(q)
  );

  $('count').textContent = `${filtered.length}件`;

  root.replaceChildren();

  const ghost = !q && filter === 'all'
    ? ghostCandidate(all) : null;

  const regular = ghost
    ? filtered.filter(n => n.id !== ghost.id)
    : filtered;

  const shown = regular.slice(0,visibleLimit);

  let previousYear = null;

  shown.forEach((n,i) => {
    if (i === 3 && ghost)
      root.append(makeGhostCard(ghost));

    const year = dateParts(n).year;

    if (year !== previousYear) {
      root.append(makeYearHeading(year));
      previousYear = year;
    }

    root.append(makeItem(n));
  });

  if (ghost && shown.length < 4)
    root.append(makeGhostCard(ghost));

  if (regular.length > visibleLimit) {
    const sentinel = document.createElement('div');
    sentinel.className = 'list-sentinel';
    sentinel.setAttribute('aria-hidden','true');

    root.append(sentinel);

    listObserver = new IntersectionObserver(entries => {
      if (!entries.some(e => e.isIntersecting))
        return;

      listObserver?.disconnect();
      listObserver = null;

      visibleLimit += 10;
      render();
    },{
      root,
      rootMargin:'0px 0px 180px 0px'
    });

    listObserver.observe(sentinel);
  }

  root.scrollTop = oldScroll;
}

function choose(id,focus=false) {
  const n = notes.find(x =>
    x.id === id && !x.deleted
  );

  if (!n) return;

  selected = id;
  version++;

  resetCopy();

  localSet('mimi-last-id',id);
  recordView(id);

  updateEditor();

  $('status').textContent =
    failed ? '保存失敗' : '保存済み';

  openEditorHistory();
  render();

  if (focus) {
    requestAnimationFrame(() => {
      if (n.checklist) {
        $('checklist')
          .querySelector('.check-text')?.focus();
      } else {
        $('body').focus();
      }
    });
  }
}

function scheduleSync() {
  if (!syncEnabled || !cloudUser) return;

  clearTimeout(syncTimer);

  syncTimer = setTimeout(
    () => syncNow(),1500
  );
}

function persist(n) {
  n.updatedAt = iso();

  const snapshot = {
    ...n,
    checks:[...(n.checks || [])]
  };

  const v = ++version;

  failed = false;
  $('status').textContent = '保存中';

  resetCopy();

  enqueue(() => transaction([snapshot]))
    .then(() => {
      if (
        selected === snapshot.id &&
        version === v
      ) {
        $('status').textContent = '保存済み';
      }

      scheduleSync();
    })
    .catch(() => {});
}

function save() {
  const n = current();
  if (!n) return;

  const title = $('title').value;
  const body = n.checklist
    ? n.body : $('body').value;

  if (title === n.title && body === n.body)
    return;

  n.title = title;
  n.body = body;

  persist(n);
}

async function create(focus=true,body='',title='') {
  const now = iso();

  const n = {
    id:crypto.randomUUID(),
    title,
    body,
    ear:false,
    pinned:false,
    checklist:false,
    checks:[],
    createdAt:now,
    updatedAt:now,
    deleted:false,
    deletedAt:''
  };

  notes.push(n);

  try {
    await enqueue(() => transaction([n]));

    if (filter === 'trash' || filter === 'ear') {
      filter = 'all';
      updateFilterUI();
    }

    choose(n.id,focus);
    scheduleSync();
  } catch(e) {
    notes = notes.filter(x => x.id !== n.id);

    await dialog(
      '保存エラー',
      '新しいメモを保存できませんでした。'
    );
  }
}

async function toggleField(id,field) {
  const n = notes.find(x =>
    x.id === id && !x.deleted
  );

  if (!n) return;

  const previous = {...n};

  n[field] = !n[field];
  n.updatedAt = iso();

  const snapshot = {
    ...n,
    checks:[...(n.checks || [])]
  };

  if (selected === id) updateEditor();
  render();

  try {
    await enqueue(() => transaction([snapshot]));
    scheduleSync();
  } catch(e) {
    Object.assign(n,previous);

    updateEditor();
    render();

    await dialog(
      '保存エラー',
      String(e.message || e)
    );
  }
}

function toggleChecklist() {
  const n = current();
  if (!n) return;

  n.checklist = !n.checklist;

  if (n.checklist) {
    const lines = n.body
      ? n.body.split('\n') : [''];

    n.checks = lines.map(
      (_,i) => !!n.checks[i]
    );
  }

  persist(n);
  updateEditor();
  render();
}

async function copyBody() {
  const n = current();
  if (!n) return;

  const id = n.id;
  const body = n.body;

  try {
    await navigator.clipboard.writeText(body);

    if (
      selected !== id ||
      screen !== 'edit' ||
      current()?.body !== body
    ) return;

    copiedId = id;

    $('copy').textContent = '✓';
    $('copy').classList.add('copy-success');

    toast('本文をコピーしました');
  } catch(e) {
    await dialog(
      'コピーできません',
      'クリップボードへの書き込みが許可されていません。'
    );
  }
}

async function showStats() {
  const all = notes.filter(n => !n.deleted);

  const lengths = all.map(
    n => (n.title+n.body).length
  );

  const total = lengths.reduce(
    (a,b) => a+b,0
  );

  const longest = lengths.reduce(
    (a,b) => Math.max(a,b),0
  );

  const shortest = lengths.length
    ? lengths.reduce((a,b) => Math.min(a,b))
    : 0;

  const checklists = all.filter(
    n => n.checklist
  ).length;

  const pinned = all.filter(
    n => n.pinned
  ).length;

  await dialog(
    'どうでもいい記録',
    `メモ総数：${all.length}件\n`+
    `全文字数：${total.toLocaleString()}字\n`+
    `最長メモ：${longest}字\n`+
    `最短メモ：${shortest}字\n`+
    `チェックリスト：${checklists}件\n`+
    `ピン留め：${pinned}件\n\n`+
    'どうでもいい数字も、集めると少し気になります。'
  );
}

function dialog(
  title,
  message,
  choices=['閉じる'],
  options={}
) {
  return new Promise(resolve => {
    const host = $('dialogs');
    host.replaceChildren();

    modalOpen = true;

    const previousFocus = document.activeElement;

    const overlay = document.createElement('div');
    overlay.className = 'overlay';

    const box = document.createElement('div');
    box.className = 'modal';
    box.setAttribute('role','dialog');
    box.setAttribute('aria-modal','true');

    const h = document.createElement('h2');
    h.textContent = title;

    const p = document.createElement('p');
    p.textContent = message;

    const actions = document.createElement('div');
    actions.className = 'actions';

    const buttons = [];

    function finish(index) {
      modalOpen = false;
      host.replaceChildren();

      document.removeEventListener(
        'keydown',handleKeys,true
      );

      if (previousFocus?.isConnected)
        previousFocus.focus({preventScroll:true});

      resolve(index);
    }

    function handleKeys(e) {
      if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        finish(0);
        return;
      }

      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        e.stopPropagation();

        const target = options.enterIndex ??
          choices.length-1;

        finish(target);
        return;
      }

      if (e.key === 'Tab') {
        const focusables = buttons;
        const index = focusables.indexOf(
          document.activeElement
        );

        if (e.shiftKey && index <= 0) {
          e.preventDefault();
          focusables.at(-1)?.focus();
        } else if (
          !e.shiftKey &&
          index === focusables.length-1
        ) {
          e.preventDefault();
          focusables[0]?.focus();
        }
      }
    }

    choices.forEach((choice,i) => {
      const b = document.createElement('button');

      b.className = 'action';

      if (i === choices.length-1)
        b.classList.add('primary');

      if (
        options.danger &&
        i === choices.length-1
      ) {
        b.classList.remove('primary');
        b.classList.add('danger');
      }

      b.textContent = choice;
      b.onclick = () => finish(i);

      buttons.push(b);
      actions.append(b);
    });

    box.append(h,p,actions);
    overlay.append(box);
    host.append(overlay);

    document.addEventListener(
      'keydown',handleKeys,true
    );

    requestAnimationFrame(() => {
      if (options.focusConfirm) {
        buttons.at(-1)?.focus();
      } else {
        buttons[0]?.focus();
      }
    });
  });
}

async function remove(id=selected) {
  if (modalOpen) return;

  const n = notes.find(x =>
    x.id === id && !x.deleted
  );

  if (!n) return;

  const choice = await dialog(
    'メモをゴミ箱に移動しますか？',
    `「${label(n)}」\n\n`+
    'ゴミ箱から復元できます。\n'+
    'Enterキーで削除、Escキーでキャンセルできます。',
    ['キャンセル','ゴミ箱へ'],
    {
      enterIndex:1,
      focusConfirm:true,
      danger:true
    }
  );

  if (choice !== 1) return;

  await queue;

  if (failed) {
    await dialog(
      '保存エラー',
      '保存に失敗しているため削除を中止しました。'
    );
    return;
  }

  const old = {...n};

  const tombstone = {
    ...n,
    deleted:true,
    deletedAt:iso(),
    updatedAt:iso()
  };

  try {
    await enqueue(() => transaction([tombstone]));

    Object.assign(n,tombstone);

    if (selected === id) {
      selected = null;
      updateEditor();
      showScreen('list');
    }

    render();
    scheduleSync();

    undoInfo = {id:n.id};

    toast(
      'メモをゴミ箱に移動しました',
      true
    );
  } catch(e) {
    Object.assign(n,old);

    await dialog(
      '削除エラー',
      String(e.message || e)
    );
  }
}

async function exportJSON() {

    await dialog(

    );
    return;
  }

  const all = (await getAll()).filter(
    n => !n.deleted
  );

  const blob = new Blob([
    JSON.stringify({
      format:'mimi-sync-v1',
      exportedAt:iso(),
      notes:all
    },null,2)
  ],{
    type:'application/json'
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download =
    'SUGUBackup_'+iso().slice(0,10)+'.json';

  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    10000
  );
}

async function importJSON(file) {
  if (!file) return;

  try {
    const data = JSON.parse(
      await file.text()
    );

    if (
      data.format !== 'mimi-sync-v1' ||
      !Array.isArray(data.notes)
    ) {
      throw Error(
        '対応していないJSONバックアップです'
      );
    }

    const incoming = new Map();

    for (const raw of data.notes) {
      if (
        !raw ||
        typeof raw.id !== 'string' ||
        !raw.id
      ) continue;

      incoming.set(raw.id,{
        ...normalizeNote(raw),
        deleted:false,
        deletedAt:''
      });
    }

    const known = new Set(
      notes.map(n => n.id)
    );

    const add = [...incoming.values()]
      .filter(n => !known.has(n.id));

    const choice = await dialog(
      'バックアップを取り込みますか？',
      `ファイル内：${incoming.size}件\n`+
      `新規追加：${add.length}件\n`+
      '既存メモは上書きしません。',
      ['キャンセル','取り込む']
    );

    if (choice !== 1) return;

    save();
    await queue;

    if (failed)
      throw Error('編集中のメモを保存できません');

    if (add.length)
      await enqueue(() => transaction(add));

    notes = await getAll();

    render();
    scheduleSync();

    await dialog(
      '取り込み完了',
      `${add.length}件追加しました。`
    );
  } catch(e) {
    await dialog(
      '取り込みエラー',
      String(e.message || e)
    );
  }
}

async function loadFirebase() {
  const base =
    'https://www.gstatic.com/firebasejs/13.3.0/';

  const [appMod,authMod,dbMod] =
    await Promise.all([
      import(base+'firebase-app.js'),
      import(base+'firebase-auth.js'),
      import(base+'firebase-firestore.js')
    ]);

  const app = appMod.initializeApp(
    firebaseConfig
  );

  auth = authMod.getAuth(app);
  firestore = dbMod.getFirestore(app);
  firebase = {authMod,dbMod};

  authMod.onAuthStateChanged(
    auth,
    async user => {
      const generation = ++accountGeneration;

      clearTimeout(syncTimer);
      clearInterval(syncInterval);

      syncEnabled = false;
      cloudUser = user;
      syncError = '';

      if (user) {
        try {
          syncEnabled =
            (await getMeta(syncKey(user.uid))) === true;
        } catch(e) {
          console.error(e);
        }
      }

      if (generation !== accountGeneration)
        return;

      updateAccountUI();

      if (syncEnabled && user) {
        syncNow();

        syncInterval = setInterval(() => {
          if (
            !document.hidden &&
            navigator.onLine
          ) syncNow();
        },15000);
      }
    },
    error => {
      console.error(error);
      $('account').textContent = '認証エラー';
    }
  );
}

async function login() {
  if (!firebase) {
    await dialog(
      '準備中',
      'Firebaseを読み込んでいます。少し待ってから試してください。'
    );
    return;
  }

  try {
    const provider =
      new firebase.authMod.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:'select_account'

    await firebase.authMod.signInWithPopup(
      auth,provider
    );
  } catch(e) {
    console.error(e);

    await dialog(

      String(e.code || e.message || e)+
      '\nAndroidでポップアップが開けない場合は、ChromeでSUGUのURLを直接開いてください。'
    );
  }
}

async function startSync() {
  if (!cloudUser || syncEnabled) return;

  const user = cloudUser;

  const choice = await dialog(
    '初回同期を開始しますか？',
    `ログイン中：${user.email || 'Googleアカウント'}\n\n`+
    '端末内のメモとクラウドのメモを統合します。\n'+
    '同じIDのメモは更新日時が新しい方を優先します。\n'+
    '先にJSONバックアップを保存してください。',
    ['キャンセル','同期を開始']
  );

  if (
    choice !== 1 ||
    cloudUser?.uid !== user.uid
  ) return;

  save();
  await queue;

  if (failed) {
    await dialog(
      '同期を中止',
      '端末内への保存に失敗しています。'
    );
    return;
  }

  try {
    await setMeta(syncKey(user.uid),true);

    syncEnabled = true;
    updateAccountUI();

    syncInterval = setInterval(() => {
      if (
        !document.hidden &&
        navigator.onLine
      ) syncNow();
    },15000);

    await syncNow();
  } catch(e) {
    syncEnabled = false;

    await setMeta(
      syncKey(user.uid),false
    ).catch(console.error);

    updateAccountUI();

    await dialog(
      '同期開始エラー',
      String(e.message || e)
    );
  }
}

async function syncNow() {
  if (
    !syncEnabled ||
    !cloudUser ||
    !firebase ||
    !navigator.onLine
  ) return;

  if (syncing) {
    syncAgain = true;
    return;
  }

  syncing = true;

  const uid = cloudUser.uid;
  const generation = accountGeneration;
  const {dbMod} = firebase;

  const collection = dbMod.collection(
    firestore,'users',uid,'notes'
  );

  try {
    save();
    await queue;

    if (failed)
      throw Error('端末内の保存に失敗しています');

    $('status').textContent = '同期中';

    const remoteSnap =
      await dbMod.getDocs(collection);

    if (
      generation !== accountGeneration ||
      cloudUser?.uid !== uid ||
      !syncEnabled
    ) return;

    const remote = new Map();

    remoteSnap.forEach(d =>
      remote.set(
        d.id,
        normalizeNote(d.data(),d.id)
      )
    );

    const local = new Map(
      (await getAll()).map(
        n => [n.id,normalizeNote(n)]
      )
    );

    const download = [];
    const upload = [];

    for (const [id,r] of remote) {
      const l = local.get(id);

      if (
        !l ||
        dateValue(r.updatedAt) >
        dateValue(l.updatedAt)
      ) {
        download.push(r);
      }
    }

    for (const [id,l] of local) {
      const r = remote.get(id);

      if (
        !r ||
        dateValue(l.updatedAt) >
        dateValue(r.updatedAt)
      ) {
        upload.push(l);
      }
    }

    if (
      generation !== accountGeneration ||
      cloudUser?.uid !== uid ||
      !syncEnabled
    ) return;

    await queue;

    const latest = new Map(
      (await getAll()).map(
        n => [n.id,n]
      )
    );

    const safeDownload = download.filter(r => {
      const now = latest.get(r.id);
      const old = local.get(r.id);

      if (!now) return true;
      if (!old) return false;

      return dateValue(now.updatedAt) <=
        dateValue(old.updatedAt);
    });

    if (safeDownload.length) {
      await enqueue(
        () => transaction(safeDownload)
      );

      notes = await getAll();

      if (!current() && selected) {
        selected = null;
        updateEditor();
        showScreen('list');
      } else if (
        safeDownload.some(n => n.id === selected) &&
        document.activeElement !== $('title') &&
        document.activeElement !== $('body') &&
        !document.activeElement?.classList
          .contains('check-text')
      ) {
        updateEditor();
      }

      render();
    }

    for (const n of upload) {
      if (
        generation !== accountGeneration ||
        cloudUser?.uid !== uid ||
        !syncEnabled
      ) return;

      const newest = (await getAll())
        .find(x => x.id === n.id);

      if (!newest) continue;

      const latestRemote = remote.get(n.id);

      if (
        latestRemote &&
        dateValue(latestRemote.updatedAt) >=
        dateValue(newest.updatedAt)
      ) continue;

      await dbMod.setDoc(
        dbMod.doc(collection,n.id),
        normalizeNote(newest)
      );
    }

    syncError = '';
    $('status').textContent =
      '保存済み・同期済み';
  } catch(e) {
    console.error('SUGU sync:',e);

    syncError = String(
      e.code || e.message || e
    );

    $('status').textContent =
      '端末保存済み・同期失敗';
  } finally {
    syncing = false;

    if (syncAgain) {
      syncAgain = false;
      scheduleSync();
    }
  }
}

function openSettings() {
  if (modalOpen) return;

  modalOpen = true;

  const host = $('dialogs');
  host.replaceChildren();

  const overlay = document.createElement('div');
  overlay.className = 'overlay';

  const box = document.createElement('div');
  box.className = 'modal';
  box.setAttribute('role','dialog');
  box.setAttribute('aria-modal','true');

  const heading = document.createElement('h2');
  heading.textContent = 'SUGU の設定';

  const tabs = document.createElement('div');
  tabs.className = 'settings-tabs';

  const list = document.createElement('div');
  list.className = 'settings-list';

  const note = document.createElement('div');
  note.className = 'settings-note';
  note.textContent =
    '設定はこの端末に保存されます。'+
    '機能をオフにしても、メモやお気に入りなどのデータは削除されません。'+
    '端末保存・バックアップ機能は常に有効です。';

  const actions = document.createElement('div');
  actions.className = 'actions';

  const close = document.createElement('button');
  close.className = 'action primary';
  close.textContent = '閉じる';

  function finish() {
    modalOpen = false;
    host.replaceChildren();

    document.removeEventListener(
      'keydown',handleKey,true
    );

    $('settings').focus();
  }

  function handleKey(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      finish();
    }
  }

  close.onclick = finish;

  actions.append(close);

  function renderSettings() {
    tabs.replaceChildren();
    list.replaceChildren();

    for (const group of SETTING_GROUPS) {
      const tab = document.createElement('button');

      tab.className =
        'settings-tab' +
        (group.id === settingsTab ? ' active' : '');

      tab.textContent = group.name;

      tab.onclick = () => {
        settingsTab = group.id;
        renderSettings();
      };

      tabs.append(tab);
    }

    const group = SETTING_GROUPS.find(
      g => g.id === settingsTab
    );

    if (!group) return;

    for (const [key,name,desc] of group.items) {
      const row = document.createElement('div');
      row.className = 'setting-row';

      const info = document.createElement('div');
      info.className = 'setting-info';

      const title = document.createElement('span');
      title.className = 'setting-name';
      title.textContent = name;

      const description = document.createElement('span');
      description.className = 'setting-desc';
      description.textContent = desc;

      info.append(title,description);

      const toggle = document.createElement('button');

      toggle.className =
        'switch' + (settings[key] ? ' on' : '');

      toggle.setAttribute('role','switch');
      toggle.setAttribute('aria-label',name);
      toggle.setAttribute(
        'aria-checked',String(settings[key])
      );

      toggle.onclick = () => {
        settings[key] = !settings[key];

        saveSettings();
        applySettings();
        renderSettings();
      };

      row.append(info,toggle);
      list.append(row);
    }
  }

  box.append(
    heading,tabs,list,note,actions
  );

  overlay.append(box);
  host.append(overlay);

  document.addEventListener(
    'keydown',handleKey,true
  );

  renderSettings();

  requestAnimationFrame(
    () => tabs.querySelector('button')?.focus()
  );
}

function isEditableTarget(target) {
  if (!(target instanceof Element))
    return false;

  return !!target.closest(
    'input,textarea,select,[contenteditable="true"],[role="textbox"]'
  );
}

function isListFocused() {
  const active = document.activeElement;

  if (active?.closest?.('#list'))
    return true;

  if (
    matchMedia('(max-width:700px)').matches &&
    screen === 'list'
  ) return true;

  if (
    active === document.body ||
    active === document.documentElement ||
    active === $('list')
  ) return true;

  return false;
}

    db = await openDB();
    notes = await getAll();

    loadSettings();

    ghostDismissedDay =
      localGet('sugu-ghost-dismiss') || '';

    sortMode = localGet('sugu-sort') || 'updated';

    if (
      !['updated','created','title'].includes(sortMode)
    ) sortMode = 'updated';

    $('sort').value = sortMode;

    const last = localGet('mimi-last-id');

    selected = last && notes.some(
      n => n.id === last && !n.deleted
    ) ? last : null;

    updateEditor();
    applySettings();

    const previous =
      localGet('sugu-screen') || 'list';

    history.replaceState(
      {sugu:'list'},'',location.href
    );

    showScreen('list');

    if (
      previous === 'edit' &&
      current()
    ) openEditorHistory();

    $('status').textContent = '保存済み';

    if (
      new URL(location.href)
        .searchParams.has('shared')
    ) {
      await receivePendingShare();

      const url = new URL(location.href);
      url.searchParams.delete('shared');

      history.replaceState(
        history.state,
        '',
        url.pathname+url.search+url.hash
      );
    }
  } catch(e) {
    await dialog(
      '起動エラー',
      '端末内の保存領域を開けませんでした。\n'+
      String(e.message || e)
    );
    return;
  }

  $('title').addEventListener('input',save);
  $('body').addEventListener('input',save);
  $('body').addEventListener('blur',updateLinks);

  $('new').onclick = () => create();
  $('sideNew').onclick = () => create();

  $('paste').onclick = pasteNew;
  $('stats').onclick = showStats;
  $('copy').onclick = copyBody;
  $('mode').onclick = toggleChecklist;

  $('pin').onclick = () => {
    if (selected)
      toggleField(selected,'pinned');
  };

  $('ear').onclick = () => {
    if (selected)
      toggleField(selected,'ear');
  };

  $('remove').onclick = () => remove();

  $('settings').onclick = openSettings;

  $('openList').onclick = goList;

  $('closeList').onclick = () => {
    showScreen('edit');
  };

  $('list').onclick = e => {
    if (e.target.closest('button'))
      return;

    const item = e.target.closest('.item');

    if (!item?.dataset.id)
      return;

    if (filter === 'trash') {
      restoreNote(item.dataset.id);
    } else {
      choose(item.dataset.id,false);
    }
  };

  $('list').onkeydown = e => {
    const item = e.target.closest('.item');

    if (
      item &&
      e.key === 'Enter' &&
      !e.target.closest('button')
    ) {
      e.preventDefault();

      if (filter === 'trash')
        restoreNote(item.dataset.id);
      else
        choose(item.dataset.id,false);
    }
  };

  $('search').oninput = () => {
    visibleLimit = 10;
    $('list').scrollTop = 0;
    render();
  };

  $('sort').onchange = e => {
    sortMode = e.target.value;

    localSet('sugu-sort',sortMode);

    visibleLimit = 10;
    $('list').scrollTop = 0;

    render();
  };

  document.querySelectorAll('.chip').forEach(b => {
    b.onclick = () => {
      filter = b.dataset.filter;
      visibleLimit = 10;
      $('list').scrollTop = 0;

      updateFilterUI();
    };
  });

  $('toastUndo').onclick = async () => {
    if (!undoInfo) return;

    const id = undoInfo.id;
    undoInfo = null;

    $('toast').classList.add('hide');

    await restoreNote(id);
  };

  $('export').onclick = exportJSON;

  $('import').onclick = () =>
    $('file').click();

  $('file').onchange = async e => {
    await importJSON(e.target.files[0]);
    e.target.value = '';
  };

  $('login').onclick = login;
  $('logout').onclick = logout;
  $('startSync').onclick = startSync;
  $('syncMenu').onclick = syncMenu;

  document.addEventListener('keydown',e => {
    if (modalOpen) return;

    if (
      e.ctrlKey &&
      e.key.toLowerCase() === 'n'
    ) {
      e.preventDefault();
      create();
      return;
    }

    if (
      e.key === 'Delete' &&
      settings.deleteKey &&
      !e.repeat &&
      !e.isComposing &&
      !e.ctrlKey &&
      !e.altKey &&
      !e.metaKey &&
      !isEditableTarget(e.target) &&
      isListFocused() &&
      selected &&
      current()
    ) {
      e.preventDefault();
      remove(selected);
      return;
    }

    if (e.key === 'Escape')
      goList();
  });

  window.addEventListener('popstate',e => {
    if (
      e.state?.sugu === 'edit' &&
      current()
    ) {
      showScreen('edit');
    } else {
      showScreen('list');
    }
  });

  document.addEventListener(
    'visibilitychange',
    () => {
      if (document.hidden) {
        save();
      } else if (syncEnabled) {
        syncNow();
      }
    }
  );

  window.addEventListener('online',() => {
    if (syncEnabled)
      syncNow();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener(
      'message',
      async e => {
        if (
          e.data?.type !== 'SUGU_SHARED'
        ) return;

        await queue;
        notes = await getAll();

        const n = notes.find(x =>
          x.id === e.data.id && !x.deleted
        );

        if (n) {
          choose(n.id,false);
          scheduleSync();
        }

        render();
      }
    );
  }

  if (
    'serviceWorker' in navigator &&
    location.protocol === 'https:'
  ) {
    navigator.serviceWorker
      .register('./sw.js')
      .catch(console.warn);
  }

  // 端末内のメモを先に表示する。
  // Firebaseは起動後に読み込む。
  loadFirebase().catch(e => {
    console.error(
      'Firebase initialization:',e
    );

    $('account').textContent =
      'クラウド接続不可';
  });
}

init();
</script>
</body>
</html>
