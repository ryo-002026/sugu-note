
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3eb">
<meta name="description" content="SUGU | 思いついたら、すぐ書ける。">
<link rel="manifest" href="./manifest.webmanifest">
<title>SUGU</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  color:#3b3833;background:#f7f3eb;
  --paper:#fffdf9;--cream:#f7f3eb;--ink:#3b3833;
  --muted:#8d867b;--line:#e9e1d5;--sage:#637b68;
  --sage-soft:#e8eee7;--clay:#b8795d;
  --gold:#bb9455;--danger:#b96b62;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
button,input,textarea,select{font:inherit}
button{border:0;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible{
  outline:2px solid var(--sage);outline-offset:2px;
}
.hide{display:none!important}
.app{
  display:grid;grid-template-columns:350px minmax(0,1fr);
  height:100dvh;overflow:hidden;
}
.side{
  display:flex;flex-direction:column;min-height:0;
  background:var(--cream);border-right:1px solid var(--line);
}
.toolbar{
  display:flex;align-items:center;gap:4px;
  min-height:60px;padding:7px 10px;flex-shrink:0;
}
.side>.toolbar{border-bottom:1px solid var(--line)}
.brand{
  flex:1;min-width:0;padding-left:8px;color:#665244;
  font-family:Georgia,serif;font-size:25px;
  font-weight:700;letter-spacing:.16em;
}
.btn{
  display:grid;place-items:center;min-width:38px;
  width:38px;height:38px;border-radius:12px;font-size:19px;
}
.btn:hover:not(:disabled){background:#eee7dc}
.btn.active{color:var(--clay)}
.refreshing .refresh-glyph{
  display:inline-block;animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.status{
  font-size:12px;color:var(--muted);overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;
}
.spacer{flex:1}
.syncbar{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  padding:8px 16px;background:#f1ede5;
  border-bottom:1px solid var(--line);font-size:11px;
}
.syncbar span{flex:1;min-width:70px;overflow:hidden;text-overflow:ellipsis}
.syncbtn{
  padding:6px 9px;border:1px solid #dfd5c9;
  border-radius:9px;background:var(--paper);font-size:11px;
}
.search{
  width:calc(100% - 32px);margin:15px 16px 11px;
  padding:12px 14px;border:1px solid var(--line);
  border-radius:13px;background:var(--paper);
  color:var(--ink);font-size:14px;
}
.filters{display:flex;gap:5px;padding:0 16px 12px;flex-wrap:wrap}
.chip{
  padding:8px 12px;border-radius:20px;
  color:#877c70;font-size:12px;
}
.chip.active{
  background:var(--sage-soft);color:#526b57;font-weight:700;
}
.sortbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:0 16px 10px;
}
.count{color:var(--muted);font-size:12px}
.sort-select{
  max-width:155px;padding:6px 8px;border:1px solid var(--line);
  border-radius:9px;background:var(--paper);
  color:#71695f;font-size:12px;
}
.list{
  flex:1;min-height:0;overflow-y:auto;
  overscroll-behavior:contain;padding:0 12px 16px;
}
.year-heading{
  display:flex;align-items:center;gap:12px;
  margin:17px 5px 10px;color:#8b7563;
  font-family:Georgia,serif;font-size:19px;letter-spacing:.07em;
}
.year-heading:after{
  content:"";flex:1;height:1px;background:#dcd2c5;
}
.item{
  position:relative;display:flex;align-items:stretch;
  min-height:108px;margin-bottom:7px;
  border:1px solid #eee7de;border-radius:14px;
  background:var(--paper);
  box-shadow:0 6px 28px #5546380c;
  cursor:pointer;overflow:hidden;
}
.item:hover{border-color:#d8cbbd}
.item.active{
  border-color:#a6b7a6;background:#f8faf5;
  box-shadow:inset 3px 0 var(--sage),0 6px 28px #5546380c;
}
.item-date{
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;flex-shrink:0;width:69px;
  padding:9px 3px;border-right:1px solid #f0e9e1;
  color:var(--clay);
}
.item-month{font-size:11px;font-weight:700;letter-spacing:.08em}
.item-day{
  font-family:Georgia,serif;font-size:37px;
  line-height:1.08;font-variant-numeric:lining-nums;
}
.item-time{
  margin-top:7px;color:#998a7c;font-size:11px;
  font-variant-numeric:tabular-nums;
}
.item-content{
  flex:1;min-width:0;padding:15px 7px 11px 13px;
}
.item-content strong{
  display:block;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:14px;line-height:1.5;
}
.item-content p{
  display:-webkit-box;margin:7px 0 0;overflow:hidden;
  color:#8d867d;font-size:12px;line-height:1.6;
  -webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow-wrap:anywhere;
}
.item-meta{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:6px;margin-top:8px;font-size:11px;
}
.check-progress,.copied-marker,.conflict-marker{
  display:inline-block;padding:3px 7px;border-radius:7px;
  background:var(--sage-soft);color:#5c775e;font-size:11px;
}
.copied-marker{background:#f4e8d9;color:#a1734c}
.conflict-marker{background:#f8e7e5;color:#a85f59}
.item-actions{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;flex-shrink:0;gap:1px;
  width:37px;padding:7px 5px 7px 0;
}
.item-icon{
  display:grid;place-items:center;width:29px;height:29px;
  border-radius:8px;color:#b8b0a5;font-size:18px;
}
.item-icon:hover{background:#f0eae1;color:var(--ink)}
.item-icon.on{color:var(--gold)}
.item-icon.pin-on{color:var(--sage)}
.item-icon.delete{color:#c4b6ae;font-size:20px}
.item-icon.delete:hover{background:#f8e8e5;color:var(--danger)}
.ghost-card{
  display:block;min-height:0;padding:15px 42px 15px 17px;
  border-color:#e4d7df;background:#f5eff3;
}
.ghost-card strong{display:block;color:#80677b;font-size:13px}
.ghost-card p{
  margin:7px 0 0;color:#917b8d;font-size:12px;line-height:1.6;
}
.ghost-close{
  position:absolute;top:7px;right:8px;
  width:30px;height:30px;border-radius:8px;font-size:19px;
}
.side-bottom{
  display:flex;align-items:stretch;gap:8px;
  padding:11px 13px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:var(--cream);flex-shrink:0;
}
.bottom-icon{
  display:grid;place-items:center;width:44px;min-width:44px;
  min-height:49px;border:1px solid #ded4c8;
  border-radius:13px;background:var(--paper);
  color:#867769;font-size:20px;
}
.create-button{
  flex:1;min-width:0;min-height:49px;border-radius:13px;
  background:var(--sage);color:white;
  font-size:14px;font-weight:700;
}
.create-button:hover{background:#506b55}
.editor{
  display:flex;flex-direction:column;min-width:0;
  min-height:0;background:#fffdf9;
}
.editor>.toolbar{border-bottom:1px solid #f0ebe3}
.edit{
  display:flex;flex-direction:column;flex:1;min-height:0;
  width:100%;max-width:920px;margin:auto;padding:23px 35px;
}
#title{
  width:100%;padding:13px 0;border:0;outline:0;
  background:none;color:var(--ink);
  font-size:24px;font-weight:700;
}
#body{
  flex:1;min-height:0;width:100%;padding:10px 0 20px;
  border:0;outline:0;resize:none;background:none;
  color:var(--ink);font-size:16px;line-height:1.85;
}
.checklist{
  flex:1;min-height:0;overflow-y:auto;padding:9px 0 20px;
}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input[type=checkbox]{
  width:19px;height:19px;accent-color:var(--sage);flex-shrink:0;
}
.check-text{
  flex:1;min-width:0;padding:9px 3px;border:0;
  border-bottom:1px solid #eee9e2;background:transparent;
  outline:0;font-size:16px;
}
.check-text.done{color:#a09c93;text-decoration:line-through}
.check-delete{width:30px;height:34px;color:#b7aca1;font-size:18px}
.check-add{padding:12px 3px;color:var(--sage);font-size:14px}
.edit-tools{
  display:flex;align-items:center;gap:8px;
  padding:5px 0 11px;flex-shrink:0;
}
.mode-button{
  padding:8px 12px;border:1px solid var(--line);
  border-radius:10px;color:#81796e;font-size:12px;
}
.mode-button.on{
  background:var(--sage-soft);
  border-color:#c9d8c8;color:var(--sage);
}
.mode-hint{color:var(--muted);font-size:11px}
.link-preview{
  flex-shrink:0;max-height:120px;overflow-y:auto;
  padding:8px 0;border-top:1px solid var(--line);font-size:13px;
}
.link-preview:empty{display:none}
.link-preview small{
  display:block;margin-bottom:5px;color:var(--muted);
}
.link-preview a{
  display:block;padding:5px 0;color:var(--sage);overflow-wrap:anywhere;
}
.copy-success{background:var(--sage-soft);color:var(--sage)}
.empty-editor{
  flex:1;display:grid;place-items:center;padding:20px;
  color:#aaa297;font-size:14px;text-align:center;
}
.overlay{
  position:fixed;inset:0;z-index:30;display:grid;
  place-items:center;padding:18px;background:#332a2580;
}
.modal{
  width:min(480px,100%);max-height:90dvh;overflow:auto;
  padding:25px;border:1px solid #eee5db;
  border-radius:19px;background:var(--paper);
  box-shadow:0 20px 70px #21170e30;
}
.modal h2{margin:0 0 10px;color:#584b40;font-size:19px}
.modal p{
  white-space:pre-line;line-height:1.8;
  color:#756d63;font-size:14px;
}
.actions{
  display:flex;justify-content:flex-end;flex-wrap:wrap;
  gap:10px;margin-top:22px;
}
.action{
  padding:11px 16px;border-radius:10px;
  background:#eee8df;font-size:13px;
}
.action.primary{background:var(--sage);color:white}
.action.danger{background:var(--danger);color:white}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  z-index:40;display:flex;align-items:center;gap:12px;
  max-width:calc(100vw - 30px);padding:12px 16px;
  border-radius:12px;background:#514a40;color:white;
  box-shadow:0 6px 28px #0003;font-size:13px;
}
.toast button{color:#d8ebd8;font-weight:700;white-space:nowrap}
.settings-tabs{
  display:flex;gap:5px;overflow-x:auto;padding:5px 0 13px;
  border-bottom:1px solid var(--line);
}
.settings-tab{
  flex-shrink:0;padding:9px 11px;border-radius:9px;
  color:#8a8075;font-size:12px;
}
.settings-tab.active{
  background:var(--sage-soft);color:var(--sage);font-weight:700;
}
.settings-list{padding-top:7px}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px 0;border-bottom:1px solid #eee8e0;
}
.setting-info{flex:1;min-width:0}
.setting-name{display:block;font-size:13px;font-weight:700}
.setting-desc{
  display:block;margin-top:5px;color:var(--muted);
  font-size:11px;line-height:1.5;
}
.switch{
  position:relative;flex-shrink:0;width:43px;height:25px;
  border-radius:20px;background:#d4cdc3;
}
.switch:after{
  content:"";position:absolute;top:3px;left:3px;
  width:19px;height:19px;border-radius:50%;
  background:white;box-shadow:0 1px 4px #0002;
  transition:transform .15s;
}
.switch.on{background:var(--sage)}
.switch.on:after{transform:translateX(18px)}
.settings-note{
  margin-top:16px;color:var(--muted);
  font-size:11px;line-height:1.7;
}
.mobile{display:none}
@media(max-width:700px){
  .app{display:block}
  .side{
    position:fixed;inset:0;z-index:10;
    transform:translateX(-100%);
    transition:transform .12s ease;
  }
  .side.open{transform:translateX(0)}
  .editor{height:100dvh}
  .mobile{display:grid}
  .edit{padding:13px 19px}
  #title{font-size:21px}
  .btn{min-width:35px;width:35px}
  .list{padding:0 11px 15px}
  .item{min-height:105px}
  .item-date{width:68px}
  .item-day{font-size:36px}
}
@media(min-width:701px){
  .item-icon:not(.on):not(.pin-on){opacity:.65}
  .item:hover .item-icon{opacity:1}
}
</style>

<body>
<div class="app">
  <aside id="side" class="side">
    <header class="toolbar">
      <button id="closeList" class="btn mobile" title="一覧を閉じる">‹</button>
      <div class="brand">SUGU</div>
      <button id="refresh" class="btn" title="メモを更新">
        <span class="refresh-glyph">↻</span>
      </button>
      <button id="settings" class="btn" title="設定">⚙</button>
      <button id="import" class="btn" title="JSONを取り込む">⇩</button>
      <button id="export" class="btn" title="JSONバックアップ">⇧</button>
    </header>

    <div class="syncbar">
      <span id="account">ログインしていません</span>
      <button id="login" class="syncbtn">Googleログイン</button>
      <button id="logout" class="syncbtn hide">ログアウト</button>
      <button id="startSync" class="syncbtn hide">同期を開始</button>
    </div>

    <input id="search" class="search" placeholder="メモを検索">
    <div class="filters">
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="ear">★ お気に入り</button>
      <button class="chip" data-filter="trash">ゴミ箱</button>
    </div>
    <div class="sortbar">
      <span id="count" class="count"></span>
      <select id="sort" class="sort-select">
        <option value="updated">更新が新しい順</option>
        <option value="created">作成が新しい順</option>
        <option value="title">タイトル順</option>
      </select>
    </div>
    <div id="list" class="list" tabindex="-1"></div>
    <div class="side-bottom">
      <button id="paste" class="bottom-icon" title="貼り付け">▣</button>
      <button id="sideNew" class="create-button">＋ すぐメモ</button>
      <button id="stats" class="bottom-icon" title="記録">▥</button>
    </div>
  </aside>

  <main class="editor">
    <header class="toolbar">
      <button id="openList" class="btn mobile" title="一覧">‹</button>
      <span id="status" class="status">読み込み中</span>
      <div class="spacer"></div>
      <button id="syncMenu" class="btn" title="クラウド同期">☁</button>
      <button id="new" class="btn" title="新規メモ">＋</button>
      <button id="copy" class="btn" title="本文コピー">□</button>
      <button id="pin" class="btn" title="ピン留め">♧</button>
      <button id="ear" class="btn" title="お気に入り">☆</button>
      <button id="remove" class="btn" title="削除">×</button>
    </header>

    <div id="editArea" class="edit">
      <input id="title" placeholder="タイトル" autocomplete="off">
      <div class="edit-tools">
        <button id="mode" class="mode-button">
          ☑ チェックリストにする
        </button>
        <span id="modeHint" class="mode-hint"></span>
      </div>
      <textarea id="body" placeholder="メモを書く…"
        spellcheck="false"></textarea>
      <div id="checklist" class="checklist hide"></div>
      <div id="links" class="link-preview"></div>
    </div>

    <div id="emptyEditor" class="empty-editor hide">
      一覧からメモを選んでください
    </div>
  </main>
</div>

<input id="file" type="file" accept=".json,application/json" class="hide">
<div id="dialogs"></div>
<div id="toast" class="toast hide">
  <span id="toastText"></span>
  <button id="toastUndo" class="hide">元に戻す</button>
</div>

<script type="module">
'use strict';

const $ = id => document.getElementById(id);
const DB = 'mimi-sync-db';
const TABLE = 'notes';
const META = 'syncMeta';

const firebaseConfig = {
  apiKey:"AIzaSyDPlUYQ6vzg8rBQAdt_M-i3hOm8VRkB6FE",
  authDomain:"sugu-43386.firebaseapp.com",
  databaseURL:"https://sugu-43386-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"sugu-43386",
  storageBucket:"sugu-43386.firebasestorage.app",
  messagingSenderId:"1056209931526",
  appId:"1:1056209931526:web:111fca8d731e2e1a452287"
};

const DEFAULT_SETTINGS = {
  favorites:true,pin:true,checklistProgress:true,
  ghost:true,listDelete:true,checklist:true,
  links:true,copy:true,paste:true,stats:true,
  trash:true,undo:true,sort:true,
  deleteKey:true,syncControls:true
};

const SETTING_GROUPS = [
  {id:'list',name:'一覧',items:[
    ['favorites','お気に入り','★の表示と絞り込み'],
    ['pin','ピン留め','メモを一覧の上に固定'],
    ['checklistProgress','進捗表示','完了数を一覧に表示'],
    ['ghost','メモの亡霊','昔のメモを紹介'],
    ['listDelete','削除ボタン','一覧に×を表示']
  ]},
  {id:'edit',name:'編集',items:[
    ['checklist','チェックリスト','チェックリストへの切り替え'],
    ['links','リンク一覧','本文のURLを表示'],
    ['copy','本文コピー','コピーボタン']
  ]},
  {id:'extra',name:'追加機能',items:[
    ['paste','クリップボード','コピーした文章から新規メモ'],
    ['stats','どうでもいい記録','メモ数などを表示'],
    ['trash','ゴミ箱','削除したメモを復元'],

  ]},
  {id:'system',name:'システム',items:[
    ['sort','並べ替え','並べ替えメニュー'],
    ['deleteKey','Deleteキー','一覧選択中の削除操作'],
    ['syncControls','クラウド同期','ログインと同期操作']
  ]}
];

let settings = {...DEFAULT_SETTINGS};
let db;
let notes = [];
let selected = null;
let filter = 'all';
let sortMode = 'updated';
let screen = 'list';
let queue = Promise.resolve();
let saveError = null;
let modalOpen = false;
let settingsTab = 'list';
let copiedId = null;
let undoInfo = null;
let toastTimer = null;
let searchTimer = null;
let listCheckScheduled = false;
let listItems = [];
let renderedCount = 0;
let renderedYear = null;
let ghostNote = null;
let ghostInserted = false;
let ghostDismissedDay = '';
let listDirty = false;

let firebase = null;
let auth = null;
let firestore = null;
let cloudUser = null;
let syncEnabled = false;
let syncing = false;
let syncRequested = false;
let syncPromise = null;
let syncTimer = null;
let lastSync = 0;
let accountGeneration = 0;
let syncError = '';
let manualRefreshing = false;

const iso = () => new Date().toISOString();
const clone = obj => JSON.parse(JSON.stringify(obj));

function localGet(key) {
  try{return localStorage.getItem(key)}
  catch(e){return null}
}
function localSet(key,value) {
  try{localStorage.setItem(key,String(value))}
  catch(e){}
}
function loadSettings() {
  try{
    const saved = JSON.parse(localGet('sugu-settings-v1')||'{}');
    for(const key of Object.keys(DEFAULT_SETTINGS)){
      if(typeof saved[key]==='boolean')
        settings[key]=saved[key];
    }
  }catch(e){}
}
function saveSettings() {
  localSet('sugu-settings-v1',JSON.stringify(settings));
}
function timestamp(value) {
  if(typeof value==='number')
    return value<1e11?value*1000:value;
  if(!value)return 0;
  const s=String(value);
  if(/^\d{10,13}$/.test(s)){
    const n=Number(s);
    return n<1e11?n*1000:n;
  }
  const n=Date.parse(s)||Date.parse(s.replace(' ','T'));
  return Number.isFinite(n)?n:0;
}
function todayKey(){
  const d=new Date();
  return [d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')].join('-');
}
function dateParts(n){
  const t=timestamp(n.createdAt||n.updatedAt);
  if(!t)return {
    year:'日付なし',month:'--',day:'--',time:'--:--'
  };
  const d=new Date(t);
  const two=x=>String(x).padStart(2,'0');
  return {
    year:String(d.getFullYear()),
    month:two(d.getMonth()+1),
    day:two(d.getDate()),
    time:two(d.getHours())+':'+two(d.getMinutes())
  };
}

/*
 * contentAt:
 * 本文やタイトルを最後に編集した時刻。
 *
 * updatedAt:
 * クラウド同期の変更検知用。
 *
 * 旧データにはcontentAtがないため、
 * 最初はupdatedAtを利用する。
 */
function normalizeNote(raw,id=raw.id){
  const updated=String(raw.updatedAt||'');
  return {
    id:String(id),
    title:String(raw.title??''),
    body:String(raw.body??''),
    ear:!!raw.ear,
    pinned:!!raw.pinned,
    checklist:!!raw.checklist,
    checks:Array.isArray(raw.checks)
      ?raw.checks.map(Boolean):[],
    createdAt:String(raw.createdAt||''),
    updatedAt:updated,
    contentAt:String(raw.contentAt||updated||raw.createdAt||''),
    deleted:!!raw.deleted,
    deletedAt:String(raw.deletedAt||'')
  };
}
function current(){
  return notes.find(n=>n.id===selected&&!n.deleted);
}
function label(n){
  return n.title||n.body.split('\n').find(Boolean)||'無題';
}
function sorted(trash=false){
  const arr=notes.filter(n=>trash?n.deleted:!n.deleted);
  arr.sort((a,b)=>{
    if(!trash&&!!a.pinned!==!!b.pinned)
      return a.pinned?-1:1;
    if(trash)
      return timestamp(b.deletedAt||b.updatedAt)-
        timestamp(a.deletedAt||a.updatedAt);
    if(sortMode==='created')
      return timestamp(b.createdAt)-timestamp(a.createdAt);
    if(sortMode==='title'){
      const t=label(a).localeCompare(label(b),'ja');
      if(t)return t;
    }
    return timestamp(b.contentAt||b.updatedAt)-
      timestamp(a.contentAt||a.updatedAt);
  });
  return arr;
}

/* IndexedDB */

function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB,2);
    r.onupgradeneeded=()=>{
      const d=r.result;
      if(!d.objectStoreNames.contains(TABLE))
        d.createObjectStore(TABLE,{keyPath:'id'});
      if(!d.objectStoreNames.contains(META))
        d.createObjectStore(META,{keyPath:'key'});
    };
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
    r.onblocked=()=>reject(Error('保存領域が使用中です'));
  });
}
function dbGetAll(){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(TABLE,'readonly')
      .objectStore(TABLE).getAll();
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
function metaGet(key){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(META,'readonly')
      .objectStore(META).get(key);
    r.onsuccess=()=>resolve(r.result?.value);
    r.onerror=()=>reject(r.error);
  });
}
function metaPut(key,value){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(META,'readwrite');
    tx.objectStore(META).put({key,value});
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  });
}
function dbPutMany(items){
  if(!items.length)return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(TABLE,'readwrite');
    const store=tx.objectStore(TABLE);
    for(const n of items)store.put(clone(n));
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
    tx.onabort=()=>reject(tx.error);
  });
}
function enqueue(job){
  const task=queue.then(job);
  queue=task.catch(e=>{
    saveError=e;
    $('status').textContent='保存失敗';
    console.error('SUGU save:',e);
  });
  return task;
}
async function waitForSaves(){
  await queue;
  if(saveError)throw saveError;
}
function storeNote(n){
  const snapshot=clone(n);
  saveError=null;
  $('status').textContent='保存中';
  const task=enqueue(()=>dbPutMany([snapshot]));
  task.then(()=>{
    if(selected===snapshot.id&&!saveError)
      $('status').textContent='保存済み';
    scheduleSync();
  }).catch(()=>{});
  return task;
}
function markChanged(n,content=false){
  const now=iso();
  n.updatedAt=now;
  if(content)n.contentAt=now;
  storeNote(n);
  scheduleListRefresh(content);
}
function scheduleListRefresh(content=false){
  listDirty=true;
  clearTimeout(listRefreshTimer);
  /*
   * 入力中に一覧を何度も作り直さない。
   * 一覧を表示するときに最新状態を反映する。
   */
  if(screen==='list'||!matchMedia('(max-width:700px)').matches){
    listRefreshTimer=setTimeout(()=>{
      if(listDirty){
        listDirty=false;
        render();
      }
    },content?450:70);
  }
}

  );

function dialog(title,message,choices=['閉じる'],options={}){
  return new Promise(resolve=>{
    modalOpen=true;
    const host=$('dialogs');
    host.replaceChildren();
    const previous=document.activeElement;
    const overlay=document.createElement('div');
    overlay.className='overlay';
    const box=document.createElement('div');
    box.className='modal';
    box.setAttribute('role','dialog');
    box.setAttribute('aria-modal','true');
    const h=document.createElement('h2');
    h.textContent=title;
    const p=document.createElement('p');
    p.textContent=message;
    const actions=document.createElement('div');
    actions.className='actions';
    const buttons=[];
    let finished=false;

    function finish(index){
      if(finished)return;
      finished=true;
      modalOpen=false;
      host.replaceChildren();
      document.removeEventListener('keydown',keys,true);
      if(previous?.isConnected)
        previous.focus({preventScroll:true});
      resolve(index);
    }
    function keys(e){
      if(e.key==='Escape'){
        e.preventDefault();
        e.stopPropagation();
        finish(0);
      }else if(e.key==='Enter'&&!e.isComposing){
        e.preventDefault();
        e.stopPropagation();
        /*
         * 削除確認だけEnterで確定。
         * その他の確認はEnterでキャンセル。
         */
        finish(options.enterIndex??0);
      }else if(e.key==='Tab'){
        const i=buttons.indexOf(document.activeElement);
        if(e.shiftKey&&i<=0){
          e.preventDefault();
          buttons.at(-1)?.focus();
        }else if(!e.shiftKey&&i===buttons.length-1){
          e.preventDefault();
          buttons[0]?.focus();
        }
      }
    }
    choices.forEach((name,i)=>{
      const b=document.createElement('button');
      b.className='action';
      if(i===choices.length-1)b.classList.add('primary');
      if(options.danger&&i===choices.length-1){
        b.classList.remove('primary');
        b.classList.add('danger');
      }
      b.textContent=name;
      b.onclick=()=>finish(i);
      buttons.push(b);
      actions.append(b);
    });
    box.append(h,p,actions);
    overlay.append(box);
    host.append(overlay);
    document.addEventListener('keydown',keys,true);
    requestAnimationFrame(()=>{
      (options.focusConfirm?buttons.at(-1):buttons[0])?.focus();
    });
  });
}

/* 一覧 */

function viewedMap(){
  try{return JSON.parse(localGet('sugu-viewed-v1')||'{}')}
  catch(e){return {}}
}
function recordView(id){
  const map=viewedMap();
  map[id]=Date.now();
  const entries=Object.entries(map)
    .sort((a,b)=>b[1]-a[1]).slice(0,1000);
  localSet('sugu-viewed-v1',JSON.stringify(
    Object.fromEntries(entries)
  ));
}
function ghostCandidate(arr){
  if(!settings.ghost||
    ghostDismissedDay===todayKey())return null;
  const viewed=viewedMap();
  const cutoff=Date.now()-30*86400000;
  const old=arr.filter(n=>{
    const last=viewed[n.id]||
      timestamp(n.createdAt||n.updatedAt);
    return last>0&&last<cutoff;
  });
  return old.length
    ?old[Math.floor(Date.now()/86400000)%old.length]
    :null;
}
function makeYear(year){
  const h=document.createElement('div');
  h.className='year-heading';
  h.textContent=year;
  return h;
}
function makeGhost(n){
  const card=document.createElement('div');
  card.className='item ghost-card';
  card.dataset.id=n.id;
  const title=document.createElement('strong');
  title.textContent='👻 メモの亡霊';
  const text=document.createElement('p');
  text.textContent=`「私のこと、覚えていますか。」 ${label(n)}`;
  const close=document.createElement('button');
  close.className='ghost-close';
  close.textContent='×';
  close.title='今日は表示しない';
  close.onclick=e=>{
    e.stopPropagation();
    ghostDismissedDay=todayKey();
    localSet('sugu-ghost-dismiss',ghostDismissedDay);
    render();
  };
  card.append(title,text,close);
  return card;
}
function makeIcon(text,title,fn,className=''){
  const b=document.createElement('button');
  b.className='item-icon '+className;
  b.textContent=text;
  b.title=title;
  b.setAttribute('aria-label',title);
  b.onclick=e=>{
    e.stopPropagation();
    fn();
  };
  return b;
}
function makeItem(n){
  const item=document.createElement('div');
  item.className='item'+(n.id===selected?' active':'');
  item.dataset.id=n.id;
  item.tabIndex=0;
  item.setAttribute('role','button');
  item.setAttribute('aria-label',label(n));

  const d=dateParts(n);
  const date=document.createElement('div');
  date.className='item-date';
  const month=document.createElement('span');
  month.className='item-month';
  month.textContent=d.month+' /';
  const day=document.createElement('span');
  day.className='item-day';
  day.textContent=d.day;
  const time=document.createElement('span');
  time.className='item-time';
  time.textContent=d.time;
  date.append(month,day,time);

  const content=document.createElement('div');
  content.className='item-content';
  const title=document.createElement('strong');
  title.textContent=label(n);
  const preview=document.createElement('p');
  preview.textContent=n.checklist
    ?(n.body.split('\n').filter(Boolean).slice(0,3).join(' / ')||
      'チェックリスト')
    :n.body.replace(/\s+/g,' ').slice(0,140);
  content.append(title,preview);

  const meta=document.createElement('div');
  meta.className='item-meta';

  if(n.checklist&&settings.checklistProgress){
    const lines=n.body?n.body.split('\n'):[];
    const total=lines.filter(x=>x.trim()).length;
    const done=lines.filter((x,i)=>x.trim()&&n.checks[i]).length;
    const badge=document.createElement('span');
    badge.className='check-progress';
    badge.textContent=`☑ ${done}/${total}`;
    meta.append(badge);
  }
  if(copiedId===n.id){
    const badge=document.createElement('span');
    badge.className='copied-marker';
    badge.textContent='✓ コピー済み';
    meta.append(badge);
  }
  if(n.title.startsWith('【競合コピー】')){
    const badge=document.createElement('span');
    badge.className='conflict-marker';
    badge.textContent='同期競合';
    meta.append(badge);
  }
  if(meta.childNodes.length)content.append(meta);

  const actions=document.createElement('div');
  actions.className='item-actions';

  if(filter==='trash'){
    actions.append(makeIcon(
      '↶','メモを復元',()=>restoreNote(n.id)
    ));
  }else{
    if(settings.pin)actions.append(makeIcon(
      n.pinned?'📌':'♧',
      n.pinned?'ピン留め解除':'ピン留め',
      ()=>toggleField(n.id,'pinned'),
      n.pinned?'pin-on':''
    ));
    if(settings.favorites)actions.append(makeIcon(
      n.ear?'★':'☆',
      n.ear?'お気に入り解除':'お気に入り',
      ()=>toggleField(n.id,'ear'),
      n.ear?'on':''
    ));
    if(settings.listDelete)actions.append(makeIcon(
      '×','メモを削除',()=>remove(n.id),'delete'
    ));
  }
  item.append(date,content,actions);
  return item;
}

function render(){
  if(!db)return;
  const root=$('list');
  const scroll=root.scrollTop;
  const desired=Math.max(10,renderedCount);
  const q=$('search').value.trim().toLocaleLowerCase();
  const trash=filter==='trash';

  let all=sorted(trash);
  all=all.filter(n=>
    (filter!=='ear'||n.ear)&&
    (n.title+'\n'+n.body).toLocaleLowerCase().includes(q)
  );

  $('count').textContent=`${all.length}件`;
  ghostNote=!q&&filter==='all'
    ?ghostCandidate(all):null;
  listItems=all;
  renderedCount=0;
  renderedYear=null;
  ghostInserted=false;
  root.replaceChildren();

  while(renderedCount<Math.min(desired,listItems.length))
    appendNext(false);

  if(!listItems.length&&ghostNote){
    root.append(makeGhost(ghostNote));
    ghostInserted=true;
  }
  root.scrollTop=scroll;
  listDirty=false;
  scheduleListCheck();
}
function appendNext(check=true){
  if(renderedCount>=listItems.length)return;
  const root=$('list');
  const start=renderedCount;
  const end=Math.min(start+10,listItems.length);
  const fragment=document.createDocumentFragment();

  for(let i=start;i<end;i++){
    if(i===3&&ghostNote&&!ghostInserted){
      fragment.append(makeGhost(ghostNote));
      ghostInserted=true;
    }
    const n=listItems[i];
    const year=dateParts(n).year;
    if(year!==renderedYear){
      fragment.append(makeYear(year));
      renderedYear=year;
    }
    fragment.append(makeItem(n));
  }
  renderedCount=end;

  if(end===listItems.length&&ghostNote&&!ghostInserted){
    fragment.append(makeGhost(ghostNote));
    ghostInserted=true;
  }
  root.append(fragment);
  if(check)scheduleListCheck();
}
function checkListBottom(){
  if(modalOpen||renderedCount>=listItems.length)return;
  if(matchMedia('(max-width:700px)').matches&&screen!=='list')
    return;
  const root=$('list');
  if(!root.clientHeight||!root.getClientRects().length)return;
  const remaining=root.scrollHeight-root.scrollTop-root.clientHeight;
  if(remaining<=120){
    appendNext(false);
    scheduleListCheck();
  }
}
function scheduleListCheck(){
  if(listCheckScheduled)return;
  listCheckScheduled=true;
  requestAnimationFrame(()=>{
    listCheckScheduled=false;
    checkListBottom();
  });
}

/* 画面切り替え */

function showScreen(next){
  if(screen==='list')lastListScroll=$('list').scrollTop;
  screen=next;
  localSet('sugu-screen',next);

  if(matchMedia('(max-width:700px)').matches)
    $('side').classList.toggle('open',next==='list');

  if(next==='list'){
    if(listDirty)render();
    requestAnimationFrame(()=>{
      $('list').scrollTop=lastListScroll;
      requestAnimationFrame(checkListBottom);
    });
  }
}
function openEditorScreen(){
  if(matchMedia('(max-width:700px)').matches&&
    history.state?.sugu!=='edit'){
    history.pushState({sugu:'edit'},'',location.href);
  }
  showScreen('edit');
}
function goList(){
  if(modalOpen)return;
  if(matchMedia('(max-width:700px)').matches&&
    history.state?.sugu==='edit'){
    history.back();
  }else showScreen('list');
}
function choose(id,focus=false){
  const n=notes.find(x=>x.id===id&&!x.deleted);
  if(!n)return;
  selected=id;
  localSet('mimi-last-id',id);
  recordView(id);
  copiedId=null;
  updateEditor();
  openEditorScreen();
  scheduleListRefresh();
  if(focus)requestAnimationFrame(()=>{
    if(n.checklist)
      $('checklist').querySelector('.check-text')?.focus();
    else $('body').focus();
  });
}

/* 編集 */

function updateLinks(){
  const root=$('links');
  root.replaceChildren();
  if(!settings.links)return;
  const matches=$('body').value.match(
    /https?:\/\/[^\s<>"'「」]+/g
  )||[];
  const urls=[...new Set(matches)].slice(0,20);
  if(!urls.length)return;
  const small=document.createElement('small');
  small.textContent='本文中のリンク';
  root.append(small);
  for(const raw of urls){
    const clean=raw.replace(/[.,。、）)\]】]+$/g,'');
    try{
      const url=new URL(clean);
      if(!['http:','https:'].includes(url.protocol))continue;
      const a=document.createElement('a');
      a.href=url.href;
      a.target='_blank';
      a.rel='noopener noreferrer';
      a.textContent=clean;
      root.append(a);
    }catch(e){}
  }
}
function renderChecklist(){
  const root=$('checklist');
  root.replaceChildren();
  const n=current();
  if(!n||!n.checklist)return;
  const lines=n.body?n.body.split('\n'):[''];

  lines.forEach((line,i)=>{
    const row=document.createElement('div');
    row.className='check-row';
    const box=document.createElement('input');
    box.type='checkbox';
    box.checked=!!n.checks[i];
    const text=document.createElement('input');
    text.type='text';
    text.className='check-text'+(box.checked?' done':'');
    text.value=line;
    text.placeholder='項目を入力';
    const del=document.createElement('button');
    del.className='check-delete';
    del.textContent='×';

    box.onchange=()=>{
      n.checks[i]=box.checked;
      text.classList.toggle('done',box.checked);
      markChanged(n,true);
    };
    text.oninput=()=>{
      const arr=n.body?n.body.split('\n'):[''];
      arr[i]=text.value;
      n.body=arr.join('\n');
      $('body').value=n.body;
      markChanged(n,true);
    };
    text.onkeydown=e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        addChecklistRow(i+1);
      }
    };
    del.onclick=()=>{
      const arr=n.body?n.body.split('\n'):[''];
      arr.splice(i,1);
      n.checks.splice(i,1);
      n.body=arr.join('\n');
      $('body').value=n.body;
      markChanged(n,true);
      renderChecklist();
    };
    row.append(box,text,del);
    root.append(row);
  });

  const add=document.createElement('button');
  add.className='check-add';
  add.textContent='＋ 項目を追加';
  add.onclick=()=>addChecklistRow(lines.length);
  root.append(add);
}
function addChecklistRow(index){
  const n=current();
  if(!n||!n.checklist)return;
  const lines=n.body?n.body.split('\n'):[];
  lines.splice(index,0,'');
  n.checks.splice(index,0,false);
  n.body=lines.join('\n');
  $('body').value=n.body;
  markChanged(n,true);
  renderChecklist();
  $('checklist').querySelectorAll('.check-text')[index]?.focus();
}
function updateEditor(){
  const n=current();
  $('editArea').classList.toggle('hide',!n);
  $('emptyEditor').classList.toggle('hide',!!n);
  for(const id of ['copy','pin','ear','remove'])
    $(id).disabled=!n;
  if(!n){
    $('title').value='';
    $('body').value='';
    $('links').replaceChildren();
    $('checklist').replaceChildren();
    return;
  }
  $('title').value=n.title;
  $('body').value=n.body;
  $('ear').textContent=n.ear?'★':'☆';
  $('pin').textContent=n.pinned?'📌':'♧';
  $('copy').textContent=copiedId===n.id?'✓':'□';
  $('copy').classList.toggle('copy-success',copiedId===n.id);
  $('mode').textContent=n.checklist
    ?'☑ チェックリスト ON'
    :'☐ チェックリストにする';
  $('mode').classList.toggle('on',n.checklist);
  $('modeHint').textContent=n.checklist?'1行につき1項目':'';
  $('body').classList.toggle('hide',n.checklist);
  $('checklist').classList.toggle('hide',!n.checklist);
  renderChecklist();
  updateLinks();
}
function saveEditor(){
  const n=current();
  if(!n)return;
  const title=$('title').value;
  const body=n.checklist?n.body:$('body').value;
  if(title===n.title&&body===n.body)return;
  n.title=title;
  n.body=body;
  copiedId=null;
  markChanged(n,true);
}
async function create(focus=true,body='',title=''){
  const now=iso();
  const n={
    id:crypto.randomUUID(),title,body,
    ear:false,pinned:false,checklist:false,checks:[],
    createdAt:now,updatedAt:now,contentAt:now,
    deleted:false,deletedAt:''
  };
  try{
    await enqueue(()=>dbPutMany([n]));
    notes.push(n);
    if(filter!=='all'){
      filter='all';
      updateFilterUI();
    }
    choose(n.id,focus);
    scheduleSync();
  }catch(e){
    await dialog('保存エラー',String(e.message||e));
  }
}
async function toggleField(id,field){
  const n=notes.find(x=>x.id===id&&!x.deleted);
  if(!n)return;
  n[field]=!n[field];
  /*
   * ★とピン留めはcontentAtを変えない。
   */
  markChanged(n,false);
  if(selected===id)updateEditor();
}
function toggleChecklist(){
  const n=current();
  if(!n)return;
  n.checklist=!n.checklist;
  if(n.checklist){
    const lines=n.body?n.body.split('\n'):[''];
    n.checks=lines.map((_,i)=>!!n.checks[i]);
  }
  markChanged(n,true);
  updateEditor();
}
async function copyBody(){
  const n=current();
  if(!n)return;
  const id=n.id;
  try{
    await navigator.clipboard.writeText(n.body);
    copiedId=id;
    if(selected===id)updateEditor();
    scheduleListRefresh();
    toast('本文をコピーしました');
  }catch(e){
    await dialog('コピーできません',
      'クリップボードの権限を確認してください。');
  }
}
async function pasteNew(){
  try{
    const text=await navigator.clipboard.readText();
    if(!text){
      await dialog('クリップボードが空です',
        'コピーした文章が見つかりません。');
      return;
    }
    await create(true,text);
  }catch(e){
    await dialog('読み取りエラー',
      'クリップボードの権限を確認してください。');
  }
}
async function showStats(){
  const all=notes.filter(n=>!n.deleted);
  const lengths=all.map(n=>(n.title+n.body).length);
  const total=lengths.reduce((a,b)=>a+b,0);
  const longest=Math.max(0,...lengths);
  const shortest=lengths.length?Math.min(...lengths):0;
  await dialog('どうでもいい記録',
    `メモ総数：${all.length}件\n`+
    `全文字数：${total.toLocaleString()}字\n`+
    `最長メモ：${longest}字\n`+
    `最短メモ：${shortest}字\n`+
    `チェックリスト：${all.filter(n=>n.checklist).length}件\n`+
    `ピン留め：${all.filter(n=>n.pinned).length}件`);

/* ゴミ箱 */

async function remove(id=selected){
  if(modalOpen)return;
  const n=notes.find(x=>x.id===id&&!x.deleted);
  if(!n)return;
  const choice=await dialog(
    'メモをゴミ箱に移動しますか？',
    `「${label(n)}」\n\n`+
    'Enterで削除、Escでキャンセルできます。',
    ['キャンセル','ゴミ箱へ'],
    {enterIndex:1,focusConfirm:true,danger:true}
  );
  if(choice!==1)return;
  try{
    await waitForSaves();
    const tomb={
      ...n,deleted:true,deletedAt:iso(),updatedAt:iso()
    };
    await enqueue(()=>dbPutMany([tomb]));
    Object.assign(n,tomb);
    if(selected===id){
      selected=null;
      updateEditor();
      showScreen('list');
    }
    undoInfo={id};
    render();
    scheduleSync();
    toast('ゴミ箱に移動しました',true);

    await dialog('削除エラー',String(e.message||e));
  }
}
async function restoreNote(id){
  const n=notes.find(x=>x.id===id&&x.deleted);
  if(!n)return;
  const restored={
    ...n,deleted:false,deletedAt:'',updatedAt:iso()
  };
  try{
    await enqueue(()=>dbPutMany([restored]));
    Object.assign(n,restored);
    render();
    scheduleSync();
    toast('メモを復元しました');
  }catch(e){
    await dialog('復元エラー',String(e.message||e));
  }
}

/* JSONバックアップ */

async function exportJSON(){
  saveEditor();
  try{
    await waitForSaves();
    const all=(await dbGetAll()).filter(n=>!n.deleted);
    const blob=new Blob([JSON.stringify({
      format:'mimi-sync-v1',
      exportedAt:iso(),
      notes:all
    },null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='SUGUBackup_'+iso().slice(0,10)+'.json';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  }catch(e){
    await dialog('バックアップエラー',String(e.message||e));
  }
}
async function importJSON(file){
  if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(data.format!=='mimi-sync-v1'||!Array.isArray(data.notes))
      throw Error('対応していないJSON形式です');
    const incoming=new Map();
    for(const raw of data.notes){
      if(!raw||typeof raw.id!=='string'||!raw.id)continue;
      incoming.set(raw.id,normalizeNote(raw));
    }
    const known=new Set(notes.map(n=>n.id));
    const add=[...incoming.values()]
      .filter(n=>!known.has(n.id));
    const choice=await dialog('バックアップを取り込みますか？',
      `ファイル内：${incoming.size}件\n`+
      `新規追加：${add.length}件\n`+
      '既存メモは上書きしません。',
      ['キャンセル','取り込む']
    );
    if(choice!==1)return;
    saveEditor();
    await waitForSaves();
    await enqueue(()=>dbPutMany(add));
    notes=await dbGetAll();
    render();
    scheduleSync();
    await dialog('取り込み完了',`${add.length}件追加しました。`);
  }catch(e){
    await dialog('取り込みエラー',String(e.message||e));
  }
}

/*
 * 以前の15秒ごとの全件取得を廃止。
 * 端末内での編集後は遅延同期、
 * 画面復帰時は前回同期から5分以上なら確認。
 *
 * ただし同期方式は全件取得型のまま。
 * Firebaseの読み取りを完全な差分取得に
 * 変えるには別途設計が必要。
 */
const MIN_BACKGROUND_SYNC=5*60*1000;
const SYNC_AFTER_EDIT=5000;

function syncKey(uid){return 'enabled:'+uid}
function baselineKey(uid){
  return 'sugu-sync-baseline:'+uid;
}
function noteFingerprint(n){
  /*
   * 比較対象を固定した文字列にする。
   * JSON.stringifyの順序をnormalizeNoteで統一。
   */
  return JSON.stringify(normalizeNote(n));
}
function baselineRead(uid){
  try{
    return JSON.parse(
      localGet(baselineKey(uid))||'{}'
    );
  }catch(e){return {}}
}
function baselineWrite(uid,data){
  localSet(baselineKey(uid),JSON.stringify(data));
}
function updateAccountUI(){

      (syncEnabled?' ・ 同期有効':'')

  $('logout').classList.toggle('hide',!cloudUser);
  $('startSync').classList.toggle(
    'hide',!cloudUser||syncEnabled
  );
}
function scheduleSync(){
  if(!syncEnabled||!cloudUser)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{
    if(!document.hidden&&navigator.onLine)
      syncNow();
  },SYNC_AFTER_EDIT);
}
async function loadFirebase(){
  const base='https://www.gstatic.com/firebasejs/13.3.0/';
  const [appMod,authMod,dbMod]=await Promise.all([
    import(base+'firebase-app.js'),
    import(base+'firebase-auth.js'),
    import(base+'firebase-firestore.js')
  ]);
  const app=appMod.initializeApp(firebaseConfig);
  auth=authMod.getAuth(app);
  firestore=dbMod.getFirestore(app);
  firebase={authMod,dbMod};

  authMod.onAuthStateChanged(auth,async user=>{
    const generation=++accountGeneration;
    clearTimeout(syncTimer);
    cloudUser=user;
    syncEnabled=false;
    syncError='';
    if(user){
      try{

          (await metaGet(syncKey(user.uid)))===true;
      }catch(e){console.error(e)}

    if(generation!==accountGeneration)return;
    updateAccountUI();
    if(syncEnabled&&user)syncNow();
  },e=>{
    console.error(e);
    $('account').textContent='認証エラー';
  });

async function logout(){

async function startSync(){
  if(!cloudUser||syncEnabled)return;
  const user=cloudUser;
  const choice=await dialog('初回同期を開始しますか？',
    '端末内とクラウドのメモを統合します。\n'+
    '先にJSONバックアップを保存してください。',
    ['キャンセル','同期を開始']);

      .catch(console.error);

/*
 * 同期の基本方針
 *
 * 1. 端末内の保存完了を待つ
 * 2. クラウドの状態を取得
 * 3. 前回同期時の状態と比較
 * 4. 両側で変更されたメモは競合コピーを作る
 * 5. 取得後にさらに編集されたメモは上書きしない
 *
 * Firestore全件取得型であり、サーバー側の
 * 原子的な競合制御ではない。
 * 完全な同時編集対応ではない点に注意。
 */
async function syncNow(){
  if(!syncEnabled||!cloudUser||!firebase||
    !navigator.onLine)return;

  if(syncing){
    syncRequested=true;
    return syncPromise;
  }

  syncing=true;
  syncError='';
  const uid=cloudUser.uid;
  const generation=accountGeneration;

  syncPromise=(async()=>{
    try{
      saveEditor();
      await waitForSaves();

      $('status').textContent='同期中';

      const {dbMod}=firebase;
      const collection=dbMod.collection(
        firestore,'users',uid,'notes'
      );

      const remoteSnap=await dbMod.getDocs(collection);

      if(generation!==accountGeneration||
        cloudUser?.uid!==uid||!syncEnabled)return;

      const remote=new Map();
      remoteSnap.forEach(d=>{
        remote.set(d.id,normalizeNote(d.data(),d.id));
      });

      const local=new Map(
        (await dbGetAll()).map(n=>[n.id,normalizeNote(n)])
      );

      const baseline=baselineRead(uid);
      const download=[];
      const upload=[];
      const conflicts=[];
      const newBaseline={...baseline};

      const ids=new Set([...local.keys(),...remote.keys()]);

      for(const id of ids){
        const l=local.get(id);
        const r=remote.get(id);
        const old=baseline[id];

        if(!l&&r){
          download.push(r);
          newBaseline[id]=noteFingerprint(r);
          continue;
        }
        if(l&&!r){
          upload.push(l);
          continue;
        }
        if(!l||!r)continue;

        const lf=noteFingerprint(l);
        const rf=noteFingerprint(r);

        if(lf===rf){
          newBaseline[id]=lf;
          continue;
        }

        const localChanged=old!==undefined&&lf!==old;
        const remoteChanged=old!==undefined&&rf!==old;

        if(localChanged&&remoteChanged){
          /*
           * 両側で変更された場合はローカル版を
           * 別メモとして保存してから、
           * 元IDをクラウド版に合わせる。
           */
          const now=iso();
          const copy={
            ...l,
            id:crypto.randomUUID(),
            title:'【競合コピー】'+label(l),
            createdAt:now,
            updatedAt:now,
            contentAt:now,
            deleted:false,
            deletedAt:''
          };
          conflicts.push(copy);
          download.push(r);
          newBaseline[id]=rf;
          continue;
        }

        if(localChanged&&!remoteChanged){
          upload.push(l);
          continue;
        }
        if(remoteChanged&&!localChanged){
          download.push(r);
          newBaseline[id]=rf;
          continue;
        }

        /*
         * 初回同期など比較基準がない場合。
         * 内容が違えば新しい方を採用し、
         * 古い方は競合コピーとして残す。
         */
        if(timestamp(l.updatedAt)>=timestamp(r.updatedAt)){
          const now=iso();
          conflicts.push({
            ...r,id:crypto.randomUUID(),
            title:'【競合コピー】'+label(r),
            createdAt:now,updatedAt:now,contentAt:now,
            deleted:false,deletedAt:''
          });
          upload.push(l);
        }else{
          const now=iso();
          conflicts.push({
            ...l,id:crypto.randomUUID(),
            title:'【競合コピー】'+label(l),
            createdAt:now,updatedAt:now,contentAt:now,
            deleted:false,deletedAt:''
          });
          download.push(r);
          newBaseline[id]=rf;
        }
      }

      await waitForSaves();

      if(generation!==accountGeneration||
        cloudUser?.uid!==uid||!syncEnabled)return;

      const latest=new Map(
        (await dbGetAll()).map(n=>[n.id,normalizeNote(n)])
      );

      const safeDownload=download.filter(r=>{
        const before=local.get(r.id);
        const now=latest.get(r.id);
        if(!before)return !now;
        return !!now&&
          noteFingerprint(now)===noteFingerprint(before);
      });

      const conflictIds=new Set(
        safeDownload.map(n=>n.id)
      );
      const safeConflicts=conflicts.filter(n=>
        !latest.has(n.id)
      );

      if(safeDownload.length||safeConflicts.length){
        await enqueue(()=>dbPutMany([
          ...safeDownload,...safeConflicts
        ]));
        notes=await dbGetAll();

        /*
         * 編集欄にカーソルがあるときは、
         * クラウド取得によって表示内容を
         * 不用意に書き換えない。
         */
        if(!isEditableTarget(document.activeElement)){
          if(selected&&!current())selected=null;
          updateEditor();
        }
        render();
      }

      for(const n of upload){
        if(generation!==accountGeneration||
          cloudUser?.uid!==uid||!syncEnabled)return;

        const currentLocal=(await dbGetAll())
          .find(x=>x.id===n.id);

        if(!currentLocal)continue;

        /*
         * 同期処理の途中で編集された場合は
         * 次の同期に回す。
         */
        if(noteFingerprint(currentLocal)!==
          noteFingerprint(n)){
          syncRequested=true;
          continue;
        }

        await dbMod.setDoc(
          dbMod.doc(collection,n.id),
          normalizeNote(currentLocal)
        );
        newBaseline[n.id]=noteFingerprint(currentLocal);
      }

      for(const n of safeConflicts){
        if(generation!==accountGeneration||
          cloudUser?.uid!==uid||!syncEnabled)return;

        await dbMod.setDoc(
          dbMod.doc(collection,n.id),
          normalizeNote(n)
        );
        newBaseline[n.id]=noteFingerprint(n);
      }

      /*
       * 同期が成功したものだけを基準として記録。
       * 取得途中で再編集されたメモは次回に回す。
       */
      for(const r of safeDownload)
        newBaseline[r.id]=noteFingerprint(r);

      baselineWrite(uid,newBaseline);
      lastSync=Date.now();
      syncError='';
      $('status').textContent='保存済み・同期済み';

      if(safeConflicts.length)
        toast(`競合コピーを${safeConflicts.length}件保存しました`);
    }catch(e){
      console.error('SUGU sync:',e);
      syncError=String(e.code||e.message||e);
      $('status').textContent='端末保存済み・同期失敗';
    }finally{
      syncing=false;
    }
  })();

  await syncPromise;

  if(syncRequested){
    syncRequested=false;
    scheduleSync();
  }
}
async function manualRefresh(){
  if(manualRefreshing||modalOpen)return;
  manualRefreshing=true;
  const button=$('refresh');
  const scroll=$('list').scrollTop;
  button.disabled=true;
  button.classList.add('refreshing');
  $('status').textContent='更新中…';

  try{
    saveEditor();
    await waitForSaves();

    if(syncEnabled&&cloudUser){
      if(!navigator.onLine)
        throw Error('オフラインです');
      await syncNow();
      if(syncError)throw Error(syncError);
    }

    await waitForSaves();
    notes=await dbGetAll();

    if(selected&&!current())selected=null;

    if(!isEditableTarget(document.activeElement))
      updateEditor();

    render();
    $('list').scrollTop=scroll;
    $('status').textContent=
      syncEnabled&&cloudUser
        ?'保存済み・同期済み':'保存済み';
    toast('メモを更新しました');
  }catch(e){
    $('status').textContent='更新できませんでした';
    toast(String(e.message||e));
  }finally{
    manualRefreshing=false;
    button.disabled=false;
    button.classList.remove('refreshing');
  }
}
async function syncMenu(){
  if(!cloudUser){
    await login();
    return;
  }
  if(!syncEnabled){
    await startSync();
    return;
  }
  const choice=await dialog('SUGU クラウド同期',
    `アカウント：${cloudUser.email||''}\n`+
    `状態：${syncError||'同期有効'}`,
    ['閉じる','今すぐ同期','ログアウト']);
  if(choice===1)await manualRefresh();
  if(choice===2)await logout();
}

function updateFilterUI(){
  document.querySelectorAll('.chip').forEach(b=>{
    b.classList.toggle('active',b.dataset.filter===filter);
  });

}
function applySettings(){
  const pairs=[
    ['ear','favorites'],['pin','pin'],['copy','copy'],
    ['mode','checklist'],['modeHint','checklist'],
    ['paste','paste'],['stats','stats'],
    ['sort','sort'],['syncMenu','syncControls']
  ];
  for(const [id,key] of pairs)
    $(id).classList.toggle('hide',!settings[key]);

  document.querySelector('.syncbar')
    .classList.toggle('hide',!settings.syncControls);

  document.querySelector('[data-filter="ear"]')
    .classList.toggle('hide',!settings.favorites);

  document.querySelector('[data-filter="trash"]')
    .classList.toggle('hide',!settings.trash);

  if((filter==='ear'&&!settings.favorites)||
    (filter==='trash'&&!settings.trash))
    filter='all';

  updateFilterUI();
  updateLinks();
}
function openSettings(){
  if(modalOpen)return;
  modalOpen=true;
  const host=$('dialogs');
  host.replaceChildren();
  const overlay=document.createElement('div');
  overlay.className='overlay';
  const box=document.createElement('div');
  box.className='modal';
  const h=document.createElement('h2');
  h.textContent='SUGU の設定';
  const tabs=document.createElement('div');
  tabs.className='settings-tabs';
  const list=document.createElement('div');
  list.className='settings-list';
  const note=document.createElement('div');
  note.className='settings-note';
  note.textContent=
    '設定はこの端末に保存されます。'+
    '機能をオフにしてもメモは削除されません。';
  const actions=document.createElement('div');
  actions.className='actions';
  const close=document.createElement('button');
  close.className='action primary';
  close.textContent='閉じる';

  function finish(){
    modalOpen=false;
    host.replaceChildren();
    document.removeEventListener('keydown',keys,true);
  }
  function keys(e){
    if(e.key==='Escape'){
      e.preventDefault();
      e.stopPropagation();
      finish();
    }
  }
  close.onclick=finish;
  actions.append(close);

  function draw(){
    tabs.replaceChildren();
    list.replaceChildren();

    for(const group of SETTING_GROUPS){
      const b=document.createElement('button');
      b.className='settings-tab'+
        (settingsTab===group.id?' active':'');
      b.textContent=group.name;
      b.onclick=()=>{
        settingsTab=group.id;
        draw();
      };
      tabs.append(b);
    }
    const group=SETTING_GROUPS.find(g=>g.id===settingsTab);
    for(const [key,name,desc] of group.items){
      const row=document.createElement('div');
      row.className='setting-row';
      const info=document.createElement('div');
      info.className='setting-info';
      const title=document.createElement('span');
      title.className='setting-name';
      title.textContent=name;
      const description=document.createElement('span');
      description.className='setting-desc';
      description.textContent=desc;
      info.append(title,description);

      const toggle=document.createElement('button');
      toggle.className='switch'+(settings[key]?' on':'');
      toggle.setAttribute('role','switch');
      toggle.setAttribute('aria-checked',String(settings[key]));
      toggle.setAttribute('aria-label',name);
      toggle.onclick=()=>{
        settings[key]=!settings[key];
        saveSettings();
        applySettings();
        draw();
      };
      row.append(info,toggle);
      list.append(row);
    }
  }

  box.append(h,tabs,list,note,actions);
  overlay.append(box);
  host.append(overlay);
  document.addEventListener('keydown',keys,true);
  draw();
}

/* キーボードと初期化 */

function isEditableTarget(target){
  return target instanceof Element&&!!target.closest(
    'input,textarea,select,[contenteditable="true"],[role="textbox"]'
  );
}
function canDeleteWithKey(){
  if(!settings.deleteKey||modalOpen||
    !selected||!current()||filter==='trash')return false;

  const active=document.activeElement;

  /*
   * PCでは一覧のメモが選択されているときだけ。
   * スマホのDeleteキー操作は対象外。
   */
  if(matchMedia('(max-width:700px)').matches)return false;

  return !!active?.closest?.('#list');
}
async function receivePendingShare(){
  const id=await metaGet('sugu-pending-share')
    .catch(()=>null);
  if(!id)return false;
  await waitForSaves();
  notes=await dbGetAll();
  const n=notes.find(x=>x.id===id&&!x.deleted);
  if(n){
    choose(n.id,false);
    scheduleSync();
  }
  await metaPut('sugu-pending-share',null)
    .catch(console.error);
  return !!n;
}
async function init(){
  try{
    db=await openDB();
    notes=await dbGetAll();
    loadSettings();
    ghostDismissedDay=localGet('sugu-ghost-dismiss')||'';
    sortMode=localGet('sugu-sort')||'updated';
    if(!['updated','created','title'].includes(sortMode))
      sortMode='updated';
    $('sort').value=sortMode;

    const last=localGet('mimi-last-id');
    selected=last&&notes.some(
      n=>n.id===last&&!n.deleted
    )?last:null;

    updateEditor();
    applySettings();

    const previous=localGet('sugu-screen')||'list';
    history.replaceState({sugu:'list'},'',location.href);
    showScreen('list');
    if(previous==='edit'&&current())openEditorScreen();

    $('status').textContent='保存済み';

    if(new URL(location.href).searchParams.has('shared')){
      await receivePendingShare();
      const url=new URL(location.href);
      url.searchParams.delete('shared');
      history.replaceState(history.state,'',
        url.pathname+url.search+url.hash);
    }
  }catch(e){
    await dialog('起動エラー',
      '保存領域を開けませんでした。\n'+String(e.message||e));
    return;
  }

  $('title').addEventListener('input',saveEditor);
  $('body').addEventListener('input',saveEditor);
  $('body').addEventListener('blur',updateLinks);

  $('new').onclick=()=>create();
  $('sideNew').onclick=()=>create();
  $('refresh').onclick=manualRefresh;
  $('settings').onclick=openSettings;
  $('paste').onclick=pasteNew;
  $('stats').onclick=showStats;
  $('copy').onclick=copyBody;
  $('mode').onclick=toggleChecklist;

  $('pin').onclick=()=>{
    if(selected)toggleField(selected,'pinned');
  };
  $('ear').onclick=()=>{
    if(selected)toggleField(selected,'ear');
  };

  $('openList').onclick=goList;

  $('list').onkeydown=e=>{
    const item=e.target.closest('.item');
    if(item&&e.key==='Enter'&&!e.target.closest('button')){
      e.preventDefault();
      if(filter==='trash')restoreNote(item.dataset.id);
      else choose(item.dataset.id,false);
    }
  };
  $('list').addEventListener('scroll',()=>{
    lastListScroll=$('list').scrollTop;
    scheduleListCheck();
  },{passive:true});

  window.addEventListener('resize',scheduleListCheck,
    {passive:true});

  $('search').oninput=()=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{
      $('list').scrollTop=0;
      lastListScroll=0;
      renderedCount=0;
      render();
    },150);
  };
  $('sort').onchange=e=>{
    sortMode=e.target.value;
    localSet('sugu-sort',sortMode);
    $('list').scrollTop=0;
    lastListScroll=0;
    renderedCount=0;
    render();
  };
  document.querySelectorAll('.chip').forEach(b=>{
    b.onclick=()=>{
      filter=b.dataset.filter;
      $('list').scrollTop=0;
      lastListScroll=0;
      renderedCount=0;
      updateFilterUI();
    };
  });

  $('toastUndo').onclick=async()=>{
    if(!undoInfo)return;
    const id=undoInfo.id;
    undoInfo=null;
    $('toast').classList.add('hide');
    await restoreNote(id);
  };
  $('export').onclick=exportJSON;
  $('import').onclick=()=>$('file').click();
  $('file').onchange=async e=>{
    await importJSON(e.target.files[0]);
    e.target.value='';
  };

  $('login').onclick=login;
  $('logout').onclick=logout;
  $('startSync').onclick=startSync;
  $('syncMenu').onclick=syncMenu;

  document.addEventListener('keydown',e=>{
    if(modalOpen)return;
    if(e.ctrlKey&&e.key.toLowerCase()==='n'){
      e.preventDefault();
      create();
      return;
    }
    if(e.key==='Delete'&&!e.repeat&&!e.isComposing&&
      !e.ctrlKey&&!e.altKey&&!e.metaKey&&
      !isEditableTarget(e.target)&&canDeleteWithKey()){
      e.preventDefault();
      remove(selected);
      return;
    }
    if(e.key==='Escape')goList();
  });

  window.addEventListener('popstate',e=>{
    if(e.state?.sugu==='edit'&&current())
      showScreen('edit');
    else showScreen('list');
  });

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){
      saveEditor();
    }else{
      scheduleListCheck();
      if(syncEnabled&&
        Date.now()-lastSync>=MIN_BACKGROUND_SYNC)
        syncNow();
    }
  });

  window.addEventListener('online',()=>{
    if(syncEnabled)syncNow();
  });

  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener(
      'message',async e=>{
        if(e.data?.type!=='SUGU_SHARED')return;
        await waitForSaves();
        notes=await dbGetAll();
        const n=notes.find(x=>
          x.id===e.data.id&&!x.deleted
        );
        if(n){
          choose(n.id,false);
          scheduleSync();
        }
        render();
      }
    );
  }

  if('serviceWorker' in navigator&&
    location.protocol==='https:'){
    navigator.serviceWorker.register('./sw.js')
      .catch(console.warn);
  }

  /*
   * 先に端末内のメモを表示し、
   * Firebaseは後から読み込む。
   */
  loadFirebase().catch(e=>{
    console.error('Firebase initialization:',e);
    $('account').textContent='クラウド接続不可';
  });
}

init();
</script>
</body>
</html>
