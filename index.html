<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f9f6">
<meta name="description" content="SUGU | すぐ書ける、端末保存型メモアプリ">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>SUGU</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#26332d;background:#f8f9f6;--green:#27735a;--line:#e2e7e1}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{border:0;background:transparent;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green)}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);height:100dvh}.side{background:white;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.toolbar{height:56px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);flex-shrink:0}.brand{font-weight:750;flex:1;padding-left:6px}.btn{min-width:40px;height:40px;border-radius:10px;font-size:20px}.btn:hover{background:#e7f3ec}.search{margin:12px;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fafbf9;width:calc(100% - 24px)}.filters{display:flex;gap:6px;padding:0 12px 10px}.chip{font-size:13px;padding:8px 12px;border-radius:20px;color:#66766e}.chip.active{background:#e7f3ec;color:var(--green)}.count{padding:0 15px 8px;color:#718077;font-size:12px}.list{overflow:auto;flex:1}.item{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}.item.active{background:#e7f3ec}.item strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item p{font-size:12px;color:#718077;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:5px 0}.item small{color:#85918b}.earmark{position:absolute;right:10px;top:12px;color:var(--green)}.editor{display:flex;flex-direction:column;min-width:0;min-height:0}.status{font-size:12px;color:#728077}.spacer{flex:1}.edit{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;max-width:920px;margin:auto;padding:20px 28px}#title{font-weight:700;font-size:22px;border:0;outline:0;background:none;padding:12px 0}#body{border:0;outline:0;resize:none;background:none;flex:1;min-height:0;line-height:1.75;font-size:16px;padding:8px 0 24px}.mobile{display:none}.hide{display:none!important}.overlay{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px;z-index:30}.modal{background:white;border-radius:16px;padding:22px;width:min(440px,100%)}.modal h2{font-size:18px;margin:0 0 10px}.modal p{white-space:pre-line;line-height:1.7;font-size:14px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.action{padding:10px 15px;border-radius:9px;background:#edf0ec}.action.primary{background:var(--green);color:white}
@media(max-width:700px){.app{display:block}.side{position:fixed;inset:0;z-index:10;transform:translateX(-100%);transition:transform .12s ease}.side.open{transform:translateX(0)}.editor{height:100dvh}.mobile{display:inline-block}.edit{padding:10px 18px}#title{font-size:20px}#body{font-size:16px}}
</style>
</head>
<body>
<div class="app">
<aside id="side" class="side">
 <header class="toolbar"><button id="closeList" class="btn mobile" aria-label="一覧を閉じる">‹</button><div class="brand">SUGU</div><button id="import" class="btn" title="バックアップを取り込む">⇩</button><button id="export" class="btn" title="JSONバックアップを保存">⇧</button><button id="sideNew" class="btn" title="新規メモ">＋</button></header>
 <input id="search" class="search" placeholder="メモを検索" aria-label="メモを検索">
 <div class="filters"><button class="chip active" data-filter="all">すべて</button><button class="chip" data-filter="ear">◢ ドッグイヤー</button></div>
 <div id="count" class="count"></div><div id="list" class="list"></div>
</aside>
<main class="editor">
 <header class="toolbar"><button id="openList" class="btn mobile" title="メモ一覧">☰</button><span id="status" class="status">読み込み中</span><div class="spacer"></div><button id="new" class="btn" title="新規メモ">＋</button><button id="ear" class="btn" title="ドッグイヤー">◇</button><button id="remove" class="btn" title="メモ削除">⌫</button></header>
 <div class="edit"><input id="title" placeholder="タイトル" autocomplete="off" aria-label="タイトル"><textarea id="body" placeholder="メモを書く…" aria-label="メモ本文" spellcheck="false"></textarea></div>
</main>
</div>
<input id="file" type="file" accept=".json,application/json" class="hide"><div id="dialogs"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),DB='mimi-sync-db',TABLE='notes';
let db,notes=[],selected=null,filter='all',queue=Promise.resolve(),version=0,failed=false;
const iso=()=>new Date().toISOString();
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(TABLE))r.result.createObjectStore(TABLE,{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function getAll(){return new Promise((ok,no)=>{const r=db.transaction(TABLE,'readonly').objectStore(TABLE).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function transaction(items,removeId){return new Promise((ok,no)=>{const tx=db.transaction(TABLE,'readwrite'),s=tx.objectStore(TABLE);for(const n of items)s.put({...n});if(removeId)s.delete(removeId);tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)})}
function enqueue(job){const task=queue.then(job);queue=task.catch(e=>{failed=true;$('status').textContent='保存失敗';console.error(e)});return task}
function dateValue(s){if(typeof s==='number')return s<1e11?s*1000:s;if(!s)return 0;const v=String(s);const numeric=Number(v);if(/^\d{10,13}$/.test(v))return numeric<1e11?numeric*1000:numeric;const d=Date.parse(v)||Date.parse(v.replace(' ','T'));return Number.isFinite(d)?d:0}
function sorted(){return [...notes].sort((a,b)=>dateValue(b.updatedAt)-dateValue(a.updatedAt))}
function current(){return notes.find(n=>n.id===selected)}
function label(n){return n.title||n.body.split('\n').find(Boolean)||'無題'}
function render(){const q=$('search').value.toLocaleLowerCase(),list=sorted().filter(n=>(filter==='all'||n.ear)&&(n.title+'\n'+n.body).toLocaleLowerCase().includes(q));$('count').textContent=`${list.length}件 / 全${notes.length}件`;const root=$('list');root.replaceChildren();for(const n of list){const item=document.createElement('div');item.className='item'+(n.id===selected?' active':'');item.dataset.id=n.id;const name=document.createElement('strong');name.textContent=label(n);const preview=document.createElement('p');preview.textContent=n.body.replace(/\s+/g,' ').slice(0,120);const time=document.createElement('small');time.textContent=String(n.updatedAt||'').slice(0,19);item.append(name,preview,time);if(n.ear){const e=document.createElement('span');e.className='earmark';e.textContent='◢';item.append(e)}root.append(item)}}
function choose(id,focus=false){const n=notes.find(x=>x.id===id);if(!n)return;selected=id;version++;try{localStorage.setItem('mimi-last-id',id)}catch(e){}$('title').value=n.title;$('body').value=n.body;$('ear').textContent=n.ear?'◢':'◇';$('status').textContent=failed?'保存失敗':'保存済み';$('side').classList.remove('open');render();if(focus)requestAnimationFrame(()=>$('body').focus())}
function save(){const n=current();if(!n)return;const title=$('title').value,body=$('body').value;if(title===n.title&&body===n.body)return;n.title=title;n.body=body;n.updatedAt=iso();const snapshot={...n},v=++version;failed=false;$('status').textContent='保存中';enqueue(()=>transaction([snapshot])).then(()=>{if(selected===snapshot.id&&version===v)$('status').textContent='保存済み'}).catch(()=>{})}
async function create(focus=true){const n={id:crypto.randomUUID(),title:'',body:'',ear:false,createdAt:iso(),updatedAt:iso()};notes.push(n);try{await enqueue(()=>transaction([n]));choose(n.id,focus)}catch(e){notes=notes.filter(x=>x.id!==n.id);await dialog('保存できません','新規メモを保存できませんでした。')}}
async function toggleEar(){const n=current();if(!n)return;n.ear=!n.ear;n.updatedAt=iso();const snapshot={...n};$('ear').textContent=n.ear?'◢':'◇';await enqueue(()=>transaction([snapshot]));render()}
function dialog(title,message,choices=['閉じる']){return new Promise(ok=>{const host=$('dialogs');host.replaceChildren();const overlay=document.createElement('div'),box=document.createElement('div'),h=document.createElement('h2'),p=document.createElement('p'),actions=document.createElement('div');overlay.className='overlay';box.className='modal';actions.className='actions';h.textContent=title;p.textContent=message;choices.forEach((choice,i)=>{const b=document.createElement('button');b.className='action'+(i===choices.length-1?' primary':'');b.textContent=choice;b.onclick=()=>{host.replaceChildren();ok(i)};actions.append(b)});box.append(h,p,actions);overlay.append(box);host.append(overlay)})}
async function remove(){const n=current();if(!n)return;if(await dialog('メモを削除しますか？','この操作は取り消せません。',['キャンセル','削除'])!==1)return;await queue;if(failed){await dialog('保存エラー','保存に失敗しています。削除は中止しました。');return}try{await enqueue(()=>transaction([],n.id));notes=notes.filter(x=>x.id!==n.id);if(notes.length)choose(sorted()[0].id);else await create(false)}catch(e){await dialog('削除エラー',String(e.message||e))}}
async function exportJSON(){save();await queue;if(failed){await dialog('保存エラー','バックアップ前に保存状態を確認してください。');return}const all=await getAll(),blob=new Blob([JSON.stringify({format:'mimi-sync-v1',exportedAt:iso(),notes:all},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SUGUBackup_'+iso().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function importJSON(file){if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='mimi-sync-v1'||!Array.isArray(data.notes))throw Error('対応していないJSONバックアップです');const incoming=new Map();for(const raw of data.notes){if(!raw||typeof raw!=='object'||typeof raw.id!=='string'||!raw.id)continue;incoming.set(raw.id,{id:raw.id,title:String(raw.title??''),body:String(raw.body??''),ear:!!raw.ear,createdAt:raw.createdAt??'',updatedAt:raw.updatedAt??''})}const known=new Set(notes.map(n=>n.id)),add=[...incoming.values()].filter(n=>!known.has(n.id));if(await dialog('バックアップを取り込みますか？',`ファイル内：${incoming.size}件\n新規追加：${add.length}件\n既存メモは上書きしません。`,['キャンセル','取り込む'])!==1)return;save();await queue;if(failed)throw Error('編集中のメモを保存できません');if(add.length)await enqueue(()=>transaction(add));notes=await getAll();render();await dialog('取り込み完了',`${add.length}件追加しました。現在${notes.length}件です。`)}catch(e){await dialog('取り込みエラー',String(e.message||e))}}
async function init(){try{db=await openDB();notes=await getAll();let last;try{last=localStorage.getItem('mimi-last-id')}catch(e){}if(last&&notes.some(n=>n.id===last))choose(last);else if(notes.length)choose(sorted()[0].id);else await create(false);$('status').textContent='保存済み'}catch(e){await dialog('起動エラー','端末内の保存領域を開けませんでした。\n'+String(e.message||e));return}
$('title').addEventListener('input',save);$('body').addEventListener('input',save);$('new').onclick=()=>create();$('sideNew').onclick=()=>create();$('ear').onclick=toggleEar;$('remove').onclick=remove;$('openList').onclick=()=>{render();$('side').classList.add('open')};$('closeList').onclick=()=>$('side').classList.remove('open');$('list').onclick=e=>{const item=e.target.closest('.item');if(item)choose(item.dataset.id,true)};$('search').oninput=render;document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});$('export').onclick=exportJSON;$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{await importJSON(e.target.files[0]);e.target.value=''};document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();create()}if(e.key==='Escape')$('side').classList.remove('open')});document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn)}
init();
</script>
</body>
</html>
