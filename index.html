<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f9f6">
<meta name="description" content="SUGU | 思いついたら、すぐ書ける。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>SUGU</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  color:#26332d;background:#f8f9f6;
  --green:#27735a;--line:#e2e7e1;--muted:#718077
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
button,input,textarea,select{font:inherit}
button{border:0;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--green);outline-offset:2px
}
.hide{display:none!important}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);height:100dvh;overflow:hidden}
.side{display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid var(--line)}
.toolbar{
  display:flex;align-items:center;gap:5px;min-height:54px;
  padding:6px 9px;border-bottom:1px solid var(--line);flex-shrink:0
}
.brand{flex:1;padding-left:6px;font-size:18px;font-weight:800;letter-spacing:.04em}
.btn{display:grid;place-items:center;min-width:38px;height:38px;border-radius:9px;font-size:19px}
.btn:hover:not(:disabled){background:#e7f3ec}
.status{font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.spacer{flex:1}
.syncbar{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 11px;
  background:#f1f6f1;border-bottom:1px solid var(--line);font-size:12px
}
.syncbar span{flex:1;min-width:75px;overflow:hidden;text-overflow:ellipsis}
.syncbtn{padding:6px 8px;border:1px solid #d4e2d7;border-radius:8px;background:white;font-size:12px}
.search{
  width:calc(100% - 24px);margin:12px 12px 8px;padding:10px;
  border:1px solid var(--line);border-radius:10px;background:#fafbf9
}
.filters{display:flex;gap:5px;padding:0 12px 8px;flex-wrap:wrap}
.chip{padding:7px 10px;border-radius:18px;color:#66766e;font-size:12px}
.chip.active{background:#e7f3ec;color:var(--green)}
.sortbar{display:flex;align-items:center;justify-content:space-between;padding:0 12px 8px;gap:8px}
.count{color:var(--muted);font-size:12px}
.sort-select{max-width:145px;padding:5px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:12px}
.list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.item{position:relative;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:#f5f8f5}
.item.active{background:#e7f3ec}
.item strong{
  display:block;padding-right:67px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;font-size:14px
}
.item p{margin:5px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
.item small{color:#85918b;font-size:11px}
.item-actions{position:absolute;top:7px;right:7px;display:flex;gap:1px}
.item-icon{width:31px;height:34px;border-radius:7px;font-size:18px;color:#b5c1b8}
.item-icon:hover{background:#edf2ed;color:var(--green)}
.item-icon.on{color:#d09b36}
.item-icon.pin-on{color:var(--green)}
.ghost-card{background:#f2ecfa;border-left:4px solid #9473bd}
.ghost-card strong,.ghost-card p{color:#70568d}
.ghost-card p{white-space:normal;line-height:1.5}
.ghost-close{position:absolute;top:7px;right:7px;width:32px;height:32px;font-size:19px}
.more-button{width:100%;padding:15px;color:var(--green);font-size:13px}
.side-bottom{
  display:flex;align-items:stretch;gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:white;flex-shrink:0
}
.bottom-icon{
  display:grid;place-items:center;width:44px;min-width:44px;
  min-height:48px;border:1px solid var(--line);border-radius:12px;
  color:#60756a;font-size:20px
}
.create-button{
  flex:1;min-width:0;min-height:48px;border-radius:12px;
  background:var(--green);color:white;font-weight:750
}
.create-button:hover{background:#1c5c47}
.editor{display:flex;flex-direction:column;min-width:0;min-height:0}
.edit{
  display:flex;flex-direction:column;flex:1;min-height:0;
  width:100%;max-width:920px;margin:auto;padding:17px 27px
}
#title{
  width:100%;padding:12px 0;border:0;outline:0;background:none;
  font-size:22px;font-weight:700
}
#body{
  flex:1;min-height:0;width:100%;padding:8px 0 20px;border:0;
  outline:0;resize:none;background:none;font-size:16px;line-height:1.75
}
.checklist{
  flex:1;min-height:0;overflow-y:auto;padding:9px 0 20px
}
.check-row{display:flex;align-items:center;gap:10px;min-height:44px}
.check-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--green);flex-shrink:0}
.check-text{
  flex:1;min-width:0;padding:9px 3px;border:0;border-bottom:1px solid #edf0ed;
  background:transparent;outline:0;font-size:16px
}
.check-text.done{color:#89958e;text-decoration:line-through}
.check-delete{width:30px;height:34px;color:#9ca8a0;font-size:18px}
.check-add{padding:12px 3px;color:var(--green);font-size:14px}
.edit-tools{display:flex;align-items:center;gap:8px;padding:4px 0 9px;flex-shrink:0}
.mode-button{padding:7px 11px;border:1px solid var(--line);border-radius:9px;font-size:12px}
.mode-button.on{background:#e7f3ec;border-color:#c8dfd1;color:var(--green)}
.mode-hint{color:var(--muted);font-size:11px}
.link-preview{
  flex-shrink:0;max-height:120px;overflow-y:auto;
  padding:8px 0;border-top:1px solid var(--line);font-size:13px
}
.link-preview:empty{display:none}
.link-preview small{display:block;margin-bottom:5px;color:var(--muted)}
.link-preview a{display:block;padding:5px 0;color:var(--green);overflow-wrap:anywhere}
.copy-success{background:#e7f3ec;color:var(--green)}
.empty-editor{flex:1;display:grid;place-items:center;color:#9aa69e;font-size:14px}
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:18px;background:#0008}
.modal{width:min(480px,100%);max-height:90dvh;overflow:auto;padding:22px;border-radius:16px;background:#fff}
.modal h2{margin:0 0 10px;font-size:18px}
.modal p{white-space:pre-line;line-height:1.7;font-size:14px}
.actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:20px}
.action{padding:10px 15px;border-radius:9px;background:#edf0ec}
.action.primary{background:var(--green);color:white}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  z-index:40;display:flex;align-items:center;gap:12px;
  max-width:calc(100vw - 30px);padding:12px 15px;
  border-radius:12px;background:#263b30;color:#fff;
  box-shadow:0 5px 24px #0003;font-size:13px
}
.toast button{color:#baf1d0;font-weight:700;white-space:nowrap}
.mobile{display:none}
@media(max-width:700px){
  .app{display:block}
  .side{
    position:fixed;inset:0;z-index:10;transform:translateX(-100%);
    transition:transform .12s ease
  }
  .side.open{transform:translateX(0)}
  .editor{height:100dvh}
  .mobile{display:grid}
  .edit{padding:10px 17px}
  #title{font-size:20px}
  .btn{min-width:35px;width:35px}
}
@media(min-width:701px){
  .item-icon:not(.on):not(.pin-on){opacity:.48}
  .item:hover .item-icon{opacity:1}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side" class="side">
    <header class="toolbar">
      <button id="closeList" class="btn mobile" title="一覧を閉じる">‹</button>
      <div class="brand">SUGU</div>
      <button id="import" class="btn" title="バックアップを取り込む">⇩</button>
      <button id="export" class="btn" title="JSONバックアップを保存">⇧</button>
    </header>
    <div class="syncbar">
      <span id="account">ログインしていません</span>
      <button id="login" class="syncbtn">Googleログイン</button>
      <button id="logout" class="syncbtn hide">ログアウト</button>
      <button id="startSync" class="syncbtn hide">同期を開始</button>
    </div>
    <input id="search" class="search" placeholder="メモを検索" aria-label="メモを検索">
    <div class="filters">
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="ear">★ お気に入り</button>
      <button class="chip" data-filter="trash">ゴミ箱</button>
    </div>
    <div class="sortbar">
      <span id="count" class="count"></span>
      <select id="sort" class="sort-select" aria-label="並べ替え">
        <option value="updated">更新が新しい順</option>
        <option value="created">作成が新しい順</option>
        <option value="title">タイトル順</option>
      </select>
    </div>
    <div id="list" class="list"></div>
    <div class="side-bottom">
      <button id="paste" class="bottom-icon" title="コピーした文章からメモ" aria-label="コピーした文章からメモ">▣</button>
      <button id="sideNew" class="create-button">＋ すぐメモ</button>
      <button id="stats" class="bottom-icon" title="どうでもいい記録" aria-label="どうでもいい記録">▥</button>
    </div>
  </aside>

  <main class="editor">
    <header class="toolbar">
      <button id="openList" class="btn mobile" title="メモ一覧">‹</button>
      <span id="status" class="status">読み込み中</span>
      <div class="spacer"></div>
      <button id="syncMenu" class="btn" title="Googleログイン・同期">☁</button>
      <button id="new" class="btn" title="新規メモ">＋</button>
      <button id="copy" class="btn" title="本文をコピー">□</button>
      <button id="pin" class="btn" title="ピン留め">♧</button>
      <button id="ear" class="btn" title="お気に入り">☆</button>
      <button id="remove" class="btn" title="メモ削除">⌫</button>
    </header>
    <div id="editArea" class="edit">
      <input id="title" placeholder="タイトル" autocomplete="off" aria-label="タイトル">
      <div class="edit-tools">
        <button id="mode" class="mode-button">☑ チェックリストにする</button>
        <span id="modeHint" class="mode-hint"></span>
      </div>
      <textarea id="body" placeholder="メモを書く…" aria-label="メモ本文" spellcheck="false"></textarea>
      <div id="checklist" class="checklist hide"></div>
      <div id="links" class="link-preview"></div>
    </div>
    <div id="emptyEditor" class="empty-editor hide">一覧からメモを選んでください</div>
  </main>
</div>
<input id="file" type="file" accept=".json,application/json" class="hide">
<div id="dialogs"></div>
<div id="toast" class="toast hide">
  <span id="toastText"></span>
  <button id="toastUndo" class="hide">元に戻す</button>
</div>

<script type="module">
'use strict';

const $ = id => document.getElementById(id);
const DB = 'mimi-sync-db';
const TABLE = 'notes';
const META = 'syncMeta';

const firebaseConfig = {
  apiKey: "AIzaSyDPlUYQ6vzg8rBQAdt_M-i3hOm8VRkB6FE",
  authDomain: "sugu-43386.firebaseapp.com",
  databaseURL: "https://sugu-43386-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sugu-43386",
  storageBucket: "sugu-43386.firebasestorage.app",
  messagingSenderId: "1056209931526",
  appId: "1:1056209931526:web:111fca8d731e2e1a452287"
};

let db;
let notes = [];
let selected = null;
let filter = 'all';
let sortMode = 'updated';
let visibleLimit = 10;
let screen = 'list';
let copiedId = null;
let ghostDismissedDay = '';
let queue = Promise.resolve();
let failed = false;
let version = 0;
let toastTimer = null;
let undoInfo = null;

let firebase = null;
let auth = null;
let firestore = null;
let cloudUser = null;
let syncEnabled = false;
let syncing = false;
let syncAgain = false;
let syncTimer = null;
let syncInterval = null;
let accountGeneration = 0;
let syncError = '';

const iso = () => new Date().toISOString();

function localGet(key) {
  try { return localStorage.getItem(key); }
  catch(e) { return null; }
}

function localSet(key,value) {
  try { localStorage.setItem(key,String(value)); }
  catch(e) {}
}

function dateValue(s) {
  if (typeof s === 'number') return s < 1e11 ? s*1000 : s;
  if (!s) return 0;
  const v = String(s);
  const num = Number(v);
  if (/^\d{10,13}$/.test(v)) return num < 1e11 ? num*1000 : num;
  const d = Date.parse(v) || Date.parse(v.replace(' ','T'));
  return Number.isFinite(d) ? d : 0;
}

function dayKey() {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

function openDB() {
  return new Promise((resolve,reject) => {
    const r = indexedDB.open(DB,2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(TABLE))
        d.createObjectStore(TABLE,{keyPath:'id'});
      if (!d.objectStoreNames.contains(META))
        d.createObjectStore(META,{keyPath:'key'});
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(Error('他のタブが保存領域を使用中です'));
  });
}

function getAll() {
  return new Promise((resolve,reject) => {
    const r = db.transaction(TABLE,'readonly').objectStore(TABLE).getAll();
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function getMeta(key) {
  return new Promise((resolve,reject) => {
    const r = db.transaction(META,'readonly').objectStore(META).get(key);
    r.onsuccess = () => resolve(r.result?.value);
    r.onerror = () => reject(r.error);
  });
}

function setMeta(key,value) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(META,'readwrite');
    tx.objectStore(META).put({key,value});
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function transaction(items) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(TABLE,'readwrite');
    const store = tx.objectStore(TABLE);
    for (const n of items) store.put({...n});
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function enqueue(job) {
  const task = queue.then(job);
  queue = task.catch(e => {
    failed = true;
    $('status').textContent = '保存失敗';
    console.error(e);
  });
  return task;
}

function normalizeChecks(raw) {
  return Array.isArray(raw)
    ? raw.map(Boolean)
    : [];
}

function normalizeNote(raw,id=raw.id) {
  return {
    id,
    title:String(raw.title ?? ''),
    body:String(raw.body ?? ''),
    ear:!!raw.ear,
    pinned:!!raw.pinned,
    checklist:!!raw.checklist,
    checks:normalizeChecks(raw.checks),
    createdAt:String(raw.createdAt ?? ''),
    updatedAt:String(raw.updatedAt ?? ''),
    deleted:!!raw.deleted,
    deletedAt:String(raw.deletedAt ?? '')
  };
}

function current() {
  return notes.find(n => n.id === selected && !n.deleted);
}

function label(n) {
  return n.title || n.body.split('\n').find(Boolean) || '無題';
}

function sorted(includeDeleted=false) {
  const arr = notes.filter(n =>
    includeDeleted ? n.deleted : !n.deleted
  );

  arr.sort((a,b) => {
    if (!includeDeleted && !!a.pinned !== !!b.pinned)
      return a.pinned ? -1 : 1;

    if (includeDeleted)
      return dateValue(b.deletedAt || b.updatedAt) -
             dateValue(a.deletedAt || a.updatedAt);

    if (sortMode === 'created')
      return dateValue(b.createdAt) - dateValue(a.createdAt);

    if (sortMode === 'title')
      return label(a).localeCompare(label(b),'ja');

    return dateValue(b.updatedAt) - dateValue(a.updatedAt);
  });

  return arr;
}

function toast(message,undo=false) {
  clearTimeout(toastTimer);
  $('toastText').textContent = message;
  $('toastUndo').classList.toggle('hide',!undo);
  $('toast').classList.remove('hide');
  toastTimer = setTimeout(() => {
    $('toast').classList.add('hide');
    undoInfo = null;
  },6000);
}

function resetCopy() {
  copiedId = null;
  $('copy').textContent = '□';
  $('copy').classList.remove('copy-success');
}

function showScreen(next) {
  if (screen !== next) resetCopy();
  screen = next;
  localSet('sugu-screen',next);
  if (matchMedia('(max-width:700px)').matches)
    $('side').classList.toggle('open',next === 'list');
}

function openEditorHistory() {
  if (matchMedia('(max-width:700px)').matches &&
      history.state?.sugu !== 'edit') {
    history.pushState({sugu:'edit'},'',location.href);
  }
  showScreen('edit');
}

function goList() {
  if (matchMedia('(max-width:700px)').matches &&
      history.state?.sugu === 'edit') {
    history.back();
  } else {
    showScreen('list');
  }
}

function updateLinks() {
  const root = $('links');
  root.replaceChildren();

  const matches = $('body').value.match(/https?:\/\/[^\s<>"'「」]+/g) || [];
  const urls = [...new Set(matches)].slice(0,20);
  if (!urls.length) return;

  const caption = document.createElement('small');
  caption.textContent = '本文中のリンク';
  root.append(caption);

  for (const raw of urls) {
    const clean = raw.replace(/[.,。、）)\]】]+$/g,'');
    try {
      const url = new URL(clean);
      if (!['http:','https:'].includes(url.protocol)) continue;
      const a = document.createElement('a');
      a.href = url.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = clean;
      root.append(a);
    } catch(e) {}
  }
}

function renderChecklist() {
  const n = current();
  const root = $('checklist');
  root.replaceChildren();
  if (!n || !n.checklist) return;

  const lines = n.body ? n.body.split('\n') : [''];

  lines.forEach((line,index) => {
    const row = document.createElement('div');
    row.className = 'check-row';

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = !!n.checks[index];
    box.setAttribute('aria-label',`${index+1}番目を完了`);

    const text = document.createElement('input');
    text.type = 'text';
    text.className = 'check-text' + (box.checked ? ' done' : '');
    text.value = line;
    text.placeholder = '項目を入力';
    text.setAttribute('aria-label',`${index+1}番目の項目`);

    const del = document.createElement('button');
    del.className = 'check-delete';
    del.textContent = '×';
    del.title = '項目を削除';

    box.onchange = () => {
      n.checks[index] = box.checked;
      text.classList.toggle('done',box.checked);
      persist(n);
    };

    text.oninput = () => {
      const updated = n.body ? n.body.split('\n') : [''];
      updated[index] = text.value;
      n.body = updated.join('\n');
      $('body').value = n.body;
      persist(n);
    };

    text.onkeydown = e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addChecklistRow(index+1);
      }
    };

    del.onclick = () => {
      const updated = n.body ? n.body.split('\n') : [''];
      updated.splice(index,1);
      n.checks.splice(index,1);
      n.body = updated.join('\n');
      $('body').value = n.body;
      persist(n);
      renderChecklist();
    };

    row.append(box,text,del);
    root.append(row);
  });

  const add = document.createElement('button');
  add.className = 'check-add';
  add.textContent = '＋ 項目を追加';
  add.onclick = () => addChecklistRow(lines.length);
  root.append(add);
}

function addChecklistRow(index) {
  const n = current();
  if (!n || !n.checklist) return;

  const lines = n.body ? n.body.split('\n') : [];
  lines.splice(index,0,'');
  n.checks.splice(index,0,false);
  n.body = lines.join('\n');
  $('body').value = n.body;

  persist(n);
  renderChecklist();

  const inputs = $('checklist').querySelectorAll('.check-text');
  inputs[index]?.focus();
}

function updateEditor() {
  const n = current();
  $('editArea').classList.toggle('hide',!n);
  $('emptyEditor').classList.toggle('hide',!!n);

  for (const id of ['copy','pin','ear','remove'])
    $(id).disabled = !n;

  if (!n) {
    $('title').value = '';
    $('body').value = '';
    $('links').replaceChildren();
    $('checklist').replaceChildren();
    resetCopy();
    return;
  }

  $('title').value = n.title;
  $('body').value = n.body;
  $('ear').textContent = n.ear ? '★' : '☆';
  $('pin').textContent = n.pinned ? '📌' : '♧';
  $('mode').textContent = n.checklist
    ? '☑ チェックリスト ON'
    : '☐ チェックリストにする';
  $('mode').classList.toggle('on',n.checklist);
  $('modeHint').textContent = n.checklist ? '1行につき1項目' : '';
  $('body').classList.toggle('hide',n.checklist);
  $('checklist').classList.toggle('hide',!n.checklist);

  renderChecklist();
  updateLinks();
}

function viewedMap() {
  try { return JSON.parse(localGet('sugu-viewed-v1') || '{}'); }
  catch(e) { return {}; }
}

function recordView(id) {
  const map = viewedMap();
  map[id] = Date.now();
  const entries = Object.entries(map);
  if (entries.length > 1000) {
    entries.sort((a,b) => b[1]-a[1]);
    localSet('sugu-viewed-v1',JSON.stringify(
      Object.fromEntries(entries.slice(0,1000))
    ));
  } else {
    localSet('sugu-viewed-v1',JSON.stringify(map));
  }
}

function ghostCandidate(list) {
  if (ghostDismissedDay === dayKey()) return null;
  const viewed = viewedMap();
  const cutoff = Date.now() - 30*86400000;
  const candidates = list.filter(n => {
    const last = viewed[n.id] ||
      dateValue(n.createdAt || n.updatedAt);
    return last > 0 && last < cutoff;
  });
  if (!candidates.length) return null;
  return candidates[
    Math.floor(Date.now()/86400000) % candidates.length
  ];
}

function makeGhostCard(n) {
  const card = document.createElement('div');
  card.className = 'item ghost-card';
  card.dataset.id = n.id;

  const title = document.createElement('strong');
  title.textContent = '👻 メモの亡霊';

  const message = document.createElement('p');
  message.textContent =
    `「私のこと、覚えていますか。」 ${label(n)}`;

  const close = document.createElement('button');
  close.className = 'ghost-close';
  close.textContent = '×';
  close.title = '今日は表示しない';
  close.onclick = e => {
    e.stopPropagation();
    ghostDismissedDay = dayKey();
    localSet('sugu-ghost-dismiss',ghostDismissedDay);
    render();
  };

  card.append(title,message,close);
  return card;
}

function makeItem(n) {
  const item = document.createElement('div');
  item.className = 'item' + (n.id === selected ? ' active' : '');
  item.dataset.id = n.id;

  const title = document.createElement('strong');
  title.textContent = label(n);

  const preview = document.createElement('p');
  preview.textContent = n.body.replace(/\s+/g,' ').slice(0,120);

  const time = document.createElement('small');
  time.textContent = String(n.updatedAt || '').slice(0,19);

  item.append(title,preview,time);

  const actions = document.createElement('div');
  actions.className = 'item-actions';

  if (filter === 'trash') {
    const restore = document.createElement('button');
    restore.className = 'item-icon';
    restore.textContent = '↶';
    restore.title = 'メモを復元';
    restore.onclick = e => {
      e.stopPropagation();
      restoreNote(n.id);
    };
    actions.append(restore);
  } else {
    const pin = document.createElement('button');
    pin.className = 'item-icon' + (n.pinned ? ' pin-on' : '');
    pin.textContent = n.pinned ? '📌' : '♧';
    pin.title = n.pinned ? 'ピン留め解除' : 'ピン留め';
    pin.onclick = e => {
      e.stopPropagation();
      toggleField(n.id,'pinned');
    };

    const star = document.createElement('button');
    star.className = 'item-icon' + (n.ear ? ' on' : '');
    star.textContent = n.ear ? '★' : '☆';
    star.title = n.ear ? 'お気に入り解除' : 'お気に入り';
    star.onclick = e => {
      e.stopPropagation();
      toggleField(n.id,'ear');
    };

    actions.append(pin,star);
  }

  item.append(actions);
  return item;
}

function render() {
  const q = $('search').value.toLocaleLowerCase();
  const inTrash = filter === 'trash';
  const all = sorted(inTrash);

  const filtered = all.filter(n =>
    (filter !== 'ear' || n.ear) &&
    (n.title+'\n'+n.body).toLocaleLowerCase().includes(q)
  );

  $('count').textContent = `${filtered.length}件`;
  const root = $('list');
  root.replaceChildren();

  const ghost = !q && filter === 'all'
    ? ghostCandidate(all) : null;

  const regular = ghost
    ? filtered.filter(n => n.id !== ghost.id)
    : filtered;

  const shown = regular.slice(0,visibleLimit);

  shown.forEach((n,i) => {
    if (i === 3 && ghost) root.append(makeGhostCard(ghost));
    root.append(makeItem(n));
  });

  if (ghost && shown.length < 4)
    root.append(makeGhostCard(ghost));

  if (regular.length > visibleLimit) {
    const more = document.createElement('button');
    more.className = 'more-button';
    more.textContent = 'さらに10件表示';
    more.onclick = () => {
      visibleLimit += 10;
      render();
    };
    root.append(more);
  }
}

function choose(id,focus=false) {
  const n = notes.find(x => x.id === id && !x.deleted);
  if (!n) return;

  selected = id;
  version++;
  resetCopy();
  localSet('mimi-last-id',id);
  recordView(id);
  updateEditor();
  $('status').textContent = failed ? '保存失敗' : '保存済み';
  openEditorHistory();
  render();

  if (focus) requestAnimationFrame(() => {
    if (n.checklist)
      $('checklist').querySelector('.check-text')?.focus();
    else
      $('body').focus();
  });
}

function scheduleSync() {
  if (!syncEnabled || !cloudUser) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(),1500);
}

function persist(n) {
  n.updatedAt = iso();
  const snapshot = {...n,checks:[...(n.checks || [])]};
  const v = ++version;

  failed = false;
  $('status').textContent = '保存中';
  resetCopy();

  enqueue(() => transaction([snapshot])).then(() => {
    if (selected === snapshot.id && version === v)
      $('status').textContent = '保存済み';
    scheduleSync();
  }).catch(() => {});
}

function save() {
  const n = current();
  if (!n) return;

  const title = $('title').value;
  const body = n.checklist ? n.body : $('body').value;

  if (title === n.title && body === n.body) return;

  n.title = title;
  n.body = body;
  persist(n);
}

async function create(focus=true,body='',title='') {
  const now = iso();
  const n = {
    id:crypto.randomUUID(),
    title,body,ear:false,pinned:false,
    checklist:false,checks:[],
    createdAt:now,updatedAt:now,
    deleted:false,deletedAt:''
  };

  notes.push(n);

  try {
    await enqueue(() => transaction([n]));
    if (filter === 'trash') {
      filter = 'all';
      updateFilterUI();
    }
    choose(n.id,focus);
    scheduleSync();
  } catch(e) {
    notes = notes.filter(x => x.id !== n.id);
    await dialog('保存エラー','新しいメモを保存できませんでした。');
  }
}

async function toggleField(id,field) {
  const n = notes.find(x => x.id === id && !x.deleted);
  if (!n) return;

  const previous = {...n};
  n[field] = !n[field];
  n.updatedAt = iso();

  const snapshot = {...n,checks:[...(n.checks || [])]};
  if (selected === id) updateEditor();
  render();

  try {
    await enqueue(() => transaction([snapshot]));
    scheduleSync();
  } catch(e) {
    Object.assign(n,previous);
    updateEditor();
    render();
    await dialog('保存エラー',String(e.message || e));
  }
}

function toggleChecklist() {
  const n = current();
  if (!n) return;

  n.checklist = !n.checklist;

  if (n.checklist) {
    const lines = n.body ? n.body.split('\n') : [''];
    n.checks = lines.map((_,i) => !!n.checks[i]);
  }

  persist(n);
  updateEditor();
  render();
}

async function copyBody() {
  const n = current();
  if (!n) return;

  const id = n.id;
  const body = n.body;

  try {
    await navigator.clipboard.writeText(body);
    if (selected !== id || screen !== 'edit' || current()?.body !== body)
      return;

    copiedId = id;
    $('copy').textContent = '✓';
    $('copy').classList.add('copy-success');
    toast('本文をコピーしました');
  } catch(e) {
    await dialog('コピーできません','クリップボードへの書き込みが許可されていません。');
  }
}

async function pasteNew() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text) {
      await dialog('クリップボードが空です','コピーした文章が見つかりません。');
      return;
    }
    await create(true,text);
  } catch(e) {
    await dialog('読み取りエラー','クリップボードの権限を確認してください。');
  }
}

async function showStats() {
  const all = notes.filter(n => !n.deleted);
  const lengths = all.map(n => (n.title+n.body).length);
  const total = lengths.reduce((a,b) => a+b,0);
  const checklists = all.filter(n => n.checklist).length;
  const pinned = all.filter(n => n.pinned).length;

  await dialog(
    'どうでもいい記録',
    `メモ総数：${all.length}件\n`+
    `全文字数：${total.toLocaleString()}字\n`+
    `最長メモ：${lengths.length ? Math.max(...lengths) : 0}字\n`+
    `最短メモ：${lengths.length ? Math.min(...lengths) : 0}字\n`+
    `チェックリスト：${checklists}件\n`+
    `ピン留め：${pinned}件\n\n`+
    'どうでもいい数字も、集めると少し気になります。'
  );
}

function dialog(title,message,choices=['閉じる']) {
  return new Promise(resolve => {
    const host = $('dialogs');
    host.replaceChildren();

    const overlay = document.createElement('div');
    overlay.className = 'overlay';

    const box = document.createElement('div');
    box.className = 'modal';

    const h = document.createElement('h2');
    h.textContent = title;

    const p = document.createElement('p');
    p.textContent = message;

    const actions = document.createElement('div');
    actions.className = 'actions';

    choices.forEach((choice,i) => {
      const b = document.createElement('button');
      b.className = 'action' +
        (i === choices.length-1 ? ' primary' : '');
      b.textContent = choice;
      b.onclick = () => {
        host.replaceChildren();
        resolve(i);
      };
      actions.append(b);
    });

    box.append(h,p,actions);
    overlay.append(box);
    host.append(overlay);
  });
}

async function remove() {
  const n = current();
  if (!n) return;

  const choice = await dialog(
    'メモをゴミ箱に移動しますか？',
    'ゴミ箱から復元できます。同期中の場合は他の端末にも反映されます。',
    ['キャンセル','ゴミ箱へ']
  );
  if (choice !== 1) return;

  await queue;
  if (failed) {
    await dialog('保存エラー','保存に失敗しているため削除を中止しました。');
    return;
  }

  const old = {...n};
  const tombstone = {
    ...n,deleted:true,deletedAt:iso(),updatedAt:iso()
  };

  try {
    await enqueue(() => transaction([tombstone]));
    Object.assign(n,tombstone);
    selected = null;
    updateEditor();
    showScreen('list');
    render();
    scheduleSync();

    undoInfo = {id:n.id};
    toast('メモをゴミ箱に移動しました',true);
  } catch(e) {
    Object.assign(n,old);
    await dialog('削除エラー',String(e.message || e));
  }
}

async function restoreNote(id) {
  const n = notes.find(x => x.id === id && x.deleted);
  if (!n) return;

  const previous = {...n};
  const restored = {
    ...n,
    deleted:false,
    deletedAt:'',
    updatedAt:iso()
  };

  try {
    await enqueue(() => transaction([restored]));
    Object.assign(n,restored);
    render();
    scheduleSync();
    toast('メモを復元しました');
  } catch(e) {
    Object.assign(n,previous);
    await dialog('復元エラー',String(e.message || e));
  }
}

async function exportJSON() {
  save();
  await queue;

  if (failed) {
    await dialog('保存エラー','バックアップ前に保存状態を確認してください。');
    return;
  }

  const all = (await getAll()).filter(n => !n.deleted);

  const blob = new Blob([
    JSON.stringify({
      format:'mimi-sync-v1',
      exportedAt:iso(),
      notes:all
    },null,2)
  ],{type:'application/json'});

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'SUGUBackup_'+iso().slice(0,10)+'.json';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url),10000);
}

async function importJSON(file) {
  if (!file) return;

  try {
    const data = JSON.parse(await file.text());

    if (data.format !== 'mimi-sync-v1' || !Array.isArray(data.notes))
      throw Error('対応していないJSONバックアップです');

    const incoming = new Map();

    for (const raw of data.notes) {
      if (!raw || typeof raw.id !== 'string' || !raw.id) continue;
      incoming.set(raw.id,{
        ...normalizeNote(raw),
        deleted:false,
        deletedAt:''
      });
    }

    const known = new Set(notes.map(n => n.id));
    const add = [...incoming.values()].filter(n => !known.has(n.id));

    const choice = await dialog(
      'バックアップを取り込みますか？',
      `ファイル内：${incoming.size}件\n新規追加：${add.length}件\n既存メモは上書きしません。`,
      ['キャンセル','取り込む']
    );
    if (choice !== 1) return;

    save();
    await queue;
    if (failed) throw Error('編集中のメモを保存できません');

    if (add.length) await enqueue(() => transaction(add));
    notes = await getAll();
    render();
    scheduleSync();

    await dialog('取り込み完了',`${add.length}件追加しました。`);
  } catch(e) {
    await dialog('取り込みエラー',String(e.message || e));
  }
}

function syncKey(uid) {
  return 'enabled:'+uid;
}

function updateAccountUI() {
  const name = cloudUser
    ? (cloudUser.email || 'Googleアカウント')
    : 'ログインしていません';

  $('account').textContent =
    cloudUser && syncEnabled ? name+' ・ 同期有効' : name;

  $('login').classList.toggle('hide',!!cloudUser);
  $('logout').classList.toggle('hide',!cloudUser);
  $('startSync').classList.toggle('hide',!cloudUser || syncEnabled);
}

async function loadFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/13.3.0/';

  const [appMod,authMod,dbMod] = await Promise.all([
    import(base+'firebase-app.js'),
    import(base+'firebase-auth.js'),
    import(base+'firebase-firestore.js')
  ]);

  const app = appMod.initializeApp(firebaseConfig);
  auth = authMod.getAuth(app);
  firestore = dbMod.getFirestore(app);
  firebase = {authMod,dbMod};

  authMod.onAuthStateChanged(auth,async user => {
    const generation = ++accountGeneration;
    clearTimeout(syncTimer);
    clearInterval(syncInterval);

    syncEnabled = false;
    cloudUser = user;
    syncError = '';

    if (user) {
      try {
        syncEnabled = (await getMeta(syncKey(user.uid))) === true;
      } catch(e) {
        console.error(e);
      }
    }

    if (generation !== accountGeneration) return;
    updateAccountUI();

    if (syncEnabled && user) {
      syncNow();
      syncInterval = setInterval(() => {
        if (!document.hidden && navigator.onLine) syncNow();
      },15000);
    }
  },error => {
    console.error(error);
    $('account').textContent = '認証エラー';
  });
}

async function login() {
  if (!firebase) {
    await dialog('準備中','Firebaseを読み込んでいます。少し待ってから試してください。');
    return;
  }

  try {
    const provider = new firebase.authMod.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    await firebase.authMod.signInWithPopup(auth,provider);
  } catch(e) {
    console.error(e);
    await dialog(
      'Googleログインに失敗しました',
      String(e.code || e.message || e)+
      '\nAndroidでポップアップが開けない場合は、ChromeでSUGUのURLを直接開いてください。'
    );
  }
}

async function logout() {
  if (!auth || !cloudUser) return;

  const choice = await dialog(
    'ログアウトしますか？',
    '端末内のメモは残ります。',
    ['キャンセル','ログアウト']
  );
  if (choice !== 1) return;

  try {
    await firebase.authMod.signOut(auth);
  } catch(e) {
    await dialog('ログアウトエラー',String(e.message || e));
  }
}

async function startSync() {
  if (!cloudUser || syncEnabled) return;
  const user = cloudUser;

  const choice = await dialog(
    '初回同期を開始しますか？',
    `ログイン中：${user.email || 'Googleアカウント'}\n\n`+
    '端末内のメモとクラウドのメモを統合します。'+
    '\n同じIDのメモは更新日時が新しい方を優先します。'+
    '\n先にJSONバックアップを保存してください。',
    ['キャンセル','同期を開始']
  );

  if (choice !== 1 || cloudUser?.uid !== user.uid) return;

  save();
  await queue;

  if (failed) {
    await dialog('同期を中止','端末内への保存に失敗しています。');
    return;
  }

  try {
    await setMeta(syncKey(user.uid),true);
    syncEnabled = true;
    updateAccountUI();

    syncInterval = setInterval(() => {
      if (!document.hidden && navigator.onLine) syncNow();
    },15000);

    await syncNow();
  } catch(e) {
    syncEnabled = false;
    await setMeta(syncKey(user.uid),false).catch(console.error);
    updateAccountUI();
    await dialog('同期開始エラー',String(e.message || e));
  }
}

async function syncNow() {
  if (!syncEnabled || !cloudUser || !firebase || !navigator.onLine)
    return;

  if (syncing) {
    syncAgain = true;
    return;
  }

  syncing = true;

  const uid = cloudUser.uid;
  const generation = accountGeneration;
  const {dbMod} = firebase;
  const collection = dbMod.collection(firestore,'users',uid,'notes');

  try {
    save();
    await queue;
    if (failed) throw Error('端末内の保存に失敗しています');

    $('status').textContent = '同期中';

    const remoteSnap = await dbMod.getDocs(collection);

    if (generation !== accountGeneration ||
        cloudUser?.uid !== uid || !syncEnabled) return;

    const remote = new Map();
    remoteSnap.forEach(d =>
      remote.set(d.id,normalizeNote(d.data(),d.id))
    );

    const local = new Map(
      (await getAll()).map(n => [n.id,normalizeNote(n)])
    );

    const download = [];
    const upload = [];

    for (const [id,r] of remote) {
      const l = local.get(id);
      if (!l || dateValue(r.updatedAt) > dateValue(l.updatedAt))
        download.push(r);
    }

    for (const [id,l] of local) {
      const r = remote.get(id);
      if (!r || dateValue(l.updatedAt) > dateValue(r.updatedAt))
        upload.push(l);
    }

    if (generation !== accountGeneration ||
        cloudUser?.uid !== uid || !syncEnabled) return;

    await queue;

    const latest = new Map(
      (await getAll()).map(n => [n.id,n])
    );

    const safeDownload = download.filter(r => {
      const now = latest.get(r.id);
      const old = local.get(r.id);
      if (!now) return true;
      if (!old) return false;
      return dateValue(now.updatedAt) <= dateValue(old.updatedAt);
    });

    if (safeDownload.length) {
      await enqueue(() => transaction(safeDownload));
      notes = await getAll();

      if (!current() && selected) {
        selected = null;
        updateEditor();
        showScreen('list');
      } else if (
        safeDownload.some(n => n.id === selected) &&
        document.activeElement !== $('title') &&
        document.activeElement !== $('body') &&
        !document.activeElement?.classList.contains('check-text')
      ) {
        updateEditor();
      }

      render();
    }

    for (const n of upload) {
      if (generation !== accountGeneration ||
          cloudUser?.uid !== uid || !syncEnabled) return;

      const newest = (await getAll()).find(x => x.id === n.id);
      if (!newest) continue;

      const latestRemote = remote.get(n.id);
      if (latestRemote &&
          dateValue(latestRemote.updatedAt) >=
          dateValue(newest.updatedAt)) continue;

      await dbMod.setDoc(
        dbMod.doc(collection,n.id),
        normalizeNote(newest)
      );
    }

    syncError = '';
    $('status').textContent = '保存済み・同期済み';
  } catch(e) {
    console.error('SUGU sync:',e);
    syncError = String(e.code || e.message || e);
    $('status').textContent = '端末保存済み・同期失敗';
  } finally {
    syncing = false;
    if (syncAgain) {
      syncAgain = false;
      scheduleSync();
    }
  }
}

async function syncMenu() {
  if (!cloudUser) {
    if (!firebase) {
      await dialog('Googleログイン','Firebaseの読み込みが完了していません。');
    } else {
      await login();
    }
    return;
  }

  if (!syncEnabled) {
    await startSync();
    return;
  }

  const choice = await dialog(
    'SUGU 自動同期',
    `アカウント：${cloudUser.email || ''}\n`+
    `状態：${syncError ? '同期エラー：'+syncError : '同期有効'}`,
    ['閉じる','今すぐ同期','ログアウト']
  );

  if (choice === 1) await syncNow();
  if (choice === 2) await logout();
}

async function receivePendingShare() {
  const id = await getMeta('sugu-pending-share').catch(() => null);
  if (!id) return false;

  await queue;
  notes = await getAll();

  const n = notes.find(x => x.id === id && !x.deleted);
  if (n) {
    choose(n.id,false);
    scheduleSync();
  }

  await setMeta('sugu-pending-share',null).catch(console.error);
  return !!n;
}

function updateFilterUI() {
  document.querySelectorAll('.chip').forEach(b =>
    b.classList.toggle('active',b.dataset.filter === filter)
  );
  $('sideNew').disabled = false;
  render();
}

async function init() {
  try {
    db = await openDB();
    notes = await getAll();

    ghostDismissedDay = localGet('sugu-ghost-dismiss') || '';
    sortMode = localGet('sugu-sort') || 'updated';
    $('sort').value = sortMode;

    const last = localGet('mimi-last-id');
    selected = last && notes.some(n => n.id === last && !n.deleted)
      ? last : null;

    updateEditor();
    render();

    const previous = localGet('sugu-screen') || 'list';
    history.replaceState({sugu:'list'},'',location.href);
    showScreen('list');

    if (previous === 'edit' && current())
      openEditorHistory();

    $('status').textContent = '保存済み';

    if (new URL(location.href).searchParams.has('shared')) {
      await receivePendingShare();
      const url = new URL(location.href);
      url.searchParams.delete('shared');
      history.replaceState(
        history.state,'',url.pathname+url.search+url.hash
      );
    }
  } catch(e) {
    await dialog(
      '起動エラー',
      '端末内の保存領域を開けませんでした。\n'+String(e.message || e)
    );
    return;
  }

  $('title').addEventListener('input',save);
  $('body').addEventListener('input',save);
  $('body').addEventListener('blur',updateLinks);

  $('new').onclick = () => create();
  $('sideNew').onclick = () => create();
  $('paste').onclick = pasteNew;
  $('stats').onclick = showStats;
  $('copy').onclick = copyBody;
  $('mode').onclick = toggleChecklist;
  $('pin').onclick = () => {
    if (selected) toggleField(selected,'pinned');
  };
  $('ear').onclick = () => {
    if (selected) toggleField(selected,'ear');
  };
  $('remove').onclick = remove;

  $('openList').onclick = goList;
  $('closeList').onclick = goList;

  $('list').onclick = e => {
    if (e.target.closest('button')) return;
    const item = e.target.closest('.item');
    if (!item?.dataset.id) return;

    if (filter === 'trash') {
      restoreNote(item.dataset.id);
    } else {
      choose(item.dataset.id,true);
    }
  };

  $('search').oninput = () => {
    visibleLimit = 10;
    render();
  };

  $('sort').onchange = e => {
    sortMode = e.target.value;
    localSet('sugu-sort',sortMode);
    visibleLimit = 10;
    render();
  };

  document.querySelectorAll('.chip').forEach(b => {
    b.onclick = () => {
      filter = b.dataset.filter;
      visibleLimit = 10;
      updateFilterUI();
    };
  });

  $('toastUndo').onclick = async () => {
    if (!undoInfo) return;
    const id = undoInfo.id;
    undoInfo = null;
    $('toast').classList.add('hide');
    await restoreNote(id);
  };

  $('export').onclick = exportJSON;
  $('import').onclick = () => $('file').click();

  $('file').onchange = async e => {
    await importJSON(e.target.files[0]);
    e.target.value = '';
  };

  $('login').onclick = login;
  $('logout').onclick = logout;
  $('startSync').onclick = startSync;
  $('syncMenu').onclick = syncMenu;

  document.addEventListener('keydown',e => {
    if (e.ctrlKey && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      create();
    }
    if (e.key === 'Escape') goList();
  });

  window.addEventListener('popstate',e => {
    if (e.state?.sugu === 'edit' && current())
      showScreen('edit');
    else
      showScreen('list');
  });

  document.addEventListener('visibilitychange',() => {
    if (document.hidden) save();
    else if (syncEnabled) syncNow();
  });

  window.addEventListener('online',() => {
    if (syncEnabled) syncNow();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message',async e => {
      if (e.data?.type !== 'SUGU_SHARED') return;
      await queue;
      notes = await getAll();
      const n = notes.find(x => x.id === e.data.id && !x.deleted);
      if (n) {
        choose(n.id,false);
        scheduleSync();
      }
      render();
    });
  }

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(console.warn);
  }

  // 端末内のメモを先に表示し、Firebaseは後から読み込む。
  loadFirebase().catch(e => {
    console.error('Firebase initialization:',e);
    $('account').textContent = 'クラウド接続不可';
  });
}

init();
</script>
</body>
</html>
