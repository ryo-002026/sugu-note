<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3eb">
<meta name="description" content="SUGU | 思いついたら、すぐ書ける。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>SUGU</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  color:#3b3833;background:#f7f3eb;
  --paper:#fffdf9;--cream:#f7f3eb;--ink:#3b3833;
  --muted:#8d867b;--line:#e9e1d5;--sage:#637b68;
  --sage-soft:#e8eee7;--clay:#b8795d;
  --gold:#bb9455;--danger:#b96b62;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%}
button,input,textarea,select{font:inherit}
button{border:0;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,
select:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.hide{display:none!important}
.app{
  display:grid;grid-template-columns:350px minmax(0,1fr);
  height:100dvh;overflow:hidden;
}
.side{
  display:flex;flex-direction:column;min-height:0;
  background:var(--cream);border-right:1px solid var(--line);
}
.toolbar{
  display:flex;align-items:center;gap:4px;
  min-height:60px;padding:7px 10px;flex-shrink:0;
}
.side>.toolbar{border-bottom:1px solid var(--line)}
.brand{
  flex:1;min-width:0;padding-left:8px;color:#665244;
  font-family:Georgia,serif;font-size:25px;
  font-weight:700;letter-spacing:.16em;
}
.btn{
  display:grid;place-items:center;min-width:38px;
  width:38px;height:38px;border-radius:12px;font-size:19px;
}
.btn:hover:not(:disabled){background:#eee7dc}
.btn.active{color:var(--clay)}
.refreshing .refresh-glyph{
  display:inline-block;animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.status{
  font-size:12px;color:var(--muted);overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;
}
.spacer{flex:1}
.syncbar{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  padding:8px 16px;background:#f1ede5;
  border-bottom:1px solid var(--line);font-size:11px;
}
.syncbar span{
  flex:1;min-width:70px;overflow:hidden;text-overflow:ellipsis;
}
.syncbtn{
  padding:6px 9px;border:1px solid #dfd5c9;
  border-radius:9px;background:var(--paper);font-size:11px;
}
.search{
  width:calc(100% - 32px);margin:15px 16px 11px;
  padding:12px 14px;border:1px solid var(--line);
  border-radius:13px;background:var(--paper);
  color:var(--ink);font-size:14px;
}
.filters{
  display:flex;gap:5px;padding:0 16px 12px;flex-wrap:wrap;
}
.chip{
  padding:8px 12px;border-radius:20px;
  color:#877c70;font-size:12px;
}
.chip.active{
  background:var(--sage-soft);color:#526b57;font-weight:700;
}
.sortbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:0 16px 10px;
}
.count{color:var(--muted);font-size:12px}
.sort-select{
  max-width:155px;padding:6px 8px;border:1px solid var(--line);
  border-radius:9px;background:var(--paper);
  color:#71695f;font-size:12px;
}
.search-empty{
  padding:20px;text-align:center;color:var(--muted);font-size:13px;
}
.list{
  flex:1;min-height:0;overflow-y:auto;
  overscroll-behavior:contain;padding:0 12px 16px;
}
.year-heading{
  display:flex;align-items:center;gap:12px;
  margin:17px 5px 10px;color:#8b7563;
  font-family:Georgia,serif;font-size:19px;letter-spacing:.07em;
}
.year-heading:after{
  content:"";flex:1;height:1px;background:#dcd2c5;
}
.item{
  position:relative;display:flex;align-items:stretch;
  min-height:108px;margin-bottom:7px;
  border:1px solid #eee7de;border-radius:14px;
  background:var(--paper);box-shadow:0 6px 28px #5546380c;
  cursor:pointer;overflow:hidden;
}
.item:hover{border-color:#d8cbbd}
.item.active{
  border-color:#a6b7a6;background:#f8faf5;
  box-shadow:inset 3px 0 var(--sage),0 6px 28px #5546380c;
}
.item-date{
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;flex-shrink:0;width:69px;
  padding:9px 3px;border-right:1px solid #f0e9e1;
  color:var(--clay);
}
.item-month{
  font-size:11px;font-weight:700;letter-spacing:.08em;
}
.item-day{
  font-family:Georgia,serif;font-size:37px;
  line-height:1.08;font-variant-numeric:lining-nums;
}
.item-time{
  margin-top:7px;color:#998a7c;font-size:11px;
  font-variant-numeric:tabular-nums;
}
.item-content{
  flex:1;min-width:0;padding:15px 7px 11px 13px;
}
.item-content strong{
  display:block;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:14px;line-height:1.5;
}
.item-content mark{
  background:#fff0b6;color:inherit;
  border-radius:3px;padding:0 1px;
}
.item-content p{
  display:-webkit-box;margin:7px 0 0;overflow:hidden;
  color:#8d867d;font-size:12px;line-height:1.6;
  -webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow-wrap:anywhere;
}
.item-meta{
  display:flex;align-items:center;flex-wrap:wrap;
  gap:6px;margin-top:8px;font-size:11px;
}
.check-progress,.copied-marker{
  display:inline-block;padding:3px 7px;border-radius:7px;
  background:var(--sage-soft);color:#5c775e;font-size:11px;
}
.copied-marker{background:#f4e8d9;color:#a1734c}
.item-actions{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;flex-shrink:0;gap:1px;
  width:37px;padding:7px 5px 7px 0;
}
.item-icon{
  display:grid;place-items:center;width:29px;height:29px;
  border-radius:8px;color:#b8b0a5;font-size:18px;
}
.item-icon:hover{background:#f0eae1;color:var(--ink)}
.item-icon.on{color:var(--gold)}
.item-icon.pin-on{color:var(--sage)}
.item-icon.delete{color:#c4b6ae;font-size:20px}
.item-icon.delete:hover{
  background:#f8e8e5;color:var(--danger);
}
.ghost-card{
  display:block;min-height:0;padding:15px 42px 15px 17px;
  border-color:#e4d7df;background:#f5eff3;
}
.ghost-card strong{
  display:block;color:#80677b;font-size:13px;
}
.ghost-card p{
  margin:7px 0 0;color:#917b8d;font-size:12px;line-height:1.6;
}
.ghost-close{
  position:absolute;top:7px;right:8px;
  width:30px;height:30px;border-radius:8px;font-size:19px;
}
.side-bottom{
  display:flex;align-items:stretch;gap:8px;
  padding:11px 13px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:var(--cream);flex-shrink:0;
}
.bottom-icon{
  display:grid;place-items:center;width:44px;min-width:44px;
  min-height:49px;border:1px solid #ded4c8;
  border-radius:13px;background:var(--paper);
  color:#867769;font-size:20px;
}
.create-button{
  flex:1;min-width:0;min-height:49px;border-radius:13px;
  background:var(--sage);color:white;font-size:14px;
  font-weight:700;
}
.create-button:hover{background:#506b55}
.editor{
  display:flex;flex-direction:column;min-width:0;
  min-height:0;background:#fffdf9;
}
.editor>.toolbar{border-bottom:1px solid #f0ebe3}
.edit{
  display:flex;flex-direction:column;flex:1;min-height:0;
  width:100%;max-width:920px;margin:auto;padding:23px 35px;
}
#title{
  width:100%;padding:13px 0;border:0;outline:0;
  background:none;color:var(--ink);
  font-size:24px;font-weight:700;
}
#body{
  flex:1;min-height:0;width:100%;padding:10px 0 20px;
  border:0;outline:0;resize:none;background:none;
  color:var(--ink);font-size:16px;line-height:1.85;
}
.checklist{
  flex:1;min-height:0;overflow-y:auto;padding:9px 0 20px;
}
.check-row{
  display:flex;align-items:center;gap:10px;min-height:44px;
}
.check-row input[type=checkbox]{
  width:19px;height:19px;accent-color:var(--sage);flex-shrink:0;
}
.check-text{
  flex:1;min-width:0;padding:9px 3px;border:0;
  border-bottom:1px solid #eee9e2;background:transparent;
  outline:0;font-size:16px;
}
.check-text.done{
  color:#a09c93;text-decoration:line-through;
}
.check-delete{
  width:30px;height:34px;color:#b7aca1;font-size:18px;
}
.check-add{
  padding:12px 3px;color:var(--sage);font-size:14px;
}
.edit-tools{
  display:flex;align-items:center;gap:8px;
  padding:5px 0 11px;flex-shrink:0;
}
.mode-button{
  padding:8px 12px;border:1px solid var(--line);
  border-radius:10px;color:#81796e;font-size:12px;
}
.mode-button.on{
  background:var(--sage-soft);
  border-color:#c9d8c8;color:var(--sage);
}
.mode-hint{color:var(--muted);font-size:11px}
.link-preview{
  flex-shrink:0;max-height:120px;overflow-y:auto;
  padding:8px 0;border-top:1px solid var(--line);font-size:13px;
}
.link-preview:empty{display:none}
.link-preview small{
  display:block;margin-bottom:5px;color:var(--muted);
}
.link-preview a{
  display:block;padding:5px 0;color:var(--sage);overflow-wrap:anywhere;
}
.copy-success{background:var(--sage-soft);color:var(--sage)}
.empty-editor{
  flex:1;display:grid;place-items:center;padding:20px;
  color:#aaa297;font-size:14px;text-align:center;
}
.overlay{
  position:fixed;inset:0;z-index:30;display:grid;
  place-items:center;padding:18px;background:#332a2580;
}
.modal{
  width:min(560px,100%);max-height:90dvh;overflow:auto;
  padding:25px;border:1px solid #eee5db;
  border-radius:19px;background:var(--paper);
  box-shadow:0 20px 70px #21170e30;
}
.modal h2{
  margin:0 0 10px;color:#584b40;font-size:19px;
}
.modal p{
  white-space:pre-line;line-height:1.8;
  color:#756d63;font-size:14px;
}
.actions{
  display:flex;justify-content:flex-end;flex-wrap:wrap;
  gap:10px;margin-top:22px;
}
.action{
  padding:11px 16px;border-radius:10px;
  background:#eee8df;font-size:13px;
}
.action.primary{background:var(--sage);color:white}
.action.danger{background:var(--danger);color:white}
.toast{
  position:fixed;left:50%;bottom:22px;
  transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:12px;
  max-width:calc(100vw - 30px);
  padding:12px 16px;border-radius:12px;
  background:#514a40;color:white;
  box-shadow:0 6px 28px #0003;font-size:13px;
}
.toast button{
  color:#d8ebd8;font-weight:700;white-space:nowrap;
}
.settings-tabs{
  display:flex;gap:5px;overflow-x:auto;
  padding:5px 0 13px;border-bottom:1px solid var(--line);
}
.settings-tab{
  flex-shrink:0;padding:9px 11px;
  border-radius:9px;color:#8a8075;font-size:12px;
}
.settings-tab.active{
  background:var(--sage-soft);
  color:var(--sage);font-weight:700;
}
.settings-list{padding-top:7px}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px 0;border-bottom:1px solid #eee8e0;
}
.setting-info{flex:1;min-width:0}
.setting-name{
  display:block;font-size:13px;font-weight:700;
}
.setting-desc{
  display:block;margin-top:5px;color:var(--muted);
  font-size:11px;line-height:1.5;
}
.switch{
  position:relative;flex-shrink:0;width:43px;height:25px;
  border-radius:20px;background:#d4cdc3;
}
.switch:after{
  content:"";position:absolute;top:3px;left:3px;
  width:19px;height:19px;border-radius:50%;
  background:white;box-shadow:0 1px 4px #0002;
  transition:transform .15s;
}
.switch.on{background:var(--sage)}
.switch.on:after{transform:translateX(18px)}
.settings-note{
  margin-top:16px;color:var(--muted);
  font-size:11px;line-height:1.7;
}
.review-item{
  padding:12px 0;border-bottom:1px solid var(--line);
}
.review-item strong{
  display:block;font-size:13px;overflow-wrap:anywhere;
}
.review-item p{margin:4px 0;font-size:12px}
.review-item .actions{margin-top:8px}
.review-scroll{max-height:48dvh;overflow:auto}
.mobile{display:none}
@media(max-width:700px){
  .app{display:block}
  .side{
    position:fixed;inset:0;z-index:10;
    transform:translateX(-100%);
    transition:transform .12s ease;
  }
  .side.open{transform:translateX(0)}
  .editor{height:100dvh}
  .mobile{display:grid}
  .edit{padding:13px 19px}
  #title{font-size:21px}
  .btn{min-width:35px;width:35px}
  .list{padding:0 11px 15px}
  .item{min-height:105px}
  .item-date{width:68px}
  .item-day{font-size:36px}
}
@media(min-width:701px){
  .item-icon:not(.on):not(.pin-on){opacity:.65}
  .item:hover .item-icon{opacity:1}
}
</style>
</head>
<body>

<div class="app">
  <aside id="side" class="side">
    <header class="toolbar">
      <button id="closeList" class="btn mobile" title="一覧を閉じる">‹</button>
      <div class="brand">SUGU</div>
      <button id="refresh" class="btn" title="メモを更新">
        <span class="refresh-glyph">↻</span>
      </button>
      <button id="settings" class="btn" title="設定">⚙</button>
      <button id="import" class="btn" title="JSONを取り込む">⇩</button>
      <button id="export" class="btn" title="JSONバックアップ">⇧</button>
    </header>

    <div class="syncbar">
      <span id="account">ログインしていません</span>
      <button id="login" class="syncbtn">Googleログイン</button>
      <button id="logout" class="syncbtn hide">ログアウト</button>
      <button id="startSync" class="syncbtn hide">同期を開始</button>
    </div>

    <input id="search" class="search"
      placeholder="メモを検索" aria-label="メモを検索">

    <div class="filters">
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="ear">★ お気に入り</button>
      <button class="chip" data-filter="trash">ゴミ箱</button>
    </div>

    <div class="sortbar">
      <span id="count" class="count"></span>
      <select id="sort" class="sort-select">
        <option value="updated">更新が新しい順</option>
        <option value="created">作成が新しい順</option>
        <option value="title">タイトル順</option>
      </select>
    </div>

    <div id="list" class="list" tabindex="-1"></div>

    <div class="side-bottom">
      <button id="paste" class="bottom-icon" title="貼り付け">▣</button>
      <button id="sideNew" class="create-button">＋ すぐメモ</button>
      <button id="stats" class="bottom-icon" title="記録">▥</button>
    </div>
  </aside>

  <main class="editor">
    <header class="toolbar">
      <button id="openList" class="btn mobile" title="一覧">‹</button>
      <span id="status" class="status">読み込み中</span>
      <div class="spacer"></div>
      <button id="syncMenu" class="btn" title="クラウド同期">☁</button>
      <button id="new" class="btn" title="新規メモ">＋</button>
      <button id="copy" class="btn" title="本文コピー">□</button>
      <button id="pin" class="btn" title="ピン留め">♧</button>
      <button id="ear" class="btn" title="お気に入り">☆</button>
      <button id="remove" class="btn" title="削除">×</button>
    </header>

    <div id="editArea" class="edit">
      <input id="title" placeholder="タイトル" autocomplete="off">
      <div class="edit-tools">
        <button id="mode" class="mode-button">
          ☑ チェックリストにする
        </button>
        <span id="modeHint" class="mode-hint"></span>
      </div>
      <textarea id="body" placeholder="メモを書く…"
        spellcheck="false"></textarea>
      <div id="checklist" class="checklist hide"></div>
      <div id="links" class="link-preview"></div>
    </div>

    <div id="emptyEditor" class="empty-editor hide">
      一覧からメモを選んでください
    </div>
  </main>
</div>

<input id="file" type="file"
  accept=".json,application/json" class="hide">

<div id="dialogs"></div>

<div id="toast" class="toast hide">
  <span id="toastText"></span>
  <button id="toastUndo" class="hide">元に戻す</button>
</div>

<script type="module">
'use strict';

const $ = id => document.getElementById(id);

const DB = 'mimi-sync-db';
const TABLE = 'notes';
const META = 'syncMeta';

const firebaseConfig = {
  apiKey:'AIzaSyDPlUYQ6vzg8rBQAdt_M-i3hOm8VRkB6FE',
  authDomain:'sugu-43386.firebaseapp.com',
  databaseURL:'https://sugu-43386-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'sugu-43386',
  storageBucket:'sugu-43386.firebasestorage.app',
  messagingSenderId:'1056209931526',
  appId:'1:1056209931526:web:111fca8d731e2e1a452287'
};

const DEFAULT_SETTINGS = {
  favorites:true,
  pin:true,
  checklistProgress:true,
  ghost:true,
  listDelete:true,
  checklist:true,
  links:true,
  copy:true,
  paste:true,
  stats:true,
  trash:true,
  undo:true,
  sort:true,
  deleteKey:true,
  syncControls:true
};

const SETTING_GROUPS = [
  {
    id:'list',
    name:'一覧',
    items:[
      ['favorites','お気に入り','★の表示と絞り込み'],
      ['pin','ピン留め','一覧上部に固定'],
      ['checklistProgress','進捗表示','完了数を一覧に表示'],
      ['ghost','メモの亡霊','昔のメモを紹介'],
      ['listDelete','削除ボタン','一覧に×を表示']
    ]
  },
  {
    id:'edit',
    name:'編集',
    items:[
      ['checklist','チェックリスト','チェックリストへの切り替え'],
      ['links','リンク一覧','本文のURLを表示'],
      ['copy','本文コピー','コピーボタン']
    ]
  },
  {
    id:'extra',
    name:'追加機能',
    items:[
      ['paste','クリップボード','コピーした文章から新規メモ'],
      ['stats','どうでもいい記録','メモ数などを表示'],
      ['trash','ゴミ箱','削除したメモを復元'],
      ['undo','削除の取り消し','削除直後に元へ戻す']
    ]
  },
  {
    id:'system',
    name:'システム',
    items:[
      ['sort','並べ替え','並べ替えメニュー'],
      ['deleteKey','Deleteキー','一覧で選択したメモの削除'],
      ['syncControls','クラウド同期','ログインと同期操作']
    ]
  }
];

let settings = {...DEFAULT_SETTINGS};

let db;
let notes = [];
let selected = null;
let filter = 'all';
let sortMode = 'updated';
let screen = 'list';

let queue = Promise.resolve();
let saveError = null;
let modalOpen = false;
let settingsTab = 'list';
let copiedId = null;
let undoInfo = null;
let toastTimer = null;
let searchTimer = null;
let listCheckScheduled = false;

let listItems = [];
let renderedCount = 0;
let renderedYear = null;
let ghostNote = null;
let ghostInserted = false;
let ghostDismissedDay = '';
let listDirty = false;
let listRefreshTimer = null;
let lastListScroll = 0;

let firebase = null;
let auth = null;
let firestore = null;
let cloudUser = null;
let syncEnabled = false;
let syncing = false;
let syncAgain = false;
let syncPromise = null;
let syncTimer = null;
let syncInterval = null;
let accountGeneration = 0;
let syncError = '';
let manualRefreshing = false;
let lastSync = 0;

const iso = () => new Date().toISOString();
const clone = obj => JSON.parse(JSON.stringify(obj));

function localGet(key){
  try{
    return localStorage.getItem(key);
  }catch(e){
    return null;
  }
}

function localSet(key,value){
  try{
    localStorage.setItem(key,String(value));
  }catch(e){}
}

function loadSettings(){
  try{
    const saved = JSON.parse(
      localGet('sugu-settings-v1') || '{}'
    );

    for(const key of Object.keys(DEFAULT_SETTINGS)){
      if(typeof saved[key] === 'boolean'){
        settings[key] = saved[key];
      }
    }
  }catch(e){}
}

function saveSettings(){
  localSet(
    'sugu-settings-v1',
    JSON.stringify(settings)
  );
}

function timestamp(value){
  if(typeof value === 'number'){
    return value < 1e11
      ? value*1000
      : value;
  }

  if(!value) return 0;

  const s = String(value);

  if(/^\d{10,13}$/.test(s)){
    const n = Number(s);
    return n < 1e11 ? n*1000 : n;
  }

  const n = Date.parse(s) ||
    Date.parse(s.replace(' ','T'));

  return Number.isFinite(n) ? n : 0;
}

function todayKey(){
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

function dateParts(n){
  const t = timestamp(
    n.createdAt || n.updatedAt
  );

  if(!t){
    return {
      year:'日付なし',
      month:'--',
      day:'--',
      time:'--:--'
    };
  }

  const d = new Date(t);
  const two = x => String(x).padStart(2,'0');

  return {
    year:String(d.getFullYear()),
    month:two(d.getMonth()+1),
    day:two(d.getDate()),
    time:two(d.getHours())+':'+two(d.getMinutes())
  };
}

function normalizeNote(raw,id=raw.id){
  const updated = String(raw.updatedAt || '');

  return {
    id:String(id),
    title:String(raw.title ?? ''),
    body:String(raw.body ?? ''),
    ear:!!raw.ear,
    pinned:!!raw.pinned,
    checklist:!!raw.checklist,
    checks:Array.isArray(raw.checks)
      ? raw.checks.map(Boolean)
      : [],
    createdAt:String(raw.createdAt || ''),
    updatedAt:updated,
    contentAt:String(
      raw.contentAt ||
      updated ||
      raw.createdAt ||
      ''
    ),
    deleted:!!raw.deleted,
    deletedAt:String(raw.deletedAt || '')
  };
}

function current(){
  return notes.find(n=>
    n.id === selected &&
    !n.deleted
  );
}

function label(n){
  return n.title ||
    n.body.split('\n').find(Boolean) ||
    '無題';
}

function sorted(trash=false){
  const arr = notes.filter(n=>
    trash ? n.deleted : !n.deleted
  );

  arr.sort((a,b)=>{
    if(
      !trash &&
      !!a.pinned !== !!b.pinned
    ){
      return a.pinned ? -1 : 1;
    }

    if(trash){
      return timestamp(
        b.deletedAt || b.updatedAt
      ) - timestamp(
        a.deletedAt || a.updatedAt
      );
    }

    if(sortMode === 'created'){
      return timestamp(b.createdAt) -
        timestamp(a.createdAt);
    }

    if(sortMode === 'title'){
      const result = label(a)
        .localeCompare(label(b),'ja');

      if(result) return result;
    }

    return timestamp(
      b.contentAt || b.updatedAt
    ) - timestamp(
      a.contentAt || a.updatedAt
    );
  });

  return arr;
}

/* ==================================================
   IndexedDB
================================================== */

function openDB(){
  return new Promise((resolve,reject)=>{
    const r = indexedDB.open(DB,2);

    r.onupgradeneeded = ()=>{
      const d = r.result;

      if(!d.objectStoreNames.contains(TABLE)){
        d.createObjectStore(
          TABLE,{keyPath:'id'}
        );
      }

      if(!d.objectStoreNames.contains(META)){
        d.createObjectStore(
          META,{keyPath:'key'}
        );
      }
    };

    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.onblocked = ()=>reject(
      Error('保存領域が使用中です')
    );
  });
}

function dbGetAll(){
  return new Promise((resolve,reject)=>{
    const r = db.transaction(
      TABLE,'readonly'
    ).objectStore(TABLE).getAll();

    r.onsuccess = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
  });
}

function metaGet(key){
  return new Promise((resolve,reject)=>{
    const r = db.transaction(
      META,'readonly'
    ).objectStore(META).get(key);

    r.onsuccess = ()=>resolve(r.result?.value);
    r.onerror = ()=>reject(r.error);
  });
}

function metaPut(key,value){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(
      META,'readwrite'
    );

    tx.objectStore(META).put({key,value});

    tx.oncomplete = resolve;
    tx.onerror = ()=>reject(tx.error);
    tx.onabort = ()=>reject(tx.error);
  });
}

function dbPutMany(items){
  if(!items.length){
    return Promise.resolve();
  }

  return new Promise((resolve,reject)=>{
    const tx = db.transaction(
      TABLE,'readwrite'
    );

    const store = tx.objectStore(TABLE);

    for(const n of items){
      store.put(clone(n));
    }

    tx.oncomplete = resolve;
    tx.onerror = ()=>reject(tx.error);
    tx.onabort = ()=>reject(tx.error);
  });
}

function enqueue(job){
  const task = queue.then(job);

  queue = task.catch(e=>{
    saveError = e;
    $('status').textContent = '保存失敗';
    console.error('SUGU save:',e);
  });

  return task;
}

async function waitForSaves(){
  await queue;

  if(saveError){
    throw saveError;
  }
}

function storeNote(n){
  const snapshot = clone(n);

  saveError = null;
  $('status').textContent = '保存中';

  const task = enqueue(
    ()=>dbPutMany([snapshot])
  );

  task.then(()=>{
    if(
      selected === snapshot.id &&
      !saveError
    ){
      $('status').textContent = '保存済み';
    }

    scheduleSync();
  }).catch(()=>{});

  return task;
}

function markChanged(n,content=false){
  const now = iso();

  n.updatedAt = now;

  if(content){
    n.contentAt = now;
  }

  storeNote(n);
  scheduleListRefresh(content);
}

function dialog(
  title,
  message,
  choices=['閉じる'],
  options={}
){
  return new Promise(resolve=>{
    modalOpen = true;

    const host = $('dialogs');
    host.replaceChildren();

    const previous = document.activeElement;

    const overlay = document.createElement('div');
    const box = document.createElement('div');
    const h = document.createElement('h2');
    const p = document.createElement('p');
    const actions = document.createElement('div');
    const buttons = [];

    overlay.className = 'overlay';
    box.className = 'modal';

    box.setAttribute('role','dialog');
    box.setAttribute('aria-modal','true');

    h.textContent = title;
    p.textContent = message;
    actions.className = 'actions';

    let finished = false;

    function finish(index){
      if(finished) return;

      finished = true;
      modalOpen = false;
      host.replaceChildren();

      document.removeEventListener(
        'keydown',keys,true
      );

      if(previous?.isConnected){
        previous.focus({preventScroll:true});
      }

      resolve(index);
    }

    function keys(e){
      if(e.key === 'Escape'){
        e.preventDefault();
        e.stopPropagation();
        finish(0);
      }else if(
        e.key === 'Enter' &&
        !e.isComposing
      ){
        e.preventDefault();
        e.stopPropagation();
        finish(options.enterIndex ?? 0);
      }else if(e.key === 'Tab'){
        const i = buttons.indexOf(
          document.activeElement
        );

        if(e.shiftKey && i <= 0){
          e.preventDefault();
          buttons.at(-1)?.focus();
        }else if(
          !e.shiftKey &&
          i === buttons.length-1
        ){
          e.preventDefault();
          buttons[0]?.focus();
        }
      }
    }

    choices.forEach((name,i)=>{
      const b = document.createElement('button');
      b.className = 'action';

      if(i === choices.length-1){
        b.classList.add(
          options.danger
            ? 'danger'
            : 'primary'
        );
      }

      b.textContent = name;
      b.onclick = ()=>finish(i);

      buttons.push(b);
      actions.append(b);
    });

    box.append(h,p,actions);
    overlay.append(box);
    host.append(overlay);

    document.addEventListener(
      'keydown',keys,true
    );

    requestAnimationFrame(()=>{
      (
        options.focusConfirm
          ? buttons.at(-1)
          : buttons[0]
      )?.focus();
    });
  });
}

/* ==================================================
   検索
================================================== */

/*
 * メモごとの検索対象をキャッシュする。
 * メモ本文やタイトルが変わった場合だけ再計算。
 * 追加の通信や保存処理は発生しない。
 */
const searchCache = new WeakMap();

function searchText(n){
  const old = searchCache.get(n);

  if(
    old &&
    old.title === n.title &&
    old.body === n.body
  ){
    return old.text;
  }

  const text = (
    n.title+'\n'+n.body
  ).toLocaleLowerCase();

  searchCache.set(n,{
    title:n.title,
    body:n.body,
    text
  });

  return text;
}

/*
 * 検索一致文字を背景色で強調する。
 * HTML文字列の挿入は使わない。
 */
function setHighlighted(node,text,query){
  node.replaceChildren();

  if(!query){
    node.textContent = text;
    return;
  }

  const lower = text.toLocaleLowerCase();

  let from = 0;
  let hits = 0;
  let index;

  while(
    hits < 8 &&
    (
      index = lower.indexOf(query,from)
    ) !== -1
  ){
    if(index > from){
      node.append(
        document.createTextNode(
          text.slice(from,index)
        )
      );
    }

    const mark = document.createElement('mark');

    mark.textContent = text.slice(
      index,
      index+query.length
    );

    node.append(mark);

    from = index+query.length;
    hits++;
  }

  node.append(
    document.createTextNode(
      text.slice(from)
    )
  );
}

/* ==================================================
   メモ一覧
================================================== */

function viewedMap(){
  try{
    return JSON.parse(
      localGet('sugu-viewed-v1') || '{}'
    );
  }catch(e){
    return {};
  }
}

function recordView(id){
  const map = viewedMap();
  map[id] = Date.now();

  const entries = Object.entries(map)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,1000);

  localSet(
    'sugu-viewed-v1',
    JSON.stringify(
      Object.fromEntries(entries)
    )
  );
}

function ghostCandidate(arr){
  if(
    !settings.ghost ||
    ghostDismissedDay === todayKey()
  ){
    return null;
  }

  const viewed = viewedMap();
  const cutoff = Date.now()-30*86400000;

  const old = arr.filter(n=>{
    const last =
      viewed[n.id] ||
      timestamp(
        n.createdAt || n.updatedAt
      );

    return last > 0 && last < cutoff;
  });

  return old.length
    ? old[Math.floor(Date.now()/86400000)%old.length]
    : null;
}

function makeYear(year){
  const h = document.createElement('div');

  h.className = 'year-heading';
  h.textContent = year;

  return h;
}

function makeGhost(n){
  const card = document.createElement('div');
  card.className = 'item ghost-card';
  card.dataset.id = n.id;

  const title = document.createElement('strong');
  title.textContent = '👻 メモの亡霊';

  const p = document.createElement('p');

  p.textContent =
    `「私のこと、覚えていますか。」 ${label(n)}`;

  const close = document.createElement('button');

  close.className = 'ghost-close';
  close.textContent = '×';
  close.title = '今日は表示しない';

  close.onclick = e=>{
    e.stopPropagation();

    ghostDismissedDay = todayKey();

    localSet(
      'sugu-ghost-dismiss',
      ghostDismissedDay
    );

    render();
  };

  card.append(title,p,close);

  return card;
}

function makeIcon(text,title,fn,className=''){
  const b = document.createElement('button');

  b.className = 'item-icon '+className;
  b.textContent = text;
  b.title = title;
  b.setAttribute('aria-label',title);

  b.onclick = e=>{
    e.stopPropagation();
    fn();
  };

  return b;
}

function makeItem(n){
  const item = document.createElement('div');

  item.className =
    'item'+(n.id === selected ? ' active' : '');

  item.dataset.id = n.id;
  item.tabIndex = 0;

  item.setAttribute('role','button');
  item.setAttribute('aria-label',label(n));

  const d = dateParts(n);

  const date = document.createElement('div');
  const month = document.createElement('span');
  const day = document.createElement('span');
  const time = document.createElement('span');

  date.className = 'item-date';

  month.className = 'item-month';
  month.textContent = d.month+' /';

  day.className = 'item-day';
  day.textContent = d.day;

  time.className = 'item-time';
  time.textContent = d.time;

  date.append(month,day,time);

  const content = document.createElement('div');
  const title = document.createElement('strong');
  const preview = document.createElement('p');
  const meta = document.createElement('div');

  content.className = 'item-content';

  const q = $('search').value
    .trim().toLocaleLowerCase();

  setHighlighted(title,label(n),q);

  const previewText = n.checklist
    ? (
        n.body.split('\n')
          .filter(Boolean)
          .slice(0,3)
          .join(' / ') ||
        'チェックリスト'
      )
    : n.body.replace(/\s+/g,' ')
        .slice(0,220);

  setHighlighted(
    preview,
    previewText,
    q
  );

  content.append(title,preview);
  meta.className = 'item-meta';

  if(
    n.checklist &&
    settings.checklistProgress
  ){
    const lines = n.body
      ? n.body.split('\n')
      : [];

    const total = lines.filter(
      x=>x.trim()
    ).length;

    const done = lines.filter(
      (x,i)=>x.trim() && n.checks[i]
    ).length;

    const b = document.createElement('span');

    b.className = 'check-progress';
    b.textContent = `☑ ${done}/${total}`;

    meta.append(b);
  }

  if(copiedId === n.id){
    const b = document.createElement('span');

    b.className = 'copied-marker';
    b.textContent = '✓ コピー済み';

    meta.append(b);
  }

  /*
   * 以前の「要確認」表示は撤去。
   * 既存の競合コピーのデータは変更しない。
   */

  if(meta.childNodes.length){
    content.append(meta);
  }

  const actions = document.createElement('div');
  actions.className = 'item-actions';

  if(filter === 'trash'){
    actions.append(
      makeIcon(
        '↶',
        'メモを復元',
        ()=>restoreNote(n.id)
      )
    );
  }else{
    if(settings.pin){
      actions.append(
        makeIcon(
          n.pinned ? '📌' : '♧',
          n.pinned
            ? 'ピン留め解除'
            : 'ピン留め',
          ()=>toggleField(n.id,'pinned'),
          n.pinned ? 'pin-on' : ''
        )
      );
    }

    if(settings.favorites){
      actions.append(
        makeIcon(
          n.ear ? '★' : '☆',
          n.ear
            ? 'お気に入り解除'
            : 'お気に入り',
          ()=>toggleField(n.id,'ear'),
          n.ear ? 'on' : ''
        )
      );
    }

    if(settings.listDelete){
      actions.append(
        makeIcon(
          '×',
          'メモを削除',
          ()=>remove(n.id),
          'delete'
        )
      );
    }
  }

  item.append(date,content,actions);

  return item;
}

function render(){
  if(!db) return;

  const root = $('list');
  const scroll = root.scrollTop;
  const desired = Math.max(10,renderedCount);

  const q = $('search').value
    .trim()
    .toLocaleLowerCase();

  let all = sorted(filter === 'trash');

  all = all.filter(n=>
    (filter !== 'ear' || n.ear) &&
    searchText(n).includes(q)
  );

  $('count').textContent =
    `${all.length}件`;

  ghostNote = !q && filter === 'all'
    ? ghostCandidate(all)
    : null;

  listItems = all;
  renderedCount = 0;
  renderedYear = null;
  ghostInserted = false;

  root.replaceChildren();

  if(!listItems.length && !ghostNote){
    const empty = document.createElement('p');

    empty.className = 'search-empty';
    empty.textContent = q
      ? '一致するメモがありません'
      : 'メモがありません';

    root.append(empty);
  }

  while(
    renderedCount <
    Math.min(desired,listItems.length)
  ){
    appendNext(false);
  }

  if(!listItems.length && ghostNote){
    root.append(makeGhost(ghostNote));
    ghostInserted = true;
  }

  root.scrollTop = scroll;
  listDirty = false;

  scheduleListCheck();
}

function appendNext(check=true){
  if(renderedCount >= listItems.length){
    return;
  }

  const root = $('list');
  const start = renderedCount;
  const end = Math.min(
    start+10,
    listItems.length
  );

  const f = document.createDocumentFragment();

  for(let i=start;i<end;i++){
    if(
      i === 3 &&
      ghostNote &&
      !ghostInserted
    ){
      f.append(makeGhost(ghostNote));
      ghostInserted = true;
    }

    const n = listItems[i];
    const year = dateParts(n).year;

    if(year !== renderedYear){
      f.append(makeYear(year));
      renderedYear = year;
    }

    f.append(makeItem(n));
  }

  renderedCount = end;

  if(
    end === listItems.length &&
    ghostNote &&
    !ghostInserted
  ){
    f.append(makeGhost(ghostNote));
    ghostInserted = true;
  }

  root.append(f);

  if(check){
    scheduleListCheck();
  }
}

function checkListBottom(){
  if(
    modalOpen ||
    renderedCount >= listItems.length
  ){
    return;
  }

  if(
    matchMedia('(max-width:700px)').matches &&
    screen !== 'list'
  ){
    return;
  }

  const root = $('list');

  if(
    !root.clientHeight ||
    !root.getClientRects().length
  ){
    return;
  }

  const remaining =
    root.scrollHeight -
    root.scrollTop -
    root.clientHeight;

  if(remaining <= 120){
    appendNext(false);
    scheduleListCheck();
  }
}

function scheduleListCheck(){
  if(listCheckScheduled) return;

  listCheckScheduled = true;

  requestAnimationFrame(()=>{
    listCheckScheduled = false;
    checkListBottom();
  });
}

   本文編集
================================================== */

function updateLinks(){
  const root = $('links');
  root.replaceChildren();

  if(!settings.links) return;

  const matches = $('body').value.match(
    /https?:\/\/[^\s<>"'「」]+/g
  ) || [];

  const urls = [...new Set(matches)]
    .slice(0,20);

  if(!urls.length) return;

  const small = document.createElement('small');
  small.textContent = '本文中のリンク';
  root.append(small);

  for(const raw of urls){
    const clean = raw.replace(
      /[.,。、）)\]】]+$/g,
      ''
    );

    try{
      const url = new URL(clean);

      if(
        !['http:','https:'].includes(
          url.protocol
        )
      ){
        continue;
      }

      const a = document.createElement('a');

      a.href = url.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = clean;

      root.append(a);
    }catch(e){}
  }
}

function renderChecklist(){
  const root = $('checklist');
  root.replaceChildren();

  const n = current();
  if(!n || !n.checklist) return;

  const lines = n.body
    ? n.body.split('\n')
    : [''];

  lines.forEach((line,i)=>{
    const row = document.createElement('div');
    const box = document.createElement('input');
    const text = document.createElement('input');
    const del = document.createElement('button');

    row.className = 'check-row';

    box.type = 'checkbox';
    box.checked = !!n.checks[i];

    text.type = 'text';

    text.className =
      'check-text'+
      (box.checked ? ' done' : '');

    text.value = line;
    text.placeholder = '項目を入力';

    del.className = 'check-delete';
    del.textContent = '×';

    box.onchange = ()=>{
      n.checks[i] = box.checked;
      text.classList.toggle(
        'done',
        box.checked
      );

      markChanged(n,true);
    };

    text.oninput = ()=>{
      const arr = n.body
        ? n.body.split('\n')
        : [''];

      arr[i] = text.value;
      n.body = arr.join('\n');

      $('body').value = n.body;

      markChanged(n,true);
    };

    text.onkeydown = e=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        addChecklistRow(i+1);
      }
    };

    del.onclick = ()=>{
      const arr = n.body
        ? n.body.split('\n')
        : [''];

      arr.splice(i,1);
      n.checks.splice(i,1);

      n.body = arr.join('\n');
      $('body').value = n.body;

      markChanged(n,true);
      renderChecklist();
    };

    row.append(box,text,del);
    root.append(row);
  });

  const add = document.createElement('button');

  add.className = 'check-add';
  add.textContent = '＋ 項目を追加';

  add.onclick = ()=>{
    addChecklistRow(lines.length);
  };

  root.append(add);
}

function addChecklistRow(index){
  const n = current();

  if(!n || !n.checklist) return;

  const lines = n.body
    ? n.body.split('\n')
    : [];

  lines.splice(index,0,'');
  n.checks.splice(index,0,false);

  n.body = lines.join('\n');

  $('body').value = n.body;

  markChanged(n,true);
  renderChecklist();

  $('checklist')
    .querySelectorAll('.check-text')[index]
    ?.focus();
}

function updateEditor(){
  const n = current();

  $('editArea').classList.toggle(
    'hide',!n
  );

  $('emptyEditor').classList.toggle(
    'hide',!!n
  );

  for(const id of [
    'copy','pin','ear','remove'
  ]){
    $(id).disabled = !n;
  }

  if(!n){
    $('title').value = '';
    $('body').value = '';

    $('links').replaceChildren();
    $('checklist').replaceChildren();

    return;
  }

  $('title').value = n.title;
  $('body').value = n.body;

  $('ear').textContent =
    n.ear ? '★' : '☆';

  $('pin').textContent =
    n.pinned ? '📌' : '♧';

  $('copy').textContent =
    copiedId === n.id ? '✓' : '□';

  $('copy').classList.toggle(
    'copy-success',
    copiedId === n.id
  );

  $('mode').textContent = n.checklist
    ? '☑ チェックリスト ON'
    : '☐ チェックリストにする';

  $('mode').classList.toggle(
    'on',
    n.checklist
  );

  $('modeHint').textContent =
    n.checklist
      ? '1行につき1項目'
      : '';

  $('body').classList.toggle(
    'hide',
    n.checklist
  );

  $('checklist').classList.toggle(
    'hide',
    !n.checklist
  );

  renderChecklist();
  updateLinks();
}

function saveEditor(){
  const n = current();

  if(!n) return;

  const title = $('title').value;

  const body = n.checklist
    ? n.body
    : $('body').value;

  if(
    title === n.title &&
    body === n.body
  ){
    return;
  }

  n.title = title;
  n.body = body;

  if(copiedId === n.id){
    copiedId = null;
  }

  markChanged(n,true);
}

async function create(
  focus=true,
  body='',
  title=''
){
  const now = iso();

  const n = {
    id:crypto.randomUUID(),
    title,
    body,
    ear:false,
    pinned:false,
    checklist:false,
    checks:[],
    createdAt:now,
    updatedAt:now,
    contentAt:now,
    deleted:false,
    deletedAt:''
  };

  try{
    await enqueue(
      ()=>dbPutMany([n])
    );

    notes.push(n);

    if(filter !== 'all'){
      filter = 'all';
      updateFilterUI();
    }else{
      listDirty = true;
    }

    choose(n.id,focus);
    scheduleSync();
  }catch(e){
    await dialog(
      '保存エラー',
      String(e.message || e)
    );
  }
}

async function toggleField(id,field){
  const n = notes.find(x=>
    x.id === id &&
    !x.deleted
  );

  if(!n) return;

  n[field] = !n[field];

  /*
   * ★やピン留めの操作は
   * 本文更新日時を変更しない。
   */
  markChanged(n,false);

  if(selected === id){
    updateEditor();
  }
}

function toggleChecklist(){
  const n = current();

  if(!n) return;

  n.checklist = !n.checklist;

  if(n.checklist){
    const lines = n.body
      ? n.body.split('\n')
      : [''];

    n.checks = lines.map(
      (_,i)=>!!n.checks[i]
    );
  }

  markChanged(n,true);
  updateEditor();
}

async function copyBody(){
  const n = current();

  if(!n) return;

  const id = n.id;

  try{
    await navigator.clipboard.writeText(
      n.body
    );

    copiedId = id;

    if(selected === id){
      updateEditor();
    }

    scheduleListRefresh();

    toast('本文をコピーしました');
  }catch(e){
    await dialog(
      'コピーできません',
      'クリップボードの権限を確認してください。'
    );
  }
}

async function pasteNew(){
  try{
    const text =
      await navigator.clipboard.readText();

    if(!text){
      await dialog(
        'クリップボードが空です',
        'コピーした文章が見つかりません。'
      );

      return;
    }

    await create(true,text);
  }catch(e){
    await dialog(
      '読み取りエラー',
      'クリップボードの権限を確認してください。'
    );
  }
}

async function showStats(){
  const all = notes.filter(n=>!n.deleted);

  const lengths = all.map(
    n=>(n.title+n.body).length
  );

  const total = lengths.reduce(
    (a,b)=>a+b,
    0
  );

  await dialog(
    'どうでもいい記録',
    `メモ総数：${all.length}件\n`+
    `全文字数：${total.toLocaleString()}字\n`+
    `最長メモ：${Math.max(0,...lengths)}字\n`+
    `最短メモ：${
      lengths.length
        ? Math.min(...lengths)
        : 0
    }字\n`+
    `チェックリスト：${
      all.filter(n=>n.checklist).length
    }件\n`+
    `ピン留め：${
      all.filter(n=>n.pinned).length
    }件\n`+
    `ゴミ箱：${
      notes.filter(n=>n.deleted).length
    }件`
  );
}

async function remove(id=selected){

async function exportJSON(){
  saveEditor();

  try{
    await waitForSaves();

    /*
     * ゴミ箱内のメモもバックアップする。
     */
    const all = await dbGetAll();

    const blob = new Blob(
      [
        JSON.stringify(
          {
            format:'mimi-sync-v1',
            exportedAt:iso(),
            notes:all
          },
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement('a');

    a.href = url;

    a.download =
      'SUGUBackup_ALL_'+
      iso().slice(0,10)+
      '.json';

    document.body.append(a);
    a.click();
    a.remove();

    setTimeout(
      ()=>URL.revokeObjectURL(url),
      10000
    );

    toast(
      `バックアップ ${all.length}件（ゴミ箱を含む）`
    );
  }catch(e){
    await dialog(
      'バックアップエラー',
      String(e.message || e)
    );
  }
}

async function importJSON(file){
  if(!file) return;

  try{
    const data = JSON.parse(
      await file.text()
    );

    if(
      data.format !== 'mimi-sync-v1' ||
      !Array.isArray(data.notes)
    ){
      throw Error(
        '対応していないJSON形式です'
      );
    }

    const incoming = new Map();

    for(const raw of data.notes){
      if(
        !raw ||
        typeof raw.id !== 'string' ||
        !raw.id
      ){
        continue;
      }

      incoming.set(
        raw.id,
        normalizeNote(raw)
      );
    }

    const known = new Set(
      notes.map(n=>n.id)
    );

    const add = [...incoming.values()]
      .filter(
        n=>!known.has(n.id)
      );

    const choice = await dialog(
      'バックアップを取り込みますか？',
      `ファイル内：${incoming.size}件\n`+
      `新規追加：${add.length}件\n`+
      '既存IDは上書きしません。ゴミ箱の状態も保持します。',
      ['キャンセル','取り込む']
    );

    if(choice !== 1) return;

    saveEditor();
    await waitForSaves();

    await enqueue(
      ()=>dbPutMany(add)
    );

    notes = await dbGetAll();

    render();
    scheduleSync();

    await dialog(
      '取り込み完了',
      `${add.length}件追加しました。`
    );
  }catch(e){
    await dialog(
      '取り込みエラー',
      String(e.message || e)
    );
  }
}

/* ==================================================
   既存の競合コピーの整理機能

   新しい競合コピーの自動作成はしない。
================================================== */

function conflictCandidates(){
  return notes.filter(n=>
    !n.deleted &&
    n.title.startsWith(
      '【競合コピー】'
    )
  );
}

function sameContent(a,b){
  return (
    a.body === b.body &&
    a.checklist === b.checklist &&
    JSON.stringify(a.checks || []) ===
      JSON.stringify(b.checks || [])
  );
}

async function reviewConflicts(){
  if(modalOpen) return;

  saveEditor();

  try{
    await waitForSaves();
  }catch(e){
    await dialog(
      '確認できません',
      String(e.message || e)
    );
    return;
  }

  const copies = conflictCandidates();

  if(!copies.length){
    await dialog(
      '競合コピー整理',
      '現在、【競合コピー】という名前のメモはありません。'
    );
    return;
  }

  modalOpen = true;

  const host = $('dialogs');
  host.replaceChildren();

  const overlay =
    document.createElement('div');

  const box =
    document.createElement('div');

  const h =
    document.createElement('h2');

  const intro =
    document.createElement('p');

  const scroll =
    document.createElement('div');

  const actions =
    document.createElement('div');

  const close =
    document.createElement('button');

  overlay.className = 'overlay';
  box.className = 'modal';

  h.textContent =
    `競合コピー整理（${copies.length}件）`;

  intro.textContent =
    '自動では削除しません。元のメモと同じ内容か、個別に確認してください。';

  scroll.className = 'review-scroll';
  actions.className = 'actions';

  close.className = 'action primary';
  close.textContent = '閉じる';

  function finish(){
    modalOpen = false;
    host.replaceChildren();

    document.removeEventListener(
      'keydown',
      keys,
      true
    );

    render();
  }

  function keys(e){
    if(e.key === 'Escape'){
      e.preventDefault();
      e.stopPropagation();
      finish();
    }
  }

  close.onclick = finish;

  for(const n of copies){
    const bare = n.title.replace(
      /^【競合コピー】/,
      ''
    );

    const matches = notes.filter(x=>
      x.id !== n.id &&
      !x.deleted &&
      !x.title.startsWith(
        '【競合コピー】'
      ) &&
      (
        x.title === bare ||
        label(x) === bare
      )
    );

    const identical = matches.filter(
      x=>sameContent(n,x)
    );

    const row =
      document.createElement('div');

    const name =
      document.createElement('strong');

    const desc =
      document.createElement('p');

    const buttons =
      document.createElement('div');

    const view =
      document.createElement('button');

    const trash =
      document.createElement('button');

    row.className = 'review-item';
    name.textContent = label(n);

    if(identical.length){
      desc.textContent =
        `本文・チェック状態が一致する元メモ候補：${identical.length}件`;
    }else if(matches.length){
      desc.textContent =
        `同名候補：${matches.length}件。ただし本文は異なります。`;
    }else{
      desc.textContent =
        '元メモ候補は見つかりません。内容を保護してください。';
    }

    buttons.className = 'actions';

    view.className = 'action';
    view.textContent = '内容を見る';

    view.onclick = ()=>{
      finish();

      selected = n.id;

      updateEditor();
      openEditorScreen();

      scheduleListRefresh();

      toast(
        'コピーを開きました。内容を確認してください。'
      );
    };

    trash.className = 'action';
    trash.textContent = 'ゴミ箱へ…';

    trash.onclick = async()=>{
      finish();
      await remove(n.id);
    };

    buttons.append(view,trash);
    row.append(name,desc,buttons);
    scroll.append(row);
  }

  actions.append(close);

  box.append(
    h,
    intro,
    scroll,
    actions
  );

  overlay.append(box);
  host.append(overlay);

  document.addEventListener(
    'keydown',
    keys,
    true
  );
}

/* ==================================================
   Firebase同期

   前回のupdatedAt比較方式を維持。
   競合コピーを自動生成しない。
================================================== */

function syncKey(uid){
  return 'enabled:'+uid;
}

function updateAccountUI(){
  $('account').textContent = cloudUser
    ? (
        cloudUser.email ||
        'Googleアカウント'
      ) +
      (
        syncEnabled
          ? ' ・ 同期有効'
          : ''
      )
    : 'ログインしていません';

  $('login').classList.toggle(
    'hide',
    !!cloudUser
  );

  $('logout').classList.toggle(
    'hide',
    !cloudUser
  );

  $('startSync').classList.toggle(
    'hide',
    !cloudUser || syncEnabled
  );
}

function scheduleSync(){
  if(
    !syncEnabled ||
    !cloudUser
  ){
    return;
  }

  clearTimeout(syncTimer);

  syncTimer = setTimeout(()=>{
    if(
      !document.hidden &&
      navigator.onLine
    ){
      syncNow();
    }
  },1500);
}

function startInterval(){
  clearInterval(syncInterval);

  syncInterval = setInterval(()=>{
    if(
      syncEnabled &&
      cloudUser &&
      !document.hidden &&
      navigator.onLine
    ){
      syncNow();
    }
  },15000);
}

async function loadFirebase(){
  const base =
    'https://www.gstatic.com/firebasejs/13.3.0/';

  const [appMod,authMod,dbMod] =
    await Promise.all([
      import(base+'firebase-app.js'),
      import(base+'firebase-auth.js'),
      import(base+'firebase-firestore.js')
    ]);

  const app = appMod.initializeApp(
    firebaseConfig
  );

  auth = authMod.getAuth(app);
  firestore = dbMod.getFirestore(app);

  firebase = {
    authMod,
    dbMod
  };

  authMod.onAuthStateChanged(
    auth,
    async user=>{
      const generation =
        ++accountGeneration;

      clearTimeout(syncTimer);
      clearInterval(syncInterval);

      cloudUser = user;
      syncEnabled = false;
      syncError = '';

      if(user){
        try{
          syncEnabled =
            (
              await metaGet(
                syncKey(user.uid)
              )
            ) === true;
        }catch(e){
          console.error(e);
        }
      }

      if(
        generation !==
        accountGeneration
      ){
        return;
      }

      updateAccountUI();

      if(
        syncEnabled &&
        user
      ){
        startInterval();
        syncNow();
      }
    },
    e=>{
      $('account').textContent =
        '認証エラー';

      console.error(e);
    }
  );
}

async function login(){
  if(!firebase){
    await dialog(
      '準備中',
      'クラウド機能を読み込んでいます。'
    );
    return;
  }

  try{
    const provider =
      new firebase.authMod.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:'select_account'
    });

    await firebase.authMod.signInWithPopup(
      auth,
      provider
    );
  }catch(e){
    await dialog(
      'ログインエラー',
      String(
        e.code ||
        e.message ||
        e
      )
    );
  }
}

async function logout(){
  if(!cloudUser) return;

  const choice = await dialog(
    'ログアウトしますか？',
    '端末内のメモは残ります。',
    ['キャンセル','ログアウト']
  );

  if(choice !== 1) return;

  try{
    await firebase.authMod.signOut(
      auth
    );
  }catch(e){
    await dialog(
      'ログアウトエラー',
      String(e.message || e)
    );
  }
}

async function startSync(){
  if(
    !cloudUser ||
    syncEnabled
  ){
    return;
  }

  const user = cloudUser;

  const choice = await dialog(
    '初回同期を開始しますか？',
    '端末とクラウドを更新日時で統合します。先にJSONバックアップを保存してください。',
    ['キャンセル','同期を開始']
  );

  if(
    choice !== 1 ||
    cloudUser?.uid !== user.uid
  ){
    return;
  }

  try{
    saveEditor();
    await waitForSaves();

    await metaPut(
      syncKey(user.uid),
      true
    );

    syncEnabled = true;

    updateAccountUI();
    startInterval();

    await syncNow();

    if(syncError){
      throw Error(syncError);
    }
  }catch(e){
    syncEnabled = false;

    clearInterval(syncInterval);

    await metaPut(
      syncKey(user.uid),
      false
    ).catch(console.error);

    updateAccountUI();

    await dialog(
      '同期開始エラー',
      String(e.message || e)
    );
  }
}

function sameRecord(a,b){
  return JSON.stringify(
    normalizeNote(a)
  ) === JSON.stringify(
    normalizeNote(b)
  );
}

function accountValid(uid,generation){
  return (
    generation === accountGeneration &&
    cloudUser?.uid === uid &&
    syncEnabled
  );
}

async function syncNow(){
  if(
    !syncEnabled ||
    !cloudUser ||
    !firebase ||
    !navigator.onLine
  ){
    return;
  }

  if(syncing){
    syncAgain = true;
    return syncPromise;
  }

  syncing = true;
  syncError = '';

  const uid = cloudUser.uid;
  const generation = accountGeneration;

  syncPromise = (async()=>{
    try{
      saveEditor();
      await waitForSaves();

      $('status').textContent = '同期中';

      const {dbMod} = firebase;

      const collection =
        dbMod.collection(
          firestore,
          'users',
          uid,
          'notes'
        );

      const snap =
        await dbMod.getDocs(
          collection
        );

      if(
        !accountValid(
          uid,
          generation
        )
      ){
        return;
      }

      const remote = new Map();

      snap.forEach(d=>{
        remote.set(
          d.id,
          normalizeNote(
            d.data(),
            d.id
          )
        );
      });

      const before = new Map(
        (await dbGetAll()).map(
          n=>[
            n.id,
            normalizeNote(n)
          ]
        )
      );

      const downloads = [];
      const uploads = [];

      /*
       * クラウド側が新しいものを取得する。
       */
      for(const [id,r] of remote){
        const l = before.get(id);

        if(
          !l ||
          timestamp(r.updatedAt) >
            timestamp(l.updatedAt)
        ){
          downloads.push(r);
        }
      }

      /*
       * 端末側が新しいものを送信する。
       */
      for(const [id,l] of before){
        const r = remote.get(id);

        if(
          !r ||
          timestamp(l.updatedAt) >
            timestamp(r.updatedAt)
        ){
          uploads.push(l);
        }
      }

      await waitForSaves();

      if(
        !accountValid(
          uid,
          generation
        )
      ){
        return;
      }

      const latest = new Map(
        (await dbGetAll()).map(
          n=>[
            n.id,
            normalizeNote(n)
          ]
        )
      );

      const safeDownloads =
        downloads.filter(r=>{
          const previous =
            before.get(r.id);

          const now =
            latest.get(r.id);

          if(
            r.id === selected &&
            isEditableTarget(
              document.activeElement
            )
          ){
            return false;
          }

          if(!previous){
            return !now;
          }

          if(
            !now ||
            !sameRecord(
              now,
              previous
            )
          ){
            return false;
          }

          return timestamp(
            r.updatedAt
          ) > timestamp(
            now.updatedAt
          );
        });

      if(safeDownloads.length){
        await enqueue(
          ()=>dbPutMany(
            safeDownloads
          )
        );

        const byId = new Map(
          notes.map(
            n=>[n.id,n]
          )
        );

        for(const r of safeDownloads){
          byId.set(
            r.id,
            r
          );
        }

        notes = [
          ...byId.values()
        ];

        if(
          selected &&
          !current()
        ){
          selected = null;
          updateEditor();
          showScreen('list');
        }else if(
          safeDownloads.some(
            n=>n.id === selected
          )
        ){
          if(
            isEditableTarget(
              document.activeElement
            )
          ){
            syncAgain = true;
          }else{
            updateEditor();
          }
        }

        render();
      }

      /*
       * 同期中に変更されたメモについては、
       * その同期で古い内容を送信しない。
       */
      for(const candidate of uploads){
        if(
          !accountValid(
            uid,
            generation
          )
        ){
          return;
        }

        await waitForSaves();

        const now = (
          await dbGetAll()
        ).find(
          n=>n.id === candidate.id
        );

        if(!now){
          continue;
        }

        if(
          !sameRecord(
            now,
            candidate
          )
        ){
          syncAgain = true;
          continue;
        }

        const r = remote.get(
          candidate.id
        );

        if(
          r &&
          timestamp(
            r.updatedAt
          ) >= timestamp(
            now.updatedAt
          )
        ){
          continue;
        }

        await dbMod.setDoc(
          dbMod.doc(
            collection,
            candidate.id
          ),
          normalizeNote(now)
        );
      }

      lastSync = Date.now();
      syncError = '';

      $('status').textContent =
        '保存済み・同期済み';

    }catch(e){
      console.error(
        'SUGU sync:',
        e
      );

      syncError = String(
        e.code ||
        e.message ||
        e
      );

      $('status').textContent =
        '端末保存済み・同期失敗';

    }finally{
      syncing = false;
    }
  })();

  await syncPromise;

  if(syncAgain){
    syncAgain = false;
    scheduleSync();
  }
}

async function manualRefresh(){
  if(
    manualRefreshing ||
    modalOpen
  ){
    return;
  }

  manualRefreshing = true;

  const button = $('refresh');
  const scroll = $('list').scrollTop;

  button.disabled = true;
  button.classList.add('refreshing');
  button.title = '更新中…';

  $('status').textContent =
    '更新中…';

  try{
    saveEditor();
    await waitForSaves();

    if(
      syncEnabled &&
      cloudUser
    ){
      if(!navigator.onLine){
        throw Error(
          'オフラインです'
        );
      }

      await syncNow();

      if(syncError){
        throw Error(syncError);
      }
    }

    await waitForSaves();

    const fromDisk =
      await dbGetAll();

    if(
      !isEditableTarget(
        document.activeElement
      )
    ){
      notes = fromDisk;

      if(
        selected &&
        !current()
      ){
        selected = null;
      }

      updateEditor();

    }else{
      const byId = new Map(
        fromDisk.map(
          n=>[n.id,n]
        )
      );

      const active = current();

      if(active){
        byId.set(
          active.id,
          active
        );
      }

      notes = [
        ...byId.values()
      ];
    }

    render();

    $('list').scrollTop = scroll;

    $('status').textContent =
      syncEnabled && cloudUser
        ? '保存済み・同期済み'
        : '保存済み';

    toast(
      'メモを更新しました'
    );

  }catch(e){
    $('status').textContent =
      '更新できませんでした';

    toast(
      String(e.message || e)
    );

  }finally{
    manualRefreshing = false;

    button.disabled = false;
    button.classList.remove(
      'refreshing'
    );

    button.title =
      'メモを更新';
  }
}

async function syncMenu(){
  if(!cloudUser){
    await login();
    return;
  }

  if(!syncEnabled){
    await startSync();
    return;
  }

  const choice = await dialog(
    'SUGU クラウド同期',
    `アカウント：${cloudUser.email || ''}\n`+
    `状態：${syncError || '同期有効'}`,
    [
      '閉じる',
      '今すぐ同期',
      'ログアウト'
    ]
  );

  if(choice === 1){
    await manualRefresh();
  }

  if(choice === 2){
    await logout();
  }
}

/* ==================================================
   設定
================================================== */

function updateFilterUI(){
  document.querySelectorAll(
    '.chip'
  ).forEach(b=>{
    b.classList.toggle(
      'active',
      b.dataset.filter === filter
    );
  });

  render();
}

function applySettings(){
  const pairs = [
    ['ear','favorites'],
    ['pin','pin'],
    ['copy','copy'],
    ['mode','checklist'],
    ['modeHint','checklist'],
    ['paste','paste'],
    ['stats','stats'],
    ['sort','sort'],
    ['syncMenu','syncControls']
  ];

  for(const [id,key] of pairs){
    $(id).classList.toggle(
      'hide',
      !settings[key]
    );
  }

  document.querySelector(
    '.syncbar'
  ).classList.toggle(
    'hide',
    !settings.syncControls
  );

  document.querySelector(
    '[data-filter="ear"]'
  ).classList.toggle(
    'hide',
    !settings.favorites
  );

  document.querySelector(
    '[data-filter="trash"]'
  ).classList.toggle(
    'hide',
    !settings.trash
  );

  if(
    (
      filter === 'ear' &&
      !settings.favorites
    ) ||
    (
      filter === 'trash' &&
      !settings.trash
    )
  ){
    filter = 'all';
  }

  updateFilterUI();
  updateLinks();
}

function openSettings(){
  if(modalOpen) return;

  modalOpen = true;

  const host = $('dialogs');
  host.replaceChildren();

  const overlay =
    document.createElement('div');

  const box =
    document.createElement('div');

  const h =
    document.createElement('h2');

  const tabs =
    document.createElement('div');

  const list =
    document.createElement('div');

  const note =
    document.createElement('div');

  const actions =
    document.createElement('div');

  const review =
    document.createElement('button');

  const close =
    document.createElement('button');

  overlay.className = 'overlay';
  box.className = 'modal';

  h.textContent = 'SUGU の設定';

  tabs.className = 'settings-tabs';
  list.className = 'settings-list';
  note.className = 'settings-note';

  note.textContent =
    '設定はこの端末に保存されます。メモは削除されません。';

  actions.className = 'actions';

  review.className = 'action';

  review.textContent =
    `競合コピーを確認（${conflictCandidates().length}件）`;

  close.className = 'action primary';
  close.textContent = '閉じる';

  function finish(){
    modalOpen = false;
    host.replaceChildren();

    document.removeEventListener(
      'keydown',
      keys,
      true
    );
  }

  function keys(e){
    if(e.key === 'Escape'){
      e.preventDefault();
      e.stopPropagation();
      finish();
    }
  }

  close.onclick = finish;

  review.onclick = ()=>{
    finish();
    reviewConflicts();
  };

  actions.append(
    review,
    close
  );

  function draw(){
    tabs.replaceChildren();
    list.replaceChildren();

    for(const group of SETTING_GROUPS){
      const b =
        document.createElement('button');

      b.className =
        'settings-tab'+
        (
          settingsTab === group.id
            ? ' active'
            : ''
        );

      b.textContent =
        group.name;

      b.onclick = ()=>{
        settingsTab =
          group.id;

        draw();
      };

      tabs.append(b);
    }

    const group = SETTING_GROUPS.find(
      g=>g.id === settingsTab
    );

    for(
      const [key,name,desc]
      of group.items
    ){
      const row =
        document.createElement('div');

      const info =
        document.createElement('div');

      const title =
        document.createElement('span');

      const description =
        document.createElement('span');

      const toggle =
        document.createElement('button');

      row.className = 'setting-row';
      info.className = 'setting-info';

      title.className = 'setting-name';
      title.textContent = name;

      description.className =
        'setting-desc';

      description.textContent = desc;

      info.append(
        title,
        description
      );

      toggle.className =
        'switch'+
        (
          settings[key]
            ? ' on'
            : ''
        );

      toggle.setAttribute(
        'role',
        'switch'
      );

      toggle.setAttribute(
        'aria-checked',
        String(settings[key])
      );

      toggle.setAttribute(
        'aria-label',
        name
      );

      toggle.onclick = ()=>{
        settings[key] =
          !settings[key];

        saveSettings();
        applySettings();
        draw();
      };

      row.append(
        info,
        toggle
      );

      list.append(row);
    }
  }

  box.append(
    h,
    tabs,
    list,
    note,
    actions
  );

  overlay.append(box);
  host.append(overlay);

  document.addEventListener(
    'keydown',
    keys,
    true
  );

  draw();
}

/* ==================================================
   起動・操作イベント
================================================== */

function isEditableTarget(target){
  return (
    target instanceof Element &&
    !!target.closest(
      'input,textarea,select,'+
      '[contenteditable="true"],'+
      '[role="textbox"]'
    )
  );
}

async function receivePendingShare(){
  const id = await metaGet(
    'sugu-pending-share'
  ).catch(()=>null);

  if(!id){
    return false;
  }

  await waitForSaves();

  notes = await dbGetAll();

  const n = notes.find(x=>
    x.id === id &&
    !x.deleted
  );

  if(n){
    choose(n.id,false);
    scheduleSync();
  }

  await metaPut(
    'sugu-pending-share',
    null
  ).catch(console.error);

  return !!n;
}

async function init(){
  try{
    db = await openDB();

    notes = await dbGetAll();

    loadSettings();

    ghostDismissedDay =
      localGet(
        'sugu-ghost-dismiss'
      ) || '';

    sortMode =
      localGet(
        'sugu-sort'
      ) || 'updated';

    if(
      ![
        'updated',
        'created',
        'title'
      ].includes(sortMode)
    ){
      sortMode = 'updated';
    }

    $('sort').value = sortMode;

    const last =
      localGet('mimi-last-id');

    selected =
      last &&
      notes.some(n=>
        n.id === last &&
        !n.deleted
      )
        ? last
        : null;

    updateEditor();
    applySettings();

    const previous =
      localGet('sugu-screen') ||
      'list';

    history.replaceState(
      {sugu:'list'},
      '',
      location.href
    );

    showScreen('list');

    if(
      previous === 'edit' &&
      current()
    ){
      openEditorScreen();
    }

    $('status').textContent =
      '保存済み';

    if(
      new URL(location.href)
        .searchParams
        .has('shared')
    ){
      await receivePendingShare();

      const url =
        new URL(location.href);

      url.searchParams.delete(
        'shared'
      );

      history.replaceState(
        history.state,
        '',
        url.pathname+
        url.search+
        url.hash
      );
    }

  }catch(e){
    await dialog(
      '起動エラー',
      '保存領域を開けませんでした。\n'+
      String(e.message || e)
    );

    return;
  }

  $('title').addEventListener(
    'input',
    saveEditor
  );

  $('body').addEventListener(
    'input',
    saveEditor
  );

  /*
   * 入力が終わったタイミングで
   * 一覧の並び順を最新状態にする。
   */
  $('body').addEventListener(
    'blur',
    ()=>{
      updateLinks();

      if(listDirty){
        render();
      }
    }
  );

  $('title').addEventListener(
    'blur',
    ()=>{
      if(listDirty){
        render();
      }
    }
  );

  $('new').onclick =
    ()=>create();

  $('sideNew').onclick =
    ()=>create();

  $('refresh').onclick =
    manualRefresh;

  $('settings').onclick =
    openSettings;

  $('paste').onclick =
    pasteNew;

  $('stats').onclick =
    showStats;

  $('copy').onclick =
    copyBody;

  $('mode').onclick =
    toggleChecklist;

  $('pin').onclick = ()=>{
    if(selected){
      toggleField(
        selected,
        'pinned'
      );
    }
  };

  $('ear').onclick = ()=>{
    if(selected){
      toggleField(
        selected,
        'ear'
      );
    }
  };

  $('remove').onclick =
    ()=>remove();

  $('openList').onclick =
    goList;

  $('closeList').onclick = ()=>{
    showScreen('edit');
  };

  $('list').onclick = e=>{
    if(e.target.closest('button')){
      return;
    }

    const item =
      e.target.closest('.item');

    if(!item?.dataset.id){
      return;
    }

    if(filter === 'trash'){
      restoreNote(
        item.dataset.id
      );
    }else{
      choose(
        item.dataset.id,
        false
      );
    }
  };

  $('list').onkeydown = e=>{
    const item =
      e.target.closest('.item');

    if(
      item &&
      e.key === 'Enter' &&
      !e.target.closest('button')
    ){
      e.preventDefault();

      if(filter === 'trash'){
        restoreNote(
          item.dataset.id
        );
      }else{
        choose(
          item.dataset.id,
          false
        );
      }
    }
  };

  $('list').addEventListener(
    'scroll',
    ()=>{
      lastListScroll =
        $('list').scrollTop;

      scheduleListCheck();
    },
    {passive:true}
  );

  window.addEventListener(
    'resize',
    scheduleListCheck,
    {passive:true}
  );

  $('search').oninput = ()=>{
    clearTimeout(searchTimer);

    searchTimer = setTimeout(()=>{
      $('list').scrollTop = 0;
      lastListScroll = 0;
      renderedCount = 0;

      render();
    },100);
  };

  $('sort').onchange = e=>{
    sortMode = e.target.value;

    localSet(
      'sugu-sort',
      sortMode
    );

    $('list').scrollTop = 0;
    lastListScroll = 0;
    renderedCount = 0;

    render();
  };

  document.querySelectorAll(
    '.chip'
  ).forEach(b=>{
    b.onclick = ()=>{
      filter =
        b.dataset.filter;

      $('list').scrollTop = 0;
      lastListScroll = 0;
      renderedCount = 0;

      updateFilterUI();
    };
  });

  $('toastUndo').onclick = async()=>{
    if(!undoInfo){
      return;
    }

    const id =
      undoInfo.id;

    undoInfo = null;

    $('toast').classList.add(
      'hide'
    );

    await restoreNote(id);
  };

  $('export').onclick =
    exportJSON;

  $('import').onclick = ()=>{
    $('file').click();
  };

  $('file').onchange = async e=>{
    await importJSON(
      e.target.files[0]
    );

    e.target.value = '';
  };

  $('login').onclick =
    login;

  $('logout').onclick =
    logout;

  $('startSync').onclick =
    startSync;

  $('syncMenu').onclick =
    syncMenu;

  document.addEventListener(
    'keydown',
    e=>{
      if(modalOpen){
        return;
      }

      if(
        e.ctrlKey &&
        e.key.toLowerCase() === 'n'
      ){
        e.preventDefault();
        create();
        return;
      }

      if(
        e.key === 'Delete' &&
        !e.repeat &&
        !e.isComposing &&
        !e.ctrlKey &&
        !e.altKey &&
        !e.metaKey &&
        !isEditableTarget(
          e.target
        ) &&
        settings.deleteKey &&
        !matchMedia(
          '(max-width:700px)'
        ).matches &&
        filter !== 'trash'
      ){
        const target =
          e.target.closest?.('.item');

        if(target?.dataset.id){
          e.preventDefault();

          remove(
            target.dataset.id
          );
        }
      }

      if(e.key === 'Escape'){
        goList();
      }
    }
  );

  window.addEventListener(
    'popstate',
    e=>{
      if(
        e.state?.sugu === 'edit' &&
        current()
      ){
        showScreen('edit');
      }else{
        showScreen('list');
      }
    }
  );

  document.addEventListener(
    'visibilitychange',
    ()=>{
      if(document.hidden){
        saveEditor();
      }else{
        scheduleListCheck();

        if(syncEnabled){
          syncNow();
        }
      }
    }
  );

  window.addEventListener(
    'online',
    ()=>{
      if(syncEnabled){
        syncNow();
      }
    }
  );

  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener(
      'message',
      async e=>{
        if(
          e.data?.type !==
          'SUGU_SHARED'
        ){
          return;
        }

        await waitForSaves();

        notes = await dbGetAll();

        const n = notes.find(x=>
          x.id === e.data.id &&
          !x.deleted
        );

        if(n){
          choose(
            n.id,
            false
          );

          scheduleSync();
        }

        render();
      }
    );
  }

  if(
    'serviceWorker' in navigator &&
    location.protocol === 'https:'
  ){
    navigator.serviceWorker
      .register('./sw.js')
      .catch(console.warn);
  }

  /*
   * 端末内の表示を優先し、
   * Firebaseは後から初期化する。
   */
  loadFirebase().catch(e=>{
    console.error(
      'Firebase initialization:',
      e
    );

    $('account').textContent =
      'クラウド接続不可';
  });
}

init();

</script>
