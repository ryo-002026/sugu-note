    const chosen=multiIds.has(item.dataset.id);
    item.classList.toggle('multi-selected',chosen);
    item.classList.toggle('multi-mode',multiMode);

function enterMultiMode(id=null){

async function bulkDelete(){
  if(!multiMode||!multiIds.size||modalOpen)return;
  const target=notes.filter(n=>multiIds.has(n.id)&&!n.deleted);
  if(!target.length){endMultiMode();return;}
  const choice=await dialog('まとめてゴミ箱へ移動しますか？',
    `${target.length}件のメモをゴミ箱へ移動します。\nゴミ箱から個別に復元できます。`,
    ['キャンセル','まとめてゴミ箱へ'],{danger:true,focusConfirm:false,enterIndex:0});
  if(choice!==1)return;
  try{
    saveEditor();
    await waitForSaves();
    // 全メモを一つのIndexedDBトランザクションで安全に保存。
    const deletedAt=iso();
    const updated=target.map(n=>({...n,deleted:true,deletedAt,updatedAt:deletedAt}));
    await enqueue(()=>dbPutMany(updated));
    const byId=new Map(updated.map(n=>[n.id,n]));
    notes=notes.map(n=>byId.get(n.id)||n);
    if(selected&&byId.has(selected)){selected=null;updateEditor();}
    endMultiMode();
    scheduleSync();
    toast(`${updated.length}件をゴミ箱へ移動しました`);
  }catch(e){await dialog('一括削除エラー',String(e.message||e));}
}

async function importJSON(file){if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='mimi-sync-v1'||!Array.isArray(data.notes))throw Error('対応していないJSON形式です');const incoming=new Map();for(const raw of data.notes){if(!raw||typeof raw.id!=='string'||!raw.id)continue;incoming.set(raw.id,normalizeNote(raw))}const known=new Set(notes.map(n=>n.id)),add=[...incoming.values()].filter(n=>!known.has(n.id));const choice=await dialog('バックアップを取り込みますか？',`ファイル内：${incoming.size}件\n新規追加：${add.length}件\n既存IDは上書きしません。ゴミ箱の状態も保持します。`,['キャンセル','取り込む']);if(choice!==1)return;saveEditor();await waitForSaves();await enqueue(()=>dbPutMany(add));notes=await dbGetAll();render();scheduleSync();await dialog('取り込み完了',`${add.length}件追加しました。`)}catch(e){await dialog('取り込みエラー',String(e.message||e))}}
/* 既存の競合コピーを調べるだけ。自動作成・自動削除しない。 */

function sameContent(a,b){return a.body===b.body&&a.checklist===b.checklist&&JSON.stringify(a.checks||[])===JSON.stringify(b.checks||[])}
async function reviewConflicts(){if(modalOpen)return;saveEditor();try{await waitForSaves()}catch(e){await dialog('確認できません',String(e.message||e));return}const copies=conflictCandidates();if(!copies.length){await dialog('競合コピー整理','現在、【競合コピー】という名前のメモはありません。');return}modalOpen=true;const host=$('dialogs');host.replaceChildren();const overlay=document.createElement('div'),box=document.createElement('div'),h=document.createElement('h2'),intro=document.createElement('p'),scroll=document.createElement('div'),actions=document.createElement('div'),close=document.createElement('button');overlay.className='overlay';box.className='modal';h.textContent=`競合コピー整理（${copies.length}件）`;intro.textContent='自動では削除しません。本文が同じ候補でも、必ず中身を確認してください。';scroll.className='review-scroll';actions.className='actions';close.className='action primary';close.textContent='閉じる';function finish(){modalOpen=false;host.replaceChildren();document.removeEventListener('keydown',keys,true);render()}function keys(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();finish()}}close.onclick=finish;for(const n of copies){const bare=n.title.replace(/^【競合コピー】/,'');const matches=notes.filter(x=>x.id!==n.id&&!x.deleted&&!x.title.startsWith('【競合コピー】')&&(x.title===bare||label(x)===bare));const identical=matches.filter(x=>sameContent(n,x));const row=document.createElement('div'),name=document.createElement('strong'),desc=document.createElement('p'),buttons=document.createElement('div'),view=document.createElement('button'),trash=document.createElement('button');row.className='review-item';name.textContent=label(n);desc.textContent=identical.length?`本文・チェック状態が一致する元メモ候補：${identical.length}件`:(matches.length?`同名候補：${matches.length}件。ただし本文は異なります。`:'元メモ候補は見つかりません。内容を保護してください。');buttons.className='actions';view.className='action';view.textContent='内容を見る';view.onclick=()=>{finish();selected=n.id;updateEditor();openEditorScreen();scheduleListRefresh();toast('コピーを開きました。内容を確認してください。')};trash.className='action';trash.textCon async function loadFirebase(){const base='https://www.gstatic.com/firebasejs/13.3.0/';const [appMod,authMod,dbMod]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);const app=appMod.initializeApp(firebaseConfig);auth=authMod.getAuth(app);firestore=dbMod.getFirestore(app);firebase={authMod,dbMod};authMod.onAuthStateChanged(auth,async user=>{const generation=++accountGeneration;clearTimeout(syncTimer);clearInterval(syncInterval);cloudUser=user;syncEnabled=false;syncError='';if(user){try{syncEnabled=(await metaGet(syncKey(user.uid)))===true}catch(e){console.error(e)}}if(generation!==accountGeneration)return;updateAccountUI();if(syncEnabled&&user){startInterval();syncNow()}},e=>{$('account').textContent='認証エラー';console.error(e)})}

async function logout(){if(!cloudUser)return;const choice=await dialog('ログアウトしますか？','端末内のメモは残ります。',['キャンセル','ログアウト']);if(choice!==1)return;try{await firebase.authMod.signOut(auth)}catch(e){await dialog('ログアウトエラー',String(e.message||e))}}
async function startSync(){if(!cloudUser||syncEnabled)return;const user=cloudUser,choice=await dialog('初回同期を開始しますか？','端末とクラウドを更新日時で統合します。先にJSONバックアップを保存してください。',['キャンセル','同期を開始']);if(choice!==1||cloudUser?.uid!==user.uid)return;try{saveEditor();await waitForSaves();await metaPut(syncKey(user.uid),true);syncEnabled=true;updateAccountUI();startInterval();await syncNow();if(syncError)throw Error(syncError)}catch(e){syncEnabled=false;clearInterval(syncInterval);await metaPut(syncKey(user.uid),false).catch(console.error);updateAccountUI();await dialog('同期開始エラー',String(e.message||e))}}
function sameRecord(a,b){return JSON.stringify(normalizeNote(a))===JSON.stringify(normalizeNote(b))}
function accountValid(uid,generation){return generation===accountGeneration&&cloudUser?.uid===uid&&syncEnabled}
async function syncNow(){if(!syncEnabled||!cloudUser||!firebase||!navigator.onLine)return;if(syncing){syncAgain=true;return syncPromise}syncing=true;syncError='';const uid=cloudUser.uid,generation=accountGeneration;syncPromise=(async()=>{try{saveEditor();await waitForSaves();$('status').textContent='同期中';const {dbMod}=firebase,collection=dbMod.collection(firestore,'users',uid,'notes'),snap=await dbMod.getDocs(collection);if(!accountValid(uid,generation))return;const remote=new Map();snap.forEach(d=>remote.set(d.id,normalizeNote(d.data(),d.id)));const before=new Map((await dbGetAll()).map(n=>[n.id,normalizeNote(n)]));const downloads=[],uploads=[];for(const [id,r] of remote){const l=before.get(id);if(!l||timestamp(r.updatedAt)>timestamp(l.updatedAt))downloads.push(r)}for(const [id,l] of before){const r=remote.get(id);if(!r||timestamp(l.updatedAt)>timestamp(r.updatedAt))uploads.push(l)}await waitForSaves();if(!accountValid(uid,generation))return;const latest=new Map((await dbGetAll()).map(n=>[n.id,normalizeNote(n)]));const safeDownloads=downloads.filter(r=>{const previous=before.get(r.id),now=latest.get(r.id);if(r.id===selected&&isEditableTarget(document.activeElement))return false;if(!previous)return !now;if(!now||!sameRecord(now,previous))return false;return timestamp(r.updatedAt)>timestamp(now.updatedAt)});if(safeDownloads.length){await enqueue(()=>dbPutMany(safeDownloads));const byId=new Map(notes.map(n=>[n.id,n]));for(const r of safeDownloads)byId.set(r.id,r);notes=[...byId.values()];if(selected&&!current()){selected=null;updateEditor();showScreen('list')}else if(safeDownloads.some(n=>n.id===selected)){if(isEditableTarget(document.activeElement)){/* 表示中の入力を守るため次回再確認 */syncAgain=true}else updateEditor()}render()}
/* アップロード直前にもう一度ローカルを調べる。途中の編集なら次の同期へ。 */
for(const candidate of uploads){if(!accountValid(uid,generation))return;await waitForSaves();const now=(await dbGetAll()).find(n=>n.id===candidate.id);if(!now)continue;if(!sameRecord(now,candidate)){syncAgain=true;continue}const r=remote.get(candidate.id);if(r&&timestamp(r.updatedAt)>=timestamp(now.updatedAt))continue;await dbMod.setDoc(dbMod.doc(collection,candidate.id),normalizeNote(now))}
lastSync=Date.now();syncError='';$('status').textContent='保存済み・同期済み'}catch(e){console.error('SUGU sync:',e);syncError=String(e.code||e.message||e);$('status').textContent='端末保存済み・同期失敗'}finally{syncing=false}})();await syncPromise;if(syncAgain){syncAgain=false;scheduleSync()}}
async function manualRefresh(){if(manualRefreshing||modalOpen)return;manualRefreshing=true;const button=$('refresh'),scroll=$('list').scrollTop;button.disabled=true;button.classList.add('refreshing');button.title='更新中…';$('status').textContent='更新中…';try{saveEditor();await waitForSaves();if(syncEnabled&&cloudUser){if(!navigator.onLine)throw Error('オフラインです');await syncNow();if(syncError)throw Error(syncError)}await waitForSaves();const fromDisk=await dbGetAll();if(!isEditableTarget(document.activeElement)){notes=fromDisk;if(selected&&!current())selected=null;updateEditor()}else{const byId=new Map(fromDisk.map(n=>[n.id,n]));const active=current();if(active)byId.set(active.id,active);notes=[...byId.values()]}render();$('list').scrollTop=scroll;$('status').textContent=syncEnabled&&cloudUser?'保存済み・同期済み':'保存済み';toast('メモを更新しました')}catch(e){$('status').textContent='更新できませんでした';toast(String(e.message||e))}finally{manualRefreshing=false;button.disabled=false;button.classList.remove('refreshing');button.title='メモを更新'}}
async function syncMenu(){if(!cloudUser){await login();return}if(!syncEnabled){await startSync();return}const choice=await dialog('SUGU クラウド同期',`アカウント：${cloudUser.email||''}\n状態：${syncError||'同期有効'}`,['閉じる','今すぐ同期','ログアウト']);if(choice===1)await manualRefresh();if(choice===2)await logout()}

function openSettings(){if(modalOpen)return;modalOpen=true;const host=$('dialogs');host.replaceChildren();const overlay=document.createElement('div'),box=document.createElement('div'),h=document.createElement('h2'),tabs=document.createElement('div'),list=document.createElement('div'),note=document.createElement('div'),actions=document.createElement('div'),review=document.createElement('button'),close=document.createElement('button');overlay.className='overlay';box.className='modal';h.textContent='SUGU の設定';tabs.className='settings-tabs';list.className='settings-list';note.className='settings-note';note.textContent='設定はこの端末に保存されます。メモは削除されません。';actions.className='actions';review.className='action';review.textContent=`競合コピーを確認（${conflictCandidates().length}件）`;close.className='action primary';close.textContent='閉じる';function finish(){modalOpen=false;host.replaceChildren();document.removeEventListener('keydown',keys,true)}function keys(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();finish()}}close.onclick=finish;review.onclick=()=>{finish();reviewConflicts()};actions.append(review,close);function draw(){tabs.replaceChildren();list.replaceChildren();for(const group of SETTING_GROUPS){const b=document.createElement('button');b.className='settings-tab'+(settingsTab===group.id?' active':'');b.textContent=group.name;b.onclick=()=>{settingsTab=group.id;draw()};tabs.append(b)}const group=SETTING_GROUPS.find(g=>g.id===settingsTab);for(const [key,name,desc] of group.items){const row=document.createElement('div'),info=document.createElement('div'),title=document.createElement('span'),description=document.createElement('span'),toggle=document.createElement('button');row.className='setting-row';info.className='setting-info';title.className='setting-name';title.textContent=name;description.className='setting-desc';description.textContent=desc;info.append(title,description);toggle.className='switch'+(settings[key]?' on':'');toggle.setAttribute('role','switch');toggle.
