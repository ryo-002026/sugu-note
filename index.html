<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f9f6">
<meta name="description" content="SUGU | 思いついたら、すぐ書ける。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>SUGU</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  color:#26332d;background:#f8f9f6;
  --green:#27735a;--line:#e2e7e1
}
*{box-sizing:border-box}
body{margin:0}
button,input,textarea{font:inherit}
button{border:0;background:transparent;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:2px solid var(--green)
}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);height:100dvh}
.side{
  background:white;border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0
}
.toolbar{
  min-height:56px;display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-bottom:1px solid var(--line);flex-shrink:0
}
.brand{font-weight:750;flex:1;padding-left:6px}
.btn{min-width:40px;height:40px;border-radius:10px;font-size:20px}
.btn:hover{background:#e7f3ec}
.search{
  margin:12px;border:1px solid var(--line);border-radius:10px;
  padding:11px;background:#fafbf9;width:calc(100% - 24px)
}
.filters{display:flex;gap:6px;padding:0 12px 10px}
.chip{font-size:13px;padding:8px 12px;border-radius:20px;color:#66766e}
.chip.active{background:#e7f3ec;color:var(--green)}
.count{padding:0 15px 8px;color:#718077;font-size:12px}
.list{overflow:auto;flex:1;min-height:0}
.side-bottom{
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:white;flex-shrink:0
}
.create-button{
  width:100%;padding:13px;border-radius:12px;
  background:#e7f3ec;color:var(--green);
  font-weight:750;text-align:center
}
.paste-button{width:100%;padding:8px;font-size:12px;color:#66766e}
.ghost-card{background:#f1ebfa;border-left:4px solid #9473bd}
.ghost-card p{color:#725c8e}
.copy-mark{
  position:absolute;right:36px;top:13px;
  font-size:12px;color:#658775
}
.more-button{
  display:block;width:100%;padding:14px;color:var(--green)
}
.link-preview{
  padding:6px 0;font-size:13px;overflow-wrap:anywhere
}
.link-preview a{color:var(--green)}
.stats-box{white-space:pre-line;line-height:1.9}
.item{
  padding:14px 16px;border-bottom:1px solid var(--line);
  cursor:pointer;position:relative
}
.item.active{background:#e7f3ec}
.item strong{
  display:block;font-size:14px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap
}
.item p{
  font-size:12px;color:#718077;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;margin:5px 0
}
.item small{color:#85918b}
.earmark{
  position:absolute;right:10px;top:12px;color:var(--green)
}
.editor{
  display:flex;flex-direction:column;min-width:0;min-height:0
}
.status{font-size:12px;color:#728077}
.spacer{flex:1}
.edit{
  display:flex;flex-direction:column;flex:1;min-height:0;
  width:100%;max-width:920px;margin:auto;padding:20px 28px
}
#title{
  font-weight:700;font-size:22px;border:0;outline:0;
  background:none;padding:12px 0
}
#body{
  border:0;outline:0;resize:none;background:none;flex:1;
  min-height:0;line-height:1.75;font-size:16px;padding:8px 0 24px
}
.mobile{display:none}
.hide{display:none!important}
.overlay{
  position:fixed;inset:0;background:#0008;display:grid;
  place-items:center;padding:18px;z-index:30
}
.modal{
  background:white;border-radius:16px;padding:22px;
  width:min(480px,100%);max-height:90dvh;overflow:auto
}
.modal h2{font-size:18px;margin:0 0 10px}
.modal p{white-space:pre-line;line-height:1.7;font-size:14px}
.actions{
  display:flex;justify-content:flex-end;gap:10px;
  margin-top:20px;flex-wrap:wrap
}
.action{padding:10px 15px;border-radius:9px;background:#edf0ec}
.action.primary{background:var(--green);color:white}
.syncbar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:#f1f6f1;border-bottom:1px solid var(--line);
  font-size:12px;flex-wrap:wrap
}
.syncbar span{
  flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis
}
.syncbtn{
  background:white;border:1px solid #d4e2d7;border-radius:8px;
  padding:7px 10px;font-size:12px
}
.syncbtn:hover{background:#e3f1e7}
@media(max-width:700px){
  .app{display:block}
  .side{
    position:fixed;inset:0;z-index:10;
    transform:translateX(-100%);transition:transform .12s ease
  }
  .side.open{transform:translateX(0)}
  .editor{height:100dvh}
  .mobile{display:inline-block}
  .edit{padding:10px 18px}
  #title{font-size:20px}
  #body{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side" class="side">
    <header class="toolbar">
      <button id="closeList" class="btn mobile" aria-label="一覧を閉じる">‹</button>
      <div class="brand">SUGU</div>
      <button id="import" class="btn" title="バックアップを取り込む">⇩</button>
      <button id="export" class="btn" title="JSONバックアップを保存">⇧</button>
    </header>
    <div class="syncbar">
      <span id="account">ログインしていません</span>
      <button id="login" class="syncbtn">Googleログイン</button>
      <button id="logout" class="syncbtn hide">ログアウト</button>
      <button id="startSync" class="syncbtn hide">同期を開始</button>
    </div>
    <input id="search" class="search"
      placeholder="メモを検索" aria-label="メモを検索">
    <div class="filters">
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="ear">★ お気に入り</button>
    </div>
    <div id="count" class="count"></div>
    <div id="list" class="list"></div>
    <div class="side-bottom">
      <button id="sideNew" class="create-button">＋ すぐメモ</button>
      <button id="paste" class="paste-button">▣ コピーした文章からメモ</button>
      <button id="stats" class="paste-button">どうでもいい記録</button>
    </div>
  </aside>
  <main class="editor">
    <header class="toolbar">
      <button id="openList" class="btn mobile" title="メモ一覧">☰</button>
      <span id="status" class="status">読み込み中</span>
      <div class="spacer"></div>
      <button id="syncMenu" class="btn" title="Googleログイン・同期">☁</button>
      <button id="new" class="btn" title="新規メモ">＋</button>
      <button id="copy" class="btn" title="本文をコピー">▢</button>
      <button id="ear" class="btn" title="お気に入り">☆</button>
      <button id="remove" class="btn" title="メモ削除">⌫</button>
    </header>
    <div class="edit">
      <input id="title" placeholder="タイトル"
        autocomplete="off" aria-label="タイトル">
      <textarea id="body" placeholder="メモを書く…"
        aria-label="メモ本文" spellcheck="false"></textarea>
      <div id="links" class="link-preview"></div>
    </div>
  </main>
</div>
<input id="file" type="file"
  accept=".json,application/json" class="hide">
<div id="dialogs"></div>

<script type="module">
'use strict';

const $ = id => document.getElementById(id);
const DB = 'mimi-sync-db';
const TABLE = 'notes';
const META = 'syncMeta';

const firebaseConfig = {
  apiKey: "AIzaSyDPlUYQ6vzg8rBQAdt_M-i3hOm8VRkB6FE",
  authDomain: "sugu-43386.firebaseapp.com",
  databaseURL: "https://sugu-43386-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sugu-43386",
  storageBucket: "sugu-43386.firebasestorage.app",
  messagingSenderId: "1056209931526",
  appId: "1:1056209931526:web:111fca8d731e2e1a452287"
};

let db;
let notes = [];
let selected = null;
let filter = 'all';
let queue = Promise.resolve();
let failed = false;
let version = 0;
let visibleLimit = 10;
let currentList = [];
let screen = 'list';
let ghostDismissedDay = '';

const dayKey = () => new Date().toLocaleDateString('sv-SE');
const COPY_KEY = 'sugu-copied-v1';

let copied = {};

try {
  copied = JSON.parse(localStorage.getItem(COPY_KEY) || '{}');
} catch(e) {}

try {
  ghostDismissedDay =
    localStorage.getItem('sugu-ghost-dismiss') || '';
} catch(e) {}

function markCopied(n) {
  copied[n.id] = n.updatedAt;
  try {
    localStorage.setItem(COPY_KEY, JSON.stringify(copied));
  } catch(e) {}
  render();
}

function isCopied(n) {
  return copied[n.id] === n.updatedAt;
}

function setScreen(next) {
  screen = next;
  try {
    localStorage.setItem('sugu-screen', next);
  } catch(e) {}

  if (matchMedia('(max-width:700px)').matches) {
    $('side').classList.toggle('open', next === 'list');
  }
}

function updateLinks() {
  const root = $('links');
  root.replaceChildren();

  const value = $('body').value;
  const urls = [
    ...new Set(value.match(/https?:\/\/[^\s<>"']+/g) || [])
  ].slice(0,20);

  if (!urls.length) return;

  const caption = document.createElement('small');
  caption.textContent = '本文中のリンク';
  root.append(caption);

  for (const u of urls) {
    try {
      const parsed = new URL(u);
      if (!['http:','https:'].includes(parsed.protocol)) continue;

      const a = document.createElement('a');
      a.href = parsed.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = u;
      a.style.display = 'block';
      root.append(a);
    } catch(e) {}
  }
}

let firebase = null;
let auth = null;
let firestore = null;
let cloudUser = null;
let syncEnabled = false;
let syncing = false;
let syncAgain = false;
let syncTimer = null;
let syncInterval = null;
let accountGeneration = 0;
let syncError = '';

const iso = () => new Date().toISOString();

function openDB() {
  return new Promise((ok,no) => {
    const r = indexedDB.open(DB,2);

    r.onupgradeneeded = () => {
      const database = r.result;

      if (!database.objectStoreNames.contains(TABLE)) {
        database.createObjectStore(TABLE,{keyPath:'id'});
      }

      if (!database.objectStoreNames.contains(META)) {
        database.createObjectStore(META,{keyPath:'key'});
      }
    };

    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}

function getAll() {
  return new Promise((ok,no) => {
    const r = db.transaction(TABLE,'readonly')
      .objectStore(TABLE).getAll();

    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}

function getMeta(key) {
  return new Promise((ok,no) => {
    const r = db.transaction(META,'readonly')
      .objectStore(META).get(key);

    r.onsuccess = () => ok(r.result?.value);
    r.onerror = () => no(r.error);
  });
}

function setMeta(key,value) {
  return new Promise((ok,no) => {
    const tx = db.transaction(META,'readwrite');
    tx.objectStore(META).put({key,value});
    tx.oncomplete = ok;
    tx.onerror = () => no(tx.error);
  });
}

function transaction(items,removeId) {
  return new Promise((ok,no) => {
    const tx = db.transaction(TABLE,'readwrite');
    const store = tx.objectStore(TABLE);

    for (const n of items) store.put({...n});
    if (removeId) store.delete(removeId);

    tx.oncomplete = ok;
    tx.onerror = () => no(tx.error);
    tx.onabort = () => no(tx.error);
  });
}

function enqueue(job) {
  const task = queue.then(job);

  queue = task.catch(e => {
    failed = true;
    $('status').textContent = '保存失敗';
    console.error(e);
  });

  return task;
}

function dateValue(s) {
  if (typeof s === 'number') return s < 1e11 ? s*1000 : s;
  if (!s) return 0;

  const v = String(s);
  const numeric = Number(v);

  if (/^\d{10,13}$/.test(v)) {
    return numeric < 1e11 ? numeric*1000 : numeric;
  }

  const d = Date.parse(v) || Date.parse(v.replace(' ','T'));
  return Number.isFinite(d) ? d : 0;
}

function sorted() {
  return [...notes]
    .filter(n => !n.deleted)
    .sort((a,b) =>
      dateValue(b.updatedAt)-dateValue(a.updatedAt)
    );
}

function current() {
  return notes.find(n => n.id === selected && !n.deleted);
}

function label(n) {
  return n.title || n.body.split('\n').find(Boolean) || '無題';
}

function ghostCandidate(list) {
  if (ghostDismissedDay === dayKey() || !list.length) {
    return null;
  }

  const cutoff = Date.now() - 30*86400000;
  const candidates = list.filter(n =>
    dateValue(
      n.lastOpenedAt || n.createdAt || n.updatedAt
    ) < cutoff
  );

  if (!candidates.length) return null;

  const index =
    Math.floor(Date.now()/86400000) % candidates.length;

  return candidates[index];
}

function render() {
  const q = $('search').value.toLocaleLowerCase();
  const visible = sorted();

  currentList = visible.filter(n =>
    (filter === 'all' || n.ear) &&
    (n.title+'\n'+n.body).toLocaleLowerCase().includes(q)
  );

  $('count').textContent =
    `${currentList.length}件 / 全${visible.length}件`;

  const root = $('list');
  root.replaceChildren();

  const shown = currentList.slice(0,visibleLimit);
  const ghost =
    !q && filter === 'all' ? ghostCandidate(visible) : null;

  shown.forEach((n,i) => {
    if (i === 3 && ghost) {
      const card = document.createElement('div');
      card.className = 'item ghost-card';
      card.dataset.id = ghost.id;

      const title = document.createElement('strong');
      title.textContent =
        '👻 メモの亡霊：' + label(ghost);

      const subtitle = document.createElement('p');
      const days = Math.max(
        30,
        Math.floor(
          (Date.now()-dateValue(
            ghost.lastOpenedAt ||
            ghost.createdAt ||
            ghost.updatedAt
          )) / 86400000
        )
      );

      subtitle.textContent =
        `「${days}日ぶりですね。こちらはずっとここにいました。」`;

      const dismiss = document.createElement('button');
      dismiss.textContent = '×';
      dismiss.title = '今日は表示しない';
      dismiss.style.cssText =
        'position:absolute;right:10px;top:10px;font-size:18px';

      dismiss.onclick = e => {
        e.stopPropagation();
        ghostDismissedDay = dayKey();

        try {
          localStorage.setItem(
            'sugu-ghost-dismiss',
            ghostDismissedDay
          );
        } catch(err) {}

        render();
      };

      card.append(title,subtitle,dismiss);
      root.append(card);
    }

    const item = document.createElement('div');
    item.className =
      'item' + (n.id === selected ? ' active' : '');
    item.dataset.id = n.id;

    const name = document.createElement('strong');
    name.textContent = label(n);

    const preview = document.createElement('p');
    preview.textContent =
      n.body.replace(/\s+/g,' ').slice(0,120);

    const time = document.createElement('small');
    time.textContent =
      String(n.updatedAt || '').slice(0,19);

    item.append(name,preview,time);

    if (n.ear) {
      const ear = document.createElement('span');
      ear.className = 'earmark';
      ear.textContent = '★';
      item.append(ear);
    }

    if (isCopied(n)) {
      const mark = document.createElement('span');
      mark.className = 'copy-mark';
      mark.textContent = '✓';
      mark.title = 'この端末でコピー済み';
      item.append(mark);
    }

    root.append(item);
  });

  if (ghost && shown.length < 4) {
    const card = document.createElement('div');
    card.className = 'item ghost-card';
    card.dataset.id = ghost.id;
    card.textContent =
      '👻 メモの亡霊：' + label(ghost);
    root.append(card);
  }

  if (currentList.length > visibleLimit) {
    const more = document.createElement('button');
    more.className = 'more-button';
    more.textContent = 'さらに10件表示';

    more.onclick = () => {
      visibleLimit += 10;
      render();
    };

    root.append(more);
  }
}

function choose(id,focus=false) {
  const n = notes.find(x => x.id === id && !x.deleted);
  if (!n) return;

  selected = id;

  n.lastOpenedAt = iso();
  enqueue(() => transaction([{...n}])).catch(() => {});

  version++;

  try {
    localStorage.setItem('mimi-last-id',id);
  } catch(e) {}

  $('title').value = n.title;
  $('body').value = n.body;
  $('ear').textContent = n.ear ? '★' : '☆';
  $('status').textContent =
    failed ? '保存失敗' : '保存済み';

  setScreen('edit');
  updateLinks();
  render();

  if (focus) {
    requestAnimationFrame(() => $('body').focus());
  }
}

function showEmpty() {
  selected = null;
  $('title').value = '';
  $('body').value = '';
  $('ear').textContent = '☆';
  updateLinks();
  render();
}

function scheduleSync() {
  if (!syncEnabled || !cloudUser) return;

  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(),1500);
}

function save() {
  const n = current();
  if (!n) return;

  const title = $('title').value;
  const body = $('body').value;

  if (title === n.title && body === n.body) return;

  n.title = title;
  n.body = body;
  n.updatedAt = iso();

  updateLinks();

  const snapshot = {...n};
  const v = ++version;

  failed = false;
  $('status').textContent = '保存中';

  enqueue(() => transaction([snapshot]))
    .then(() => {
      if (selected === snapshot.id && version === v) {
        $('status').textContent = '保存済み';
      }
      scheduleSync();
    })
    .catch(() => {});
}

async function create(focus=true) {
  const n = {
    id:crypto.randomUUID(),
    title:'',
    body:'',
    ear:false,
    createdAt:iso(),
    updatedAt:iso(),
    lastOpenedAt:iso(),
    deleted:false
  };

  notes.push(n);

  try {
    await enqueue(() => transaction([n]));
    choose(n.id,focus);
    scheduleSync();
  } catch(e) {
    notes = notes.filter(x => x.id !== n.id);
    await dialog(
      '保存できません',
      '新規メモを保存できませんでした。'
    );
  }
}

async function toggleEar() {
  const n = current();
  if (!n) return;

  n.ear = !n.ear;
  n.updatedAt = iso();

  const snapshot = {...n};
  $('ear').textContent = n.ear ? '★' : '☆';

  try {
    await enqueue(() => transaction([snapshot]));
    render();
    scheduleSync();
  } catch(e) {
    await dialog(
      '保存エラー',
      String(e.message || e)
    );
  }
}

async function copyBody() {
  const n = current();
  if (!n) return;

  try {
    await navigator.clipboard.writeText($('body').value);
    markCopied(n);
    $('status').textContent = 'コピーしました';
  } catch(e) {
    await dialog(
      'コピーできませんでした',
      'ブラウザのクリップボード権限を確認してください。'
    );
  }
}

async function pasteNew() {
  try {
    const text = await navigator.clipboard.readText();

    if (!text) {
      return dialog(
        'クリップボードが空です',
        'コピーした文章が見つかりません。'
      );
    }

    await create(false);
    $('body').value = text;
    save();
    $('body').focus();
  } catch(e) {
    await dialog(
      '読み取れませんでした',
      'クリップボードへのアクセスが許可されていないか、このブラウザでは利用できません。'
    );
  }
}

async function showStats() {
  const all = notes.filter(n => !n.deleted);
  const sizes = all.map(n =>
    (n.title+n.body).length
  );

  const chars = sizes.reduce((a,b) => a+b,0);
  const bangs = all.reduce(
    (a,n) =>
      a+(n.title+n.body).split('！').length-1,
    0
  );

  await dialog(
    'どうでもいい記録',
    `メモ総数：${all.length}件\n`+
    `全文字数：${chars.toLocaleString()}字\n`+
    `最長メモ：${Math.max(0,...sizes)}字\n`+
    `最短メモ：${sizes.length ? Math.min(...sizes) : 0}字\n`+
    `「！」の使用回数：${bangs}回\n\n`+
    '本日のどうでもいい発見：メモの文字は、逃げずにここにいます。'
  );
}

function dialog(title,message,choices=['閉じる']) {
  return new Promise(ok => {
    const host = $('dialogs');
    host.replaceChildren();

    const overlay = document.createElement('div');
    const box = document.createElement('div');
    const h = document.createElement('h2');
    const p = document.createElement('p');
    const actions = document.createElement('div');

    overlay.className = 'overlay';
    box.className = 'modal';
    actions.className = 'actions';

    h.textContent = title;
    p.textContent = message;

    choices.forEach((choice,i) => {
      const b = document.createElement('button');
      b.className =
        'action' +
        (i === choices.length-1 ? ' primary' : '');
      b.textContent = choice;

      b.onclick = () => {
        host.replaceChildren();
        ok(i);
      };

      actions.append(b);
    });

    box.append(h,p,actions);
    overlay.append(box);
    host.append(overlay);
  });
}

async function remove() {
  const n = current();
  if (!n) return;

  if (await dialog(
    'メモを削除しますか？',
    '同期中の場合、他の端末からも削除されます。',
    ['キャンセル','削除']
  ) !== 1) return;

  await queue;

  if (failed) {
    await dialog(
      '保存エラー',
      '保存に失敗しているため、削除を中止しました。'
    );
    return;
  }

  const old = {...n};
  const tombstone = {
    ...n,
    deleted:true,
    updatedAt:iso()
  };

  try {
    await enqueue(() => transaction([tombstone]));
    Object.assign(n,tombstone);

    const remaining = sorted();

    if (remaining.length) {
      choose(remaining[0].id);
    } else {
      showEmpty();
    }

    scheduleSync();
  } catch(e) {
    Object.assign(n,old);
    await dialog(
      '削除エラー',
      String(e.message || e)
    );
  }
}

async function exportJSON() {
  save();
  await queue;

  if (failed) {
    await dialog(
      '保存エラー',
      'バックアップ前に保存状態を確認してください。'
    );
    return;
  }

  const all = (await getAll())
    .filter(n => !n.deleted);

  const blob = new Blob([
    JSON.stringify({
      format:'mimi-sync-v1',
      exportedAt:iso(),
      notes:all
    },null,2)
  ],{type:'application/json'});

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download =
    'SUGUBackup_'+iso().slice(0,10)+'.json';

  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url),10000);
}

async function importJSON(file) {
  if (!file) return;

  try {
    const data = JSON.parse(await file.text());

    if (
      data.format !== 'mimi-sync-v1' ||
      !Array.isArray(data.notes)
    ) {
      throw Error('対応していないJSONバックアップです');
    }

    const incoming = new Map();

    for (const raw of data.notes) {
      if (
        !raw ||
        typeof raw !== 'object' ||
        typeof raw.id !== 'string' ||
        !raw.id
      ) continue;

      incoming.set(raw.id,{
        id:raw.id,
        title:String(raw.title ?? ''),
        body:String(raw.body ?? ''),
        ear:!!raw.ear,
        createdAt:raw.createdAt ?? '',
        updatedAt:raw.updatedAt ?? '',
        lastOpenedAt:
          raw.lastOpenedAt ?? raw.updatedAt ?? '',
        deleted:false
      });
    }

    const known = new Set(notes.map(n => n.id));
    const add = [...incoming.values()]
      .filter(n => !known.has(n.id));

    if (await dialog(
      'バックアップを取り込みますか？',
      `ファイル内：${incoming.size}件\n`+
      `新規追加：${add.length}件\n`+
      '既存メモは上書きしません。',
      ['キャンセル','取り込む']
    ) !== 1) return;

    save();
    await queue;

    if (failed) {
      throw Error('編集中のメモを保存できません');
    }

    if (add.length) {
      await enqueue(() => transaction(add));
    }

    notes = await getAll();
    render();
    scheduleSync();

    await dialog(
      '取り込み完了',
      `${add.length}件追加しました。`
    );
  } catch(e) {
    await dialog(
      '取り込みエラー',
      String(e.message || e)
    );
  }
}

function cleanNote(raw,id) {
  return {
    id,
    title:String(raw.title ?? ''),
    body:String(raw.body ?? ''),
    ear:!!raw.ear,
    createdAt:String(raw.createdAt ?? ''),
    updatedAt:String(raw.updatedAt ?? ''),
    lastOpenedAt:String(
      raw.lastOpenedAt ?? raw.updatedAt ?? ''
    ),
    deleted:!!raw.deleted
  };
}

function syncKey(uid) {
  return 'enabled:'+uid;
}

function updateAccountUI() {
  const name = cloudUser
    ? (cloudUser.email || 'Googleアカウント')
    : 'ログインしていません';

  $('account').textContent = name;
  $('login').classList.toggle('hide',!!cloudUser);
  $('logout').classList.toggle('hide',!cloudUser);
  $('startSync').classList.toggle(
    'hide',
    !cloudUser || syncEnabled
  );

  if (cloudUser && syncEnabled) {
    $('account').textContent =
      name+' ・ 同期有効';
  }
}

async function loadFirebase() {
  const base =
    'https://www.gstatic.com/firebasejs/13.3.0/';

  const [appMod,authMod,dbMod] = await Promise.all([
    import(base+'firebase-app.js'),
    import(base+'firebase-auth.js'),
    import(base+'firebase-firestore.js')
  ]);

  const app = appMod.initializeApp(firebaseConfig);
  auth = authMod.getAuth(app);
  firestore = dbMod.getFirestore(app);

  firebase = {authMod,dbMod};

  authMod.onAuthStateChanged(auth,async user => {
    const generation = ++accountGeneration;

    clearTimeout(syncTimer);
    clearInterval(syncInterval);

    syncEnabled = false;
    cloudUser = user;
    syncError = '';

    if (user) {
      try {
        syncEnabled =
          (await getMeta(syncKey(user.uid))) === true;
      } catch(e) {
        console.error(e);
      }
    }

    if (generation !== accountGeneration) return;

    updateAccountUI();

    if (syncEnabled && user) {
      syncNow();

      syncInterval = setInterval(() => {
        if (!document.hidden && navigator.onLine) {
          syncNow();
        }
      },15000);
    }
  },error => {
    console.error(error);
    $('account').textContent = '認証エラー';
  });
}

async function login() {
  if (!firebase) {
    await dialog(
      '準備中',
      'Firebaseを読み込んでいます。少し待ってから試してください。'
    );
    return;
  }

  try {
    const provider =
      new firebase.authMod.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:'select_account'
    });

    await firebase.authMod.signInWithPopup(
      auth,
      provider
    );
  } catch(e) {
    console.error(e);

    await dialog(
      'Googleログインに失敗しました',
      String(e.code || e.message || e)+
      '\n\n学校のGoogleアカウントでは、管理者による外部アプリの制限がある場合があります。'+
      '\nAndroidでポップアップが開けない場合は、ChromeでSUGUのURLを直接開いて試してください。'
    );
  }
}

async function logout() {
  if (!auth || !cloudUser) return;

  if (await dialog(
    'ログアウトしますか？',
    '端末内のメモは残ります。共有端末ではログアウトだけではメモを隠せません。',
    ['キャンセル','ログアウト']
  ) !== 1) return;

  try {
    await firebase.authMod.signOut(auth);
  } catch(e) {
    await dialog(
      'ログアウトエラー',
      String(e.message || e)
    );
  }
}

async function startSync() {
  if (!cloudUser || syncEnabled) return;

  const user = cloudUser;

  const choice = await dialog(
    '初回同期を開始しますか？',
    `ログイン中：${user.email || 'Googleアカウント'}\n\n`+
    '端末内のメモとクラウドのメモを統合します。'+
    '\n同じIDのメモが両方にある場合、更新日時が新しい方を優先します。'+
    '\n\n先にJSONバックアップを保存してください。'+
    '\n学校の個人情報や機密情報は、許可がない場合は同期しないでください。',
    ['キャンセル','同期を開始']
  );

  if (
    choice !== 1 ||
    cloudUser?.uid !== user.uid
  ) return;

  save();
  await queue;

  if (failed) {
    await dialog(
      '同期を中止',
      '端末内への保存が失敗しています。'
    );
    return;
  }

  try {
    await setMeta(syncKey(user.uid),true);
    syncEnabled = true;
    updateAccountUI();

    syncInterval = setInterval(() => {
      if (!document.hidden && navigator.onLine) {
        syncNow();
      }
    },15000);

    await syncNow();
  } catch(e) {
    syncEnabled = false;

    await setMeta(
      syncKey(user.uid),false
    ).catch(console.error);

    updateAccountUI();

    await dialog(
      '同期開始エラー',
      String(e.message || e)
    );
  }
}

async function syncNow() {
  if (
    !syncEnabled ||
    !cloudUser ||
    !firebase ||
    !navigator.onLine
  ) return;

  if (syncing) {
    syncAgain = true;
    return;
  }

  syncing = true;

  const uid = cloudUser.uid;
  const generation = accountGeneration;
  const {dbMod} = firebase;

  const collection = dbMod.collection(
    firestore,'users',uid,'notes'
  );

  try {
    save();
    await queue;

    if (failed) {
      throw Error('端末内の保存に失敗しています');
    }

    $('status').textContent = '同期中';

    const remoteSnap =
      await dbMod.getDocs(collection);

    if (
      generation !== accountGeneration ||
      cloudUser?.uid !== uid ||
      !syncEnabled
    ) return;

    const remote = new Map();

    remoteSnap.forEach(d => {
      const value = d.data();
      remote.set(
        d.id,
        cleanNote(value,d.id)
      );
    });

    const local = new Map(
      (await getAll()).map(n => [
        n.id,
        cleanNote(n,n.id)
      ])
    );

    const download = [];
    const upload = [];

    for (const [id,r] of remote) {
      const l = local.get(id);

      if (
        !l ||
        dateValue(r.updatedAt) >
          dateValue(l.updatedAt)
      ) {
        download.push(r);
      }
    }

    for (const [id,l] of local) {
      const r = remote.get(id);

      if (
        !r ||
        dateValue(l.updatedAt) >
          dateValue(r.updatedAt)
      ) {
        upload.push(l);
      }
    }

    if (
      generation !== accountGeneration ||
      cloudUser?.uid !== uid ||
      !syncEnabled
    ) return;

    // 通信中の編集を古いデータで上書きしない。
    await queue;

    const latest = new Map(
      (await getAll()).map(n => [n.id,n])
    );

    const safeDownload = download.filter(r => {
      const currentLocal = latest.get(r.id);
      const originalLocal = local.get(r.id);

      if (!currentLocal) return true;
      if (!originalLocal) return false;

      return dateValue(currentLocal.updatedAt) <=
        dateValue(originalLocal.updatedAt);
    });

    if (safeDownload.length) {
      await enqueue(
        () => transaction(safeDownload)
      );

      notes = await getAll();

      const stillSelected = notes.find(n =>
        n.id === selected && !n.deleted
      );

      if (!stillSelected) {
        const first = sorted()[0];

        if (first) {
          choose(first.id);
        } else {
          showEmpty();
        }
      } else if (
        safeDownload.some(n => n.id === selected) &&
        document.activeElement !== $('title') &&
        document.activeElement !== $('body')
      ) {
        choose(selected);
      }

      render();
    }

    // 新しい端末側の編集をクラウドへ送信。
    for (const n of upload) {
      if (
        generation !== accountGeneration ||
        cloudUser?.uid !== uid ||
        !syncEnabled
      ) return;

      const newest = (await getAll())
        .find(x => x.id === n.id);

      if (!newest) continue;

      const latestRemote = remote.get(n.id);

      if (
        latestRemote &&
        dateValue(latestRemote.updatedAt) >=
          dateValue(newest.updatedAt)
      ) {
        continue;
      }

      await dbMod.setDoc(
        dbMod.doc(collection,n.id),
        cleanNote(newest,n.id)
      );
    }

    syncError = '';
    $('status').textContent =
      '保存済み・同期済み';
  } catch(e) {
    console.error('SUGU sync:',e);

    syncError =
      String(e.code || e.message || e);

    $('status').textContent =
      '端末保存済み・同期失敗';
  } finally {
    syncing = false;

    if (syncAgain) {
      syncAgain = false;
      scheduleSync();
    }
  }
}

async function syncMenu() {
  if (!cloudUser) {
    if (!firebase) {
      await dialog(
        'Googleログイン',
        'Firebaseの読み込みが完了していません。ネット接続を確認してください。'
      );
    } else {
      await login();
    }
    return;
  }

  if (!syncEnabled) {
    await startSync();
    return;
  }

  const choice = await dialog(
    'SUGU 自動同期',
    `アカウント：${cloudUser.email || ''}\n`+
    `状態：${
      syncError
        ? '同期エラー：'+syncError
        : '同期有効'
    }\n\n`+
    '端末内のメモは、ログアウトしても残ります。',
    ['閉じる','今すぐ同期','ログアウト']
  );

  if (choice === 1) await syncNow();
  if (choice === 2) await logout();
}

async function init() {
  try {
    db = await openDB();
    notes = await getAll();

    let last;

    try {
      last = localStorage.getItem('mimi-last-id');
    } catch(e) {}

    if (
      last &&
      notes.some(n =>
        n.id === last && !n.deleted
      )
    ) {
      choose(last);
    } else if (sorted().length) {
      choose(sorted()[0].id);
    } else {
      await create(false);
    }

    $('status').textContent = '保存済み';

    let previous = 'list';

    try {
      previous =
        localStorage.getItem('sugu-screen') ||
        'list';
    } catch(e) {}

    setScreen(
      previous === 'edit' ? 'edit' : 'list'
    );
  } catch(e) {
    await dialog(
      '起動エラー',
      '端末内の保存領域を開けませんでした。\n'+
      String(e.message || e)
    );
    return;
  }

  $('title').addEventListener('input',save);
  $('body').addEventListener('input',save);

  $('new').onclick = () => create();
  $('sideNew').onclick = () => create();
  $('copy').onclick = copyBody;
  $('paste').onclick = pasteNew;
  $('stats').onclick = showStats;
  $('ear').onclick = toggleEar;
  $('remove').onclick = remove;

  $('openList').onclick = () => {
    render();
    setScreen('list');
  };

  $('closeList').onclick = () => setScreen('edit');

  $('list').onclick = e => {
    const item = e.target.closest('.item');
    if (item) {
      choose(item.dataset.id,true);
    }
  };

  $('search').oninput = () => {
    visibleLimit = 10;
    render();
  };

  document.querySelectorAll('.chip').forEach(b => {
    b.onclick = () => {
      filter = b.dataset.filter;
      visibleLimit = 10;

      document.querySelectorAll('.chip').forEach(x =>
        x.classList.remove('active')
      );

      b.classList.add('active');
      render();
    };
  });

  $('export').onclick = exportJSON;
  $('import').onclick = () => $('file').click();

  $('file').onchange = async e => {
    await importJSON(e.target.files[0]);
    e.target.value = '';
  };

  $('login').onclick = login;
  $('logout').onclick = logout;
  $('startSync').onclick = startSync;
  $('syncMenu').onclick = syncMenu;

  document.addEventListener('keydown',e => {
    if (
      e.ctrlKey &&
      e.key.toLowerCase() === 'n'
    ) {
      e.preventDefault();
      create();
    }

    if (e.key === 'Escape') {
      setScreen('list');
    }
  });

  window.addEventListener(
    'popstate',
    () => setScreen('list')
  );

  document.addEventListener(
    'visibilitychange',
    () => {
      if (document.hidden) {
        save();
      } else if (syncEnabled) {
        syncNow();
      }
    }
  );

  window.addEventListener('online',() => {
    if (syncEnabled) syncNow();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener(
      'message',
      async e => {
        if (e.data?.type === 'SUGU_SHARED') {
          await queue;
          notes = await getAll();
          render();

          if (e.data.id) {
            choose(e.data.id,false);
          }
        }
      }
    );
  }

  if (
    new URL(location.href)
      .searchParams.has('shared')
  ) {
    notes = await getAll();

    const latestShared = notes
      .filter(n => !n.deleted)
      .sort(
        (a,b) =>
          dateValue(b.createdAt) -
          dateValue(a.createdAt)
      )[0];

    if (latestShared) {
      choose(latestShared.id,false);
    } else {
      render();
    }

    history.replaceState(
      null,'',location.pathname
    );
  }

  if (
    'serviceWorker' in navigator &&
    location.protocol === 'https:'
  ) {
    navigator.serviceWorker
      .register('./sw.js')
      .catch(console.warn);
  }

  // ローカル表示を終えてからFirebaseを読み込む。
  loadFirebase().catch(e => {
    console.error(
      'Firebase initialization:',e
    );
    $('account').textContent =
      'クラウド接続不可';
  });
}

init();
</script>
