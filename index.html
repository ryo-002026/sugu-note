<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f9f6">
<meta name="description" content="SUGU | 思いついたら、すぐ書ける。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>SUGU</title>

<style>
:root {
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  color:#26332d;
  background:#f8f9f6;
  --green:#27735a;
  --line:#e2e7e1;
  --muted:#718077;
}

* {box-sizing:border-box}

html,body {
  margin:0;
  width:100%;
  height:100%;
}

button,input,textarea {font:inherit}

button {
  border:0;
  background:transparent;
  color:inherit;
  cursor:pointer;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline:2px solid var(--green);
  outline-offset:2px;
}

.hide {display:none!important}

.app {
  display:grid;
  grid-template-columns:320px minmax(0,1fr);
  height:100dvh;
  overflow:hidden;
}

.side {
  display:flex;
  flex-direction:column;
  min-height:0;
  background:white;
  border-right:1px solid var(--line);
}

.toolbar {
  display:flex;
  align-items:center;
  gap:6px;
  min-height:56px;
  padding:6px 10px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}

.brand {
  flex:1;
  padding-left:6px;
  font-size:18px;
  font-weight:800;
  letter-spacing:.04em;
}

.btn {
  display:grid;
  place-items:center;
  min-width:40px;
  height:40px;
  border-radius:10px;
  font-size:20px;
}

.btn:hover {background:#e7f3ec}

.status {
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.spacer {flex:1}

.syncbar {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  padding:8px 12px;
  background:#f1f6f1;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.syncbar span {
  flex:1;
  min-width:80px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.syncbtn {
  padding:7px 9px;
  border:1px solid #d4e2d7;
  border-radius:8px;
  background:white;
  font-size:12px;
}

.search {
  width:calc(100% - 24px);
  margin:12px;
  padding:11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fafbf9;
}

.filters {
  display:flex;
  gap:6px;
  padding:0 12px 10px;
}

.chip {
  padding:8px 12px;
  border-radius:20px;
  color:#66766e;
  font-size:13px;
}

.chip.active {
  background:#e7f3ec;
  color:var(--green);
}

.count {
  padding:0 15px 8px;
  color:var(--muted);
  font-size:12px;
}

.list {
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
}

.item {
  position:relative;
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.item:hover {background:#f5f8f5}
.item.active {background:#e7f3ec}

.item strong {
  display:block;
  padding-right:48px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
}

.item p {
  margin:5px 0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
  color:var(--muted);
}

.item small {
  color:#85918b;
  font-size:11px;
}

.favorite-toggle {
  position:absolute;
  top:7px;
  right:8px;
  display:grid;
  place-items:center;
  width:36px;
  height:36px;
  border-radius:9px;
  color:#b9c5bb;
  font-size:22px;
}

.favorite-toggle:hover {
  color:#d19b30;
  background:#fff8e8;
}

.favorite-toggle.is-favorite {
  color:#d6a139;
}

.ghost-card {
  background:#f2ecfa;
  border-left:4px solid #9473bd;
}

.ghost-card:hover {background:#ece2f8}

.ghost-card strong {
  color:#654b86;
}

.ghost-card p {
  color:#765f94;
  white-space:normal;
  line-height:1.5;
}

.ghost-close {
  position:absolute;
  top:7px;
  right:7px;
  width:32px;
  height:32px;
  border-radius:8px;
  color:#806b9a;
  font-size:20px;
}

.more-button {
  width:100%;
  padding:15px;
  color:var(--green);
  font-size:13px;
}

.side-bottom {
  display:flex;
  align-items:stretch;
  gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:white;
  flex-shrink:0;
}

.bottom-icon {
  display:grid;
  place-items:center;
  width:44px;
  min-width:44px;
  min-height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  color:#60756a;
  font-size:21px;
}

.bottom-icon:hover {background:#f1f6f1}

.create-button {
  flex:1;
  min-width:0;
  min-height:48px;
  padding:11px 6px;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-weight:750;
  white-space:nowrap;
}

.create-button:hover {background:#1c5c47}

.editor {
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
}

.edit {
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  width:100%;
  max-width:920px;
  margin:auto;
  padding:20px 28px;
}

#title {
  width:100%;
  padding:12px 0;
  border:0;
  outline:0;
  background:none;
  font-size:22px;
  font-weight:700;
}

#body {
  flex:1;
  min-height:0;
  width:100%;
  padding:8px 0 24px;
  border:0;
  outline:0;
  resize:none;
  background:none;
  font-size:16px;
  line-height:1.75;
}

.link-preview {
  flex-shrink:0;
  max-height:120px;
  overflow-y:auto;
  padding:8px 0;
  border-top:1px solid var(--line);
  font-size:13px;
}

.link-preview:empty {
  display:none;
}

.link-preview-label {
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-size:11px;
}

.link-preview a {
  display:block;
  padding:5px 0;
  color:var(--green);
  overflow-wrap:anywhere;
  text-decoration:underline;
}

.copy-success {
  color:var(--green);
  background:#e7f3ec;
}

.empty-editor {
  flex:1;
  display:grid;
  place-items:center;
  color:#9aa69e;
  font-size:14px;
}

.overlay {
  position:fixed;
  inset:0;
  z-index:30;
  display:grid;
  place-items:center;
  padding:18px;
  background:#0008;
}

.modal {
  width:min(480px,100%);
  max-height:90dvh;
  overflow:auto;
  padding:22px;
  border-radius:16px;
  background:white;
}

.modal h2 {
  margin:0 0 10px;
  font-size:18px;
}

.modal p {
  white-space:pre-line;
  line-height:1.7;
  font-size:14px;
}

.actions {
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.action {
  padding:10px 15px;
  border-radius:9px;
  background:#edf0ec;
}

.action.primary {
  background:var(--green);
  color:white;
}

.mobile {display:none}

@media(max-width:700px) {
  .app {
    display:block;
  }

  .side {
    position:fixed;
    inset:0;
    z-index:10;
    transform:translateX(-100%);
    transition:transform .12s ease;
  }

  .side.open {
    transform:translateX(0);
  }

  .editor {
    height:100dvh;
  }

  .mobile {
    display:grid;
  }

  .edit {
    padding:10px 18px;
  }

  #title {font-size:20px}
  #body {font-size:16px}

  .toolbar {
    padding-left:8px;
    padding-right:8px;
  }

  .btn {
    min-width:36px;
    width:36px;
  }
}

@media(min-width:701px) {
  .favorite-toggle:not(.is-favorite) {
    opacity:.48;
  }

  .item:hover .favorite-toggle {
    opacity:1;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside id="side" class="side">
    <header class="toolbar">
      <button id="closeList" class="btn mobile"
        title="一覧を閉じる" aria-label="一覧を閉じる">‹</button>

      <div class="brand">SUGU</div>

      <button id="import" class="btn"
        title="バックアップを取り込む">⇩</button>

      <button id="export" class="btn"
        title="JSONバックアップを保存">⇧</button>
    </header>

    <div class="syncbar">
      <span id="account">ログインしていません</span>

      <button id="login" class="syncbtn">
        Googleログイン
      </button>

      <button id="logout" class="syncbtn hide">
        ログアウト
      </button>

      <button id="startSync" class="syncbtn hide">
        同期を開始
      </button>
    </div>

    <input
      id="search"
      class="search"
      placeholder="メモを検索"
      aria-label="メモを検索"
    >

    <div class="filters">
      <button class="chip active" data-filter="all">
        すべて
      </button>

      <button class="chip" data-filter="ear">
        ★ お気に入り
      </button>
    </div>

    <div id="count" class="count"></div>

    <div id="list" class="list"></div>

    <div class="side-bottom">
      <button
        id="paste"
        class="bottom-icon"
        title="コピーした文章からメモ"
        aria-label="コピーした文章からメモ"
      >▣</button>

      <button id="sideNew" class="create-button">
        ＋ すぐメモ
      </button>

      <button
        id="stats"
        class="bottom-icon"
        title="どうでもいい記録"
        aria-label="どうでもいい記録"
      >▥</button>
    </div>
  </aside>

  <main class="editor">
    <header class="toolbar">
      <button id="openList" class="btn mobile"
        title="メモ一覧" aria-label="メモ一覧">‹</button>

      <span id="status" class="status">
        読み込み中
      </span>

      <div class="spacer"></div>

      <button id="syncMenu" class="btn"
        title="Googleログイン・同期">☁</button>

      <button id="new" class="btn"
        title="新規メモ">＋</button>

      <button id="copy" class="btn"
        title="本文をコピー">□</button>

      <button id="ear" class="btn"
        title="お気に入り">☆</button>

      <button id="remove" class="btn"
        title="メモ削除">⌫</button>
    </header>

    <div id="editArea" class="edit">
      <input
        id="title"
        placeholder="タイトル"
        autocomplete="off"
        aria-label="タイトル"
      >

      <textarea
        id="body"
        placeholder="メモを書く…"
        aria-label="メモ本文"
        spellcheck="false"
      ></textarea>

      <div id="links" class="link-preview"></div>
    </div>

    <div id="emptyEditor" class="empty-editor hide">
      一覧からメモを選んでください
    </div>
  </main>
</div>

<input
  id="file"
  type="file"
  accept=".json,application/json"
  class="hide"
>

<div id="dialogs"></div>

<script type="module">
'use strict';

const $ = id => document.getElementById(id);

const DB = 'mimi-sync-db';
const TABLE = 'notes';
const META = 'syncMeta';

const firebaseConfig = {
  apiKey: "AIzaSyDPlUYQ6vzg8rBQAdt_M-i3hOm8VRkB6FE",
  authDomain: "sugu-43386.firebaseapp.com",
  databaseURL: "https://sugu-43386-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sugu-43386",
  storageBucket: "sugu-43386.firebasestorage.app",
  messagingSenderId: "1056209931526",
  appId: "1:1056209931526:web:111fca8d731e2e1a452287"
};

let db;
let notes = [];
let selected = null;
let filter = 'all';
let queue = Promise.resolve();
let failed = false;
let version = 0;

let visibleLimit = 10;
let screen = 'list';
let copiedId = null;
let ghostDismissedDay = '';

let firebase = null;
let auth = null;
let firestore = null;
let cloudUser = null;
let syncEnabled = false;
let syncing = false;
let syncAgain = false;
let syncTimer = null;
let syncInterval = null;
let accountGeneration = 0;
let syncError = '';

const iso = () => new Date().toISOString();

function localGet(key) {
  try {
    return localStorage.getItem(key);
  } catch(e) {
    return null;
  }
}

function localSet(key,value) {
  try {
    localStorage.setItem(key,String(value));
  } catch(e) {}
}

function localRemove(key) {
  try {
    localStorage.removeItem(key);
  } catch(e) {}
}

function dayKey() {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

function dateValue(s) {
  if (typeof s === 'number') {
    return s < 1e11 ? s*1000 : s;
  }

  if (!s) return 0;

  const v = String(s);
  const numeric = Number(v);

  if (/^\d{10,13}$/.test(v)) {
    return numeric < 1e11 ? numeric*1000 : numeric;
  }

  const d = Date.parse(v) ||
    Date.parse(v.replace(' ','T'));

  return Number.isFinite(d) ? d : 0;
}

function openDB() {
  return new Promise((ok,no) => {
    const r = indexedDB.open(DB,2);

    r.onupgradeneeded = () => {
      const database = r.result;

      if (!database.objectStoreNames.contains(TABLE)) {
        database.createObjectStore(
          TABLE,{keyPath:'id'}
        );
      }

      if (!database.objectStoreNames.contains(META)) {
        database.createObjectStore(
          META,{keyPath:'key'}
        );
      }
    };

    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
    r.onblocked = () =>
      no(Error('他のタブがデータベースを使用中です'));
  });
}

function getAll() {
  return new Promise((ok,no) => {
    const r = db.transaction(TABLE,'readonly')
      .objectStore(TABLE).getAll();

    r.onsuccess = () => ok(r.result);
    r.onerror = () => no(r.error);
  });
}

function getMeta(key) {
  return new Promise((ok,no) => {
    const r = db.transaction(META,'readonly')
      .objectStore(META).get(key);

    r.onsuccess = () => ok(r.result?.value);
    r.onerror = () => no(r.error);
  });
}

function setMeta(key,value) {
  return new Promise((ok,no) => {
    const tx = db.transaction(META,'readwrite');

    tx.objectStore(META).put({key,value});

    tx.oncomplete = () => ok();
    tx.onerror = () => no(tx.error);
    tx.onabort = () => no(tx.error);
  });
}

function transaction(items,removeId) {
  return new Promise((ok,no) => {
    const tx = db.transaction(TABLE,'readwrite');
    const store = tx.objectStore(TABLE);

    for (const n of items) {
      store.put({...n});
    }

    if (removeId) {
      store.delete(removeId);
    }

    tx.oncomplete = () => ok();
    tx.onerror = () => no(tx.error);
    tx.onabort = () => no(tx.error);
  });
}

function enqueue(job) {
  const task = queue.then(job);

  queue = task.catch(e => {
    failed = true;
    $('status').textContent = '保存失敗';
    console.error(e);
  });

  return task;
}

function sorted() {
  return [...notes]
    .filter(n => !n.deleted)
    .sort((a,b) =>
      dateValue(b.updatedAt) -
      dateValue(a.updatedAt)
    );
}

function current() {
  return notes.find(n =>
    n.id === selected && !n.deleted
  );
}

function label(n) {
  return n.title ||
    n.body.split('\n').find(Boolean) ||
    '無題';
}

function resetCopy() {
  copiedId = null;
  $('copy').textContent = '□';
  $('copy').classList.remove('copy-success');
  $('copy').title = '本文をコピー';
}

function updateCopy() {
  const done = copiedId && copiedId === selected;

  $('copy').textContent = done ? '✓' : '□';
  $('copy').classList.toggle('copy-success',!!done);
  $('copy').title = done
    ? 'コピー済み'
    : '本文をコピー';
}

function showScreen(next) {
  if (screen !== next) {
    resetCopy();
  }

  screen = next;
  localSet('sugu-screen',next);

  if (matchMedia('(max-width:700px)').matches) {
    $('side').classList.toggle(
      'open',next === 'list'
    );
  }
}

function openEditorHistory() {
  const state = history.state;

  if (!state || state.sugu !== 'edit') {
    history.pushState(
      {sugu:'edit'},
      '',
      location.href
    );
  }

  showScreen('edit');
}

function goList() {
  if (
    matchMedia('(max-width:700px)').matches &&
    history.state?.sugu === 'edit'
  ) {
    history.back();
    return;
  }

  showScreen('list');
}

function restoreHistory() {
  const previous =
    localGet('sugu-screen') || 'list';

  history.replaceState(
    {sugu:'list'},
    '',
    location.href
  );

  showScreen('list');

  if (
    previous === 'edit' &&
    current()
  ) {
    openEditorHistory();
  }
}

function updateEditor() {
  const n = current();
  const exists = !!n;

  $('editArea').classList.toggle('hide',!exists);
  $('emptyEditor').classList.toggle('hide',exists);

  for (const id of ['copy','ear','remove']) {
    $(id).disabled = !exists;
    $(id).style.opacity = exists ? '1' : '.35';
  }

  if (!exists) {
    $('title').value = '';
    $('body').value = '';
    $('ear').textContent = '☆';
    $('links').replaceChildren();
    resetCopy();
    return;
  }

  $('title').value = n.title;
  $('body').value = n.body;
  $('ear').textContent = n.ear ? '★' : '☆';

  updateCopy();
  updateLinks();
}

function updateLinks() {
  const root = $('links');
  root.replaceChildren();

  const body = $('body').value;

  // URL認識はメモを開いたとき・編集欄を離れたときだけ。
  const matches =
    body.match(/https?:\/\/[^\s<>"'「」]+/g) || [];

  const urls = [...new Set(matches)].slice(0,20);

  if (!urls.length) return;

  const caption = document.createElement('span');
  caption.className = 'link-preview-label';
  caption.textContent = '本文中のリンク';

  root.append(caption);

  for (const raw of urls) {
    const clean = raw.replace(/[.,。、）)\]】]+$/g,'');

    try {
      const url = new URL(clean);

      if (
        url.protocol !== 'https:' &&
        url.protocol !== 'http:'
      ) continue;

      const a = document.createElement('a');
      a.href = url.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = clean;
      a.title = 'リンクを開く';

      root.append(a);
    } catch(e) {}
  }
}

function getViewMap() {
  try {
    return JSON.parse(
      localStorage.getItem('sugu-viewed-v1') || '{}'
    );
  } catch(e) {
    return {};
  }
}

function recordView(id) {
  // 閲覧履歴は端末内だけで管理。
  // Firestoreには書き込まない。
  const map = getViewMap();

  map[id] = Date.now();

  const entries = Object.entries(map);

  if (entries.length > 1000) {
    entries.sort((a,b) => b[1]-a[1]);

    const reduced = Object.fromEntries(
      entries.slice(0,1000)
    );

    localSet(
      'sugu-viewed-v1',
      JSON.stringify(reduced)
    );
  } else {
    localSet(
      'sugu-viewed-v1',
      JSON.stringify(map)
    );
  }
}

function ghostCandidate(visible) {
  if (
    ghostDismissedDay === dayKey() ||
    visible.length === 0
  ) return null;

  const cutoff = Date.now() - 30*86400000;
  const viewed = getViewMap();

  const candidates = visible.filter(n => {
    const last = viewed[n.id] ||
      dateValue(n.lastOpenedAt) ||
      dateValue(n.createdAt) ||
      dateValue(n.updatedAt);

    return last > 0 && last < cutoff;
  });

  if (!candidates.length) return null;

  const today = Math.floor(Date.now()/86400000);
  const index = today % candidates.length;

  return candidates[index];
}

function makeGhostCard(n) {
  const viewed = getViewMap();

  const last = viewed[n.id] ||
    dateValue(n.lastOpenedAt) ||
    dateValue(n.createdAt) ||
    dateValue(n.updatedAt);

  const days = Math.floor(
    (Date.now()-last)/86400000
  );

  const card = document.createElement('div');
  card.className = 'item ghost-card';
  card.dataset.id = n.id;

  const title = document.createElement('strong');
  title.textContent = '👻 メモの亡霊';

  const name = document.createElement('p');
  name.textContent = label(n);

  const message = document.createElement('p');

  const messages = [
    `「${days}日ぶりですね。こちらはずっとここにいました。」`,
    '「私のこと、覚えていますか。私は覚えています。」',
    '「そろそろ『あとで』の期限を教えていただけませんか？」'
  ];

  message.textContent =
    messages[Math.floor(Date.now()/86400000)%messages.length];

  const close = document.createElement('button');
  close.className = 'ghost-close';
  close.textContent = '×';
  close.title = '今日は表示しない';

  close.onclick = e => {
    e.stopPropagation();

    ghostDismissedDay = dayKey();

    localSet(
      'sugu-ghost-dismiss',
      ghostDismissedDay
    );

    render();
  };

  card.append(title,name,message,close);

  return card;
}

function makeItem(n) {
  const item = document.createElement('div');

  item.className =
    'item' +
    (n.id === selected ? ' active' : '');

  item.dataset.id = n.id;

  const name = document.createElement('strong');
  name.textContent = label(n);

  const preview = document.createElement('p');
  preview.textContent =
    n.body.replace(/\s+/g,' ').slice(0,120);

  const time = document.createElement('small');
  time.textContent =
    String(n.updatedAt || '').slice(0,19);

  const star = document.createElement('button');
  star.className =
    'favorite-toggle' +
    (n.ear ? ' is-favorite' : '');

  star.textContent = n.ear ? '★' : '☆';
  star.title = n.ear
    ? 'お気に入りを解除'
    : 'お気に入りに追加';

  star.setAttribute(
    'aria-label',
    star.title
  );

  star.onclick = e => {
    e.stopPropagation();
    toggleFavoriteById(n.id);
  };

  item.append(name,preview,time,star);

  return item;
}

function render() {
  const q = $('search').value.toLocaleLowerCase();
  const visible = sorted();

  const list = visible.filter(n =>
    (filter === 'all' || n.ear) &&
    (n.title+'\n'+n.body)
      .toLocaleLowerCase().includes(q)
  );

  $('count').textContent =
    `${list.length}件 / 全${visible.length}件`;

  const root = $('list');
  root.replaceChildren();

  const ghost =
    !q && filter === 'all'
      ? ghostCandidate(visible)
      : null;

  // 亡霊は一覧4番目の特別カード。
  // 同じメモを通常カードとして重複表示しない。
  const regular = ghost
    ? list.filter(n => n.id !== ghost.id)
    : list;

  const shown = regular.slice(0,visibleLimit);

  shown.forEach((n,i) => {
    if (i === 3 && ghost) {
      root.append(makeGhostCard(ghost));
    }

    root.append(makeItem(n));
  });

  if (ghost && shown.length < 4) {
    root.append(makeGhostCard(ghost));
  }

  if (regular.length > visibleLimit) {
    const more = document.createElement('button');
    more.className = 'more-button';
    more.textContent = 'さらに10件表示';

    more.onclick = () => {
      visibleLimit += 10;
      render();
    };

    root.append(more);
  }
}

function choose(id,focus=false,options={}) {
  const n = notes.find(x =>
    x.id === id && !x.deleted
  );

  if (!n) return;

  resetCopy();

  selected = id;
  version++;

  localSet('mimi-last-id',id);
  recordView(id);

  updateEditor();

  $('status').textContent =
    failed ? '保存失敗' : '保存済み';

  if (!options.noHistory) {
    openEditorHistory();
  } else {
    showScreen('edit');
  }

  render();

  if (focus) {
    requestAnimationFrame(() =>
      $('body').focus()
    );
  }
}

function showEmpty() {
  selected = null;
  resetCopy();
  updateEditor();
  render();
}

function scheduleSync() {
  if (!syncEnabled || !cloudUser) return;

  clearTimeout(syncTimer);

  syncTimer = setTimeout(
    () => syncNow(),1500
  );
}

function save() {
  const n = current();
  if (!n) return;

  const title = $('title').value;
  const body = $('body').value;

  if (
    title === n.title &&
    body === n.body
  ) return;

  n.title = title;
  n.body = body;
  n.updatedAt = iso();

  resetCopy();

  const snapshot = {...n};
  const v = ++version;

  failed = false;
  $('status').textContent = '保存中';

  enqueue(() => transaction([snapshot]))
    .then(() => {
      if (
        selected === snapshot.id &&
        version === v
      ) {
        $('status').textContent = '保存済み';
      }

      scheduleSync();
    })
    .catch(() => {});
}

async function create(focus=true,body='',title='') {
  const now = iso();

  const n = {
    id:crypto.randomUUID(),
    title,
    body,
    ear:false,
    createdAt:now,
    updatedAt:now,
    deleted:false
  };

  notes.push(n);

  try {
    await enqueue(() => transaction([n]));

    choose(n.id,focus);
    scheduleSync();
  } catch(e) {
    notes = notes.filter(x => x.id !== n.id);

    await dialog(
      '保存できません',
      '新規メモを保存できませんでした。'
    );
  }
}

async function toggleFavoriteById(id) {
  const n = notes.find(x =>
    x.id === id && !x.deleted
  );

  if (!n) return;

  const previous = {...n};

  n.ear = !n.ear;
  n.updatedAt = iso();

  const snapshot = {...n};

  if (selected === id) {
    $('ear').textContent = n.ear ? '★' : '☆';
  }

  render();

  try {
    await enqueue(
      () => transaction([snapshot])
    );

    scheduleSync();
  } catch(e) {
    Object.assign(n,previous);
    render();

    await dialog(
      '保存エラー',
      String(e.message || e)
    );
  }
}

function toggleEar() {
  if (selected) {
    toggleFavoriteById(selected);
  }
}

async function copyBody() {
  const n = current();
  if (!n) return;

  const id = n.id;
  const body = $('body').value;

  try {
    await navigator.clipboard.writeText(body);

    // コピー完了までに画面が変わっていた場合は
    // 別のメモにチェックを表示しない。
    if (
      selected !== id ||
      screen !== 'edit' ||
      $('body').value !== body
    ) return;

    copiedId = id;
    updateCopy();

    $('status').textContent = 'コピーしました';
  } catch(e) {
    await dialog(
      'コピーできませんでした',
      'クリップボードへの書き込みが許可されていません。'
    );
  }
}

async function pasteNew() {
  try {
    const text = await navigator.clipboard.readText();

    if (!text) {
      await dialog(
        'クリップボードが空です',
        'コピーした文章が見つかりません。'
      );
      return;
    }

    await create(true,text);
  } catch(e) {
    await dialog(
      '読み取れませんでした',
      'クリップボードへのアクセスが許可されていないか、このブラウザでは利用できません。'
    );
  }
}

async function showStats() {
  // 統計はボタンを押したときだけ計算。
  const all = notes.filter(n => !n.deleted);

  const sizes = all.map(n =>
    (n.title+n.body).length
  );

  const chars = sizes.reduce(
    (a,b) => a+b,0
  );

  const longest = sizes.length
    ? Math.max(...sizes)
    : 0;

  const shortest = sizes.length
    ? Math.min(...sizes)
    : 0;

  const exclamations = all.reduce(
    (sum,n) =>
      sum +
      ((n.title+n.body).match(/[!！]/g)||[]).length,
    0
  );

  const questionMarks = all.reduce(
    (sum,n) =>
      sum +
      ((n.title+n.body).match(/[?？]/g)||[]).length,
    0
  );

  await dialog(
    'どうでもいい記録',
    `メモ総数：${all.length}件\n`+
    `全文字数：${chars.toLocaleString()}字\n`+
    `最長メモ：${longest}字\n`+
    `最短メモ：${shortest}字\n`+
    `「！」の使用回数：${exclamations}回\n`+
    `「？」の使用回数：${questionMarks}回\n\n`+
    'メモは今日も、何事もなかったように保存されています。'
  );
}

function dialog(title,message,choices=['閉じる']) {
  return new Promise(ok => {
    const host = $('dialogs');
    host.replaceChildren();

    const overlay = document.createElement('div');
    const box = document.createElement('div');
    const h = document.createElement('h2');
    const p = document.createElement('p');
    const actions = document.createElement('div');

    overlay.className = 'overlay';
    box.className = 'modal';
    actions.className = 'actions';

    h.textContent = title;
    p.textContent = message;

    choices.forEach((choice,i) => {
      const b = document.createElement('button');

      b.className =
        'action' +
        (i === choices.length-1 ? ' primary' : '');

      b.textContent = choice;

      b.onclick = () => {
        host.replaceChildren();
        ok(i);
      };

      actions.append(b);
    });

    box.append(h,p,actions);
    overlay.append(box);
    host.append(overlay);
  });
}

async function remove() {
  const n = current();
  if (!n) return;

  if (await dialog(
    'メモを削除しますか？',
    '同期中の場合、他の端末からも削除されます。',
    ['キャンセル','削除']
  ) !== 1) return;

  await queue;

  if (failed) {
    await dialog(
      '保存エラー',
      '保存に失敗しているため、削除を中止しました。'
    );
    return;
  }

  const old = {...n};

  const tombstone = {
    ...n,
    deleted:true,
    updatedAt:iso()
  };

  try {
    await enqueue(
      () => transaction([tombstone])
    );

    Object.assign(n,tombstone);

    localRemove('mimi-last-id');

    const remaining = sorted();

    if (remaining.length) {
      selected = remaining[0].id;
      updateEditor();
    } else {
      selected = null;
      updateEditor();
    }

    showScreen('list');
    render();
    scheduleSync();
  } catch(e) {
    Object.assign(n,old);

    await dialog(
      '削除エラー',
      String(e.message || e)
    );
  }
}

async function exportJSON() {
  save();
  await queue;

  if (failed) {
    await dialog(
      '保存エラー',
      'バックアップ前に保存状態を確認してください。'
    );
    return;
  }

  const all = (await getAll())
    .filter(n => !n.deleted);

  const blob = new Blob([
    JSON.stringify({
      format:'mimi-sync-v1',
      exportedAt:iso(),
      notes:all
    },null,2)
  ],{type:'application/json'});

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download =
    'SUGUBackup_'+iso().slice(0,10)+'.json';

  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    10000
  );
}

async function importJSON(file) {
  if (!file) return;

  try {
    const data = JSON.parse(
      await file.text()
    );

    if (
      data.format !== 'mimi-sync-v1' ||
      !Array.isArray(data.notes)
    ) {
      throw Error(
        '対応していないJSONバックアップです'
      );
    }

    const incoming = new Map();

    for (const raw of data.notes) {
      if (
        !raw ||
        typeof raw !== 'object' ||
        typeof raw.id !== 'string' ||
        !raw.id
      ) continue;

      incoming.set(raw.id,{
        id:raw.id,
        title:String(raw.title ?? ''),
        body:String(raw.body ?? ''),
        ear:!!raw.ear,
        createdAt:raw.createdAt ?? '',
        updatedAt:raw.updatedAt ?? '',
        deleted:false
      });
    }

    const known = new Set(
      notes.map(n => n.id)
    );

    const add = [...incoming.values()]
      .filter(n => !known.has(n.id));

    if (await dialog(
      'バックアップを取り込みますか？',
      `ファイル内：${incoming.size}件\n`+
      `新規追加：${add.length}件\n`+
      '既存メモは上書きしません。',
      ['キャンセル','取り込む']
    ) !== 1) return;

    save();
    await queue;

    if (failed) {
      throw Error(
        '編集中のメモを保存できません'
      );
    }

    if (add.length) {
      await enqueue(
        () => transaction(add)
      );
    }

    notes = await getAll();

    render();
    scheduleSync();

    await dialog(
      '取り込み完了',
      `${add.length}件追加しました。`
    );
  } catch(e) {
    await dialog(
      '取り込みエラー',
      String(e.message || e)
    );
  }
}

function cleanNote(raw,id) {
  return {
    id,
    title:String(raw.title ?? ''),
    body:String(raw.body ?? ''),
    ear:!!raw.ear,
    createdAt:String(raw.createdAt ?? ''),
    updatedAt:String(raw.updatedAt ?? ''),
    deleted:!!raw.deleted
  };
}

function syncKey(uid) {
  return 'enabled:'+uid;
}

function updateAccountUI() {
  const name = cloudUser
    ? (cloudUser.email || 'Googleアカウント')
    : 'ログインしていません';

  $('account').textContent = name;

  $('login').classList.toggle(
    'hide',!!cloudUser
  );

  $('logout').classList.toggle(
    'hide',!cloudUser
  );

  $('startSync').classList.toggle(
    'hide',!cloudUser || syncEnabled
  );

  if (cloudUser && syncEnabled) {
    $('account').textContent =
      name+' ・ 同期有効';
  }
}

async function loadFirebase() {
  const base =
    'https://www.gstatic.com/firebasejs/13.3.0/';

  const [appMod,authMod,dbMod] =
    await Promise.all([
      import(base+'firebase-app.js'),
      import(base+'firebase-auth.js'),
      import(base+'firebase-firestore.js')
    ]);

  const app = appMod.initializeApp(
    firebaseConfig
  );

  auth = authMod.getAuth(app);
  firestore = dbMod.getFirestore(app);

  firebase = {authMod,dbMod};

  authMod.onAuthStateChanged(
    auth,
    async user => {
      const generation =
        ++accountGeneration;

      clearTimeout(syncTimer);
      clearInterval(syncInterval);

      syncEnabled = false;
      cloudUser = user;
      syncError = '';

      if (user) {
        try {
          syncEnabled =
            (await getMeta(
              syncKey(user.uid)
            )) === true;
        } catch(e) {
          console.error(e);
        }
      }

      if (
        generation !== accountGeneration
      ) return;

      updateAccountUI();

      if (syncEnabled && user) {
        syncNow();

        syncInterval = setInterval(() => {
          if (
            !document.hidden &&
            navigator.onLine
          ) {
            syncNow();
          }
        },15000);
      }
    },
    error => {
      console.error(error);
      $('account').textContent =
        '認証エラー';
    }
  );
}

async function login() {
  if (!firebase) {
    await dialog(
      '準備中',
      'Firebaseを読み込んでいます。少し待ってから試してください。'
    );
    return;
  }

  try {
    const provider =
      new firebase.authMod.GoogleAuthProvider();

    provider.setCustomParameters({
      prompt:'select_account'
    });

    await firebase.authMod.signInWithPopup(
      auth,provider
    );
  } catch(e) {
    console.error(e);

    await dialog(
      'Googleログインに失敗しました',
      String(e.code || e.message || e)+
      '\n\n学校のGoogleアカウントでは、管理者による外部アプリの制限がある場合があります。'+
      '\nAndroidでポップアップが開けない場合は、ChromeでSUGUのURLを直接開いて試してください。'
    );
  }
}

async function logout() {
  if (!auth || !cloudUser) return;

  if (await dialog(
    'ログアウトしますか？',
    '端末内のメモは残ります。共有端末ではログアウトだけではメモを隠せません。',
    ['キャンセル','ログアウト']
  ) !== 1) return;

  try {
    await firebase.authMod.signOut(auth);
  } catch(e) {
    await dialog(
      'ログアウトエラー',
      String(e.message || e)
    );
  }
}

async function startSync() {
  if (!cloudUser || syncEnabled) return;

  const user = cloudUser;

  const choice = await dialog(
    '初回同期を開始しますか？',
    `ログイン中：${user.email || 'Googleアカウント'}\n\n`+
    '端末内のメモとクラウドのメモを統合します。'+
    '\n同じIDのメモが両方にある場合、更新日時が新しい方を優先します。'+
    '\n\n先にJSONバックアップを保存してください。'+
    '\n学校の個人情報や機密情報は、許可がない場合は同期しないでください。',
    ['キャンセル','同期を開始']
  );

  if (
    choice !== 1 ||
    cloudUser?.uid !== user.uid
  ) return;

  save();
  await queue;

  if (failed) {
    await dialog(
      '同期を中止',
      '端末内への保存が失敗しています。'
    );
    return;
  }

  try {
    await setMeta(
      syncKey(user.uid),true
    );

    syncEnabled = true;
    updateAccountUI();

    syncInterval = setInterval(() => {
      if (
        !document.hidden &&
        navigator.onLine
      ) {
        syncNow();
      }
    },15000);

    await syncNow();
  } catch(e) {
    syncEnabled = false;

    await setMeta(
      syncKey(user.uid),false
    ).catch(console.error);

    updateAccountUI();

    await dialog(
      '同期開始エラー',
      String(e.message || e)
    );
  }
}

async function syncNow() {
  if (
    !syncEnabled ||
    !cloudUser ||
    !firebase ||
    !navigator.onLine
  ) return;

  if (syncing) {
    syncAgain = true;
    return;
  }

  syncing = true;

  const uid = cloudUser.uid;
  const generation = accountGeneration;
  const {dbMod} = firebase;

  const collection = dbMod.collection(
    firestore,'users',uid,'notes'
  );

  try {
    save();
    await queue;

    if (failed) {
      throw Error(
        '端末内の保存に失敗しています'
      );
    }

    $('status').textContent = '同期中';

    const remoteSnap =
      await dbMod.getDocs(collection);

    if (
      generation !== accountGeneration ||
      cloudUser?.uid !== uid ||
      !syncEnabled
    ) return;

    const remote = new Map();

    remoteSnap.forEach(d => {
      remote.set(
        d.id,
        cleanNote(d.data(),d.id)
      );
    });

    const local = new Map(
      (await getAll()).map(n => [
        n.id,cleanNote(n,n.id)
      ])
    );

    const download = [];
    const upload = [];

    for (const [id,r] of remote) {
      const l = local.get(id);

      if (
        !l ||
        dateValue(r.updatedAt) >
          dateValue(l.updatedAt)
      ) {
        download.push(r);
      }
    }

    for (const [id,l] of local) {
      const r = remote.get(id);

      if (
        !r ||
        dateValue(l.updatedAt) >
          dateValue(r.updatedAt)
      ) {
        upload.push(l);
      }
    }

    if (
      generation !== accountGeneration ||
      cloudUser?.uid !== uid ||
      !syncEnabled
    ) return;

    await queue;

    const latest = new Map(
      (await getAll()).map(n => [
        n.id,n
      ])
    );

    const safeDownload = download.filter(r => {
      const currentLocal = latest.get(r.id);
      const originalLocal = local.get(r.id);

      if (!currentLocal) return true;
      if (!originalLocal) return false;

      return dateValue(
        currentLocal.updatedAt
      ) <= dateValue(
        originalLocal.updatedAt
      );
    });

    if (safeDownload.length) {
      await enqueue(
        () => transaction(safeDownload)
      );

      notes = await getAll();

      const stillSelected = current();

      if (!stillSelected) {
        selected = null;
        updateEditor();
        showScreen('list');
      } else if (
        safeDownload.some(n =>
          n.id === selected
        ) &&
        document.activeElement !== $('title') &&
        document.activeElement !== $('body')
      ) {
        // 同期による再描画では履歴を増やさない。
        updateEditor();
      }

      render();
    }

    for (const n of upload) {
      if (
        generation !== accountGeneration ||
        cloudUser?.uid !== uid ||
        !syncEnabled
      ) return;

      const newest = (await getAll())
        .find(x => x.id === n.id);

      if (!newest) continue;

      const latestRemote = remote.get(n.id);

      if (
        latestRemote &&
        dateValue(
          latestRemote.updatedAt
        ) >= dateValue(
          newest.updatedAt
        )
      ) {
        continue;
      }

      await dbMod.setDoc(
        dbMod.doc(collection,n.id),
        cleanNote(newest,n.id)
      );
    }

    syncError = '';
    $('status').textContent =
      '保存済み・同期済み';
  } catch(e) {
    console.error('SUGU sync:',e);

    syncError = String(
      e.code || e.message || e
    );

    $('status').textContent =
      '端末保存済み・同期失敗';
  } finally {
    syncing = false;

    if (syncAgain) {
      syncAgain = false;
      scheduleSync();
    }
  }
}

async function syncMenu() {
  if (!cloudUser) {
    if (!firebase) {
      await dialog(
        'Googleログイン',
        'Firebaseの読み込みが完了していません。ネット接続を確認してください。'
      );
    } else {
      await login();
    }
    return;
  }

  if (!syncEnabled) {
    await startSync();
    return;
  }

  const choice = await dialog(
    'SUGU 自動同期',
    `アカウント：${cloudUser.email || ''}\n`+
    `状態：${
      syncError
        ? '同期エラー：'+syncError
        : '同期有効'
    }\n\n`+
    '端末内のメモは、ログアウトしても残ります。',
    ['閉じる','今すぐ同期','ログアウト']
  );

  if (choice === 1) await syncNow();
  if (choice === 2) await logout();
}

async function receivePendingShare() {
  const id = await getMeta(
    'sugu-pending-share'
  ).catch(() => null);

  if (!id) return false;

  await queue;
  notes = await getAll();

  const n = notes.find(x =>
    x.id === id && !x.deleted
  );

  if (n) {
    choose(n.id,false);
    scheduleSync();
  }

  // 保存済みメモの確認が終わってから
  // 共有待ち情報を消す。
  await setMeta(
    'sugu-pending-share',null
  ).catch(console.error);

  return !!n;
}

async function init() {
  try {
    db = await openDB();
    notes = await getAll();

    ghostDismissedDay =
      localGet('sugu-ghost-dismiss') || '';

    const last = localGet('mimi-last-id');

    if (
      last &&
      notes.some(n =>
        n.id === last && !n.deleted
      )
    ) {
      selected = last;
    } else {
      selected = null;
    }

    updateEditor();
    render();

    restoreHistory();

    $('status').textContent = '保存済み';

    if (
      new URL(location.href)
        .searchParams.has('shared')
    ) {
      await receivePendingShare();

      const cleanURL = new URL(location.href);
      cleanURL.searchParams.delete('shared');

      history.replaceState(
        history.state,
        '',
        cleanURL.pathname +
        cleanURL.search +
        cleanURL.hash
      );
    }
  } catch(e) {
    await dialog(
      '起動エラー',
      '端末内の保存領域を開けませんでした。\n'+
      String(e.message || e)
    );
    return;
  }

  $('title').addEventListener('input',save);
  $('body').addEventListener('input',save);

  // リンク解析は毎回の入力ではなく、
  // 編集欄から離れたときに実行。
  $('body').addEventListener(
    'blur',updateLinks
  );

  $('new').onclick = () => create();
  $('sideNew').onclick = () => create();

  $('copy').onclick = copyBody;
  $('paste').onclick = pasteNew;
  $('stats').onclick = showStats;

  $('ear').onclick = toggleEar;
  $('remove').onclick = remove;

  $('openList').onclick = goList;
  $('closeList').onclick = goList;

  $('list').onclick = e => {
    if (e.target.closest('button')) return;

    const item = e.target.closest('.item');

    if (item?.dataset.id) {
      choose(item.dataset.id,true);
    }
  };

  $('search').oninput = () => {
    visibleLimit = 10;
    render();
  };

  document.querySelectorAll('.chip')
    .forEach(b => {
      b.onclick = () => {
        filter = b.dataset.filter;
        visibleLimit = 10;

        document.querySelectorAll('.chip')
          .forEach(x =>
            x.classList.remove('active')
          );

        b.classList.add('active');
        render();
      };
    });

  $('export').onclick = exportJSON;
  $('import').onclick = () => $('file').click();

  $('file').onchange = async e => {
    await importJSON(e.target.files[0]);
    e.target.value = '';
  };

  $('login').onclick = login;
  $('logout').onclick = logout;
  $('startSync').onclick = startSync;
  $('syncMenu').onclick = syncMenu;

  document.addEventListener('keydown',e => {
    if (
      e.ctrlKey &&
      e.key.toLowerCase() === 'n'
    ) {
      e.preventDefault();
      create();
    }

    if (e.key === 'Escape') {
      goList();
    }
  });

  window.addEventListener('popstate',e => {
    if (e.state?.sugu === 'edit' && current()) {
      showScreen('edit');
    } else {
      showScreen('list');
    }
  });

  document.addEventListener(
    'visibilitychange',
    () => {
      if (document.hidden) {
        save();
      } else if (syncEnabled) {
        syncNow();
      }
    }
  );

  window.addEventListener('online',() => {
    if (syncEnabled) syncNow();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener(
      'message',
      async e => {
        if (
          e.data?.type !== 'SUGU_SHARED'
        ) return;

        await queue;
        notes = await getAll();

        const n = notes.find(x =>
          x.id === e.data.id && !x.deleted
        );

        if (n) {
          choose(n.id,false);
          scheduleSync();
        }

        render();
      }
    );
  }

  if (
    'serviceWorker' in navigator &&
    location.protocol === 'https:'
  ) {
    navigator.serviceWorker.register('./sw.js')
      .catch(console.warn);
  }

  // 画面表示を終えてからFirebaseを読み込む。
  loadFirebase().catch(e => {
    console.error(
      'Firebase initialization:',e
    );

    $('account').textContent =
      'クラウド接続不可';
  });
}

init();
</script>
</body>
</html>
