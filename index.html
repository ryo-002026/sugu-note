
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f0">
<meta name="description" content="SUGU | 思いついたら、すぐ書ける。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>SUGU</title>
<style>
:root{
  font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
  color:#263c34;
  background:#f6f5f0;
  --bg:#f6f5f0;
  --paper:#fffefa;
  --side:#f0f2ec;
  --green:#285e4c;
  --green2:#39765f;
  --pale:#e4eee5;
  --line:#e0e5dc;
  --muted:#7d8a80;
  --bronze:#b48a53;
  --danger:#ad665d;
  --shadow:0 12px 36px rgba(32,58,43,.07);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
button,input,textarea,select{font:inherit}
button{border:0;background:transparent;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid var(--green2);
  outline-offset:2px
}
.hide{display:none!important}
.app{
  display:grid;
  grid-template-columns:326px minmax(0,1fr);
  width:100%;
  height:100dvh;
  overflow:hidden
}
.side{
  display:flex;
  flex-direction:column;
  min-height:0;
  background:var(--side);
  border-right:1px solid var(--line)
}
.toolbar{
  display:flex;
  align-items:center;
  gap:5px;
  min-height:61px;
  padding:8px 13px;
  flex-shrink:0
}
.side .toolbar{border-bottom:1px solid var(--line)}
.brand{
  flex:1;
  padding-left:8px;
  font-size:22px;
  font-weight:850;
  letter-spacing:.12em;
  color:var(--green)
}
.brand small{
  display:block;
  margin-top:-2px;
  font-size:9px;
  font-weight:500;
  letter-spacing:.18em;
  color:var(--muted)
}
.btn{
  display:grid;
  place-items:center;
  min-width:38px;
  height:38px;
  border-radius:11px;
  font-size:19px;
  transition:background .12s,color .12s
}
.btn:hover:not(:disabled){background:var(--pale)}
.btn.active{background:var(--pale);color:var(--green)}
.btn.danger:hover{background:#f8e9e6;color:var(--danger)}
.status{
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.spacer{flex:1}
.syncbar{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
  padding:9px 15px;
  border-bottom:1px solid var(--line);
  font-size:11px;
  color:var(--muted)
}
.syncbar span{
  flex:1;
  min-width:80px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.syncbtn{
  padding:6px 9px;
  border:1px solid #d4ded4;
  border-radius:9px;
  background:var(--paper);
  font-size:11px;
  color:var(--green)
}
.search-wrap{padding:15px 14px 9px}
.search{
  width:100%;
  padding:12px 13px;
  border:1px solid #dce4da;
  border-radius:13px;
  background:var(--paper);
  color:#263c34;
  font-size:14px;
  outline:0
}
.search:focus{border-color:#91b4a0}
.filters{
  display:flex;
  gap:5px;
  padding:0 14px 10px;
  flex-wrap:wrap
}
.chip{
  padding:8px 11px;
  border-radius:20px;
  color:#708075;
  font-size:12px;
  white-space:nowrap
}
.chip.active{
  background:var(--green);
  color:white
}
.sortbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px 10px;
  gap:8px
}
.count{color:var(--muted);font-size:12px}
.sort-select{
  max-width:150px;
  padding:7px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--paper);
  color:var(--green);
  font-size:12px
}
.list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:0 9px 12px
}
.item{
  position:relative;
  margin:4px 0;
  padding:13px 91px 13px 13px;
  min-height:108px;
  border:1px solid transparent;
  border-radius:13px;
  cursor:pointer;
  transition:background .12s,border-color .12s
}
.item:hover{background:#fffefa}
.item.active{
  background:var(--paper);
  border-color:#c9dbcc;
  box-shadow:0 2px 12px #244b3410
}
.item:focus-visible{
  outline:2px solid var(--green);
  outline-offset:-2px
}
.item strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
  line-height:1.6
}
.item p{
  margin:5px 0 7px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
  color:var(--muted)
}
.item small{font-size:10px;color:#95a096}
.item-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  margin-top:5px
}
.progress{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 7px;
  border-radius:7px;
  background:#e5efe8;
  color:var(--green);
  font-size:11px;
  font-weight:650
}
.progress.complete{
  background:#d8eadc;
  color:#2c7452
}
.item-actions{
  position:absolute;
  top:10px;
  right:8px;
  display:flex;
  flex-direction:column;
  gap:2px;
  align-items:center
}
.item-icon{
  display:grid;
  place-items:center;
  width:31px;
  height:28px;
  border-radius:8px;
  color:#9ba99e;
  font-size:18px
}
.item-icon:hover{background:#e7efe7;color:var(--green)}
.item-icon.on{color:var(--bronze)}
.item-icon.pin-on{color:var(--green)}
.item-icon.delete{font-size:16px}
.item-icon.delete:hover{background:#fae9e6;color:var(--danger)}
.ghost-card{
  background:#eee8f4;
  border-left:3px solid #9a7fba
}
.ghost-card strong,.ghost-card p{color:#745c8c}
.ghost-card p{white-space:normal;line-height:1.5}
.ghost-close{
  position:absolute;
  top:7px;
  right:7px;
  width:32px;
  height:32px;
  font-size:19px
}
.more-button{
  width:100%;
  padding:16px;
  color:var(--green);
  font-size:13px
}
.side-bottom{
  display:flex;
  align-items:stretch;
  gap:8px;
  padding:12px 13px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);
  background:var(--side);
  flex-shrink:0
}
.bottom-icon{
  display:grid;
  place-items:center;
  width:44px;
  min-width:44px;
  min-height:48px;
  border:1px solid #d6e0d5;
  border-radius:13px;
  background:var(--paper);
  color:var(--green);
  font-size:20px
}
.create-button{
  flex:1;
  min-width:0;
  min-height:48px;
  border-radius:13px;
  background:var(--green);
  color:white;
  font-weight:750;
  letter-spacing:.03em
}
.create-button:hover{background:#1e4b3b}
.editor{
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  background:var(--bg)
}
.editor-header{
  border-bottom:1px solid var(--line);
  background:rgba(255,254,250,.75)
}
.edit{
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  width:calc(100% - 40px);
  max-width:920px;
  margin:20px auto;
  padding:26px 36px;
  border:1px solid #e9ece5;
  border-radius:18px;
  background:var(--paper);
  box-shadow:var(--shadow)
}
#title{
  width:100%;
  padding:10px 0 15px;
  border:0;
  border-bottom:1px solid #edf0e9;
  outline:0;
  background:none;
  color:#263c34;
  font-size:24px;
  font-weight:750
}
#body{
  flex:1;
  min-height:0;
  width:100%;
  padding:16px 0 20px;
  border:0;
  outline:0;
  resize:none;
  background:none;
  color:#33443b;
  font-size:16px;
  line-height:1.85
}
.checklist{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:14px 0 20px
}
.check-row{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:47px
}
.check-row input[type=checkbox]{
  width:19px;
  height:19px;
  accent-color:var(--green);
  flex-shrink:0
}
.check-text{
  flex:1;
  min-width:0;
  padding:11px 4px;
  border:0;
  border-bottom:1px solid #edf0e9;
  background:transparent;
  outline:0;
  font-size:16px;
  color:#33443b
}
.check-text.done{
  color:#9ba69c;
  text-decoration:line-through
}
.check-delete{
  width:31px;
  height:34px;
  color:#a7b1a8;
  font-size:18px
}
.check-add{
  padding:14px 4px;
  color:var(--green);
  font-size:14px
}
.edit-tools{
  display:flex;
  align-items:center;
  gap:9px;
  padding:14px 0 0;
  flex-shrink:0
}
.mode-button{
  padding:8px 12px;
  border:1px solid #dbe4d9;
  border-radius:10px;
  color:var(--green);
  font-size:12px
}
.mode-button.on{
  background:var(--pale);
  border-color:#bcd3c3
}
.mode-hint{color:var(--muted);font-size:11px}
.link-preview{
  flex-shrink:0;
  max-height:125px;
  overflow-y:auto;
  padding:10px 0;
  border-top:1px solid var(--line);
  font-size:13px
}
.link-preview:empty{display:none}
.link-preview small{
  display:block;
  margin-bottom:5px;
  color:var(--muted)
}
.link-preview a{
  display:block;
  padding:5px 0;
  color:var(--green);
  overflow-wrap:anywhere
}
.copy-success{background:var(--pale);color:var(--green)}
.empty-editor{
  flex:1;
  display:grid;
  place-items:center;
  color:#9aa69e;
  font-size:14px
}
.overlay{
  position:fixed;
  inset:0;
  z-index:30;
  display:grid;
  place-items:center;
  padding:18px;
  background:rgba(20,37,28,.48)
}
.modal{
  width:min(480px,100%);
  max-height:90dvh;
  overflow:auto;
  padding:24px;
  border-radius:19px;
  background:var(--paper);
  box-shadow:0 20px 70px #0002
}
.modal h2{
  margin:0 0 10px;
  font-size:19px;
  color:var(--green)
}
.modal p{
  white-space:pre-line;
  line-height:1.75;
  font-size:14px;
  color:#58675c
}
.actions{
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:10px;
  margin-top:22px
}
.action{
  padding:11px 16px;
  border-radius:10px;
  background:#edf0e9
}
.action.primary{background:var(--green);color:white}
.action.danger{background:var(--danger);color:white}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  z-index:40;
  display:flex;
  align-items:center;
  gap:12px;
  max-width:calc(100vw - 30px);
  padding:13px 17px;
  border-radius:13px;
  background:#284b3b;
  color:white;
  box-shadow:0 8px 28px #0003;
  font-size:13px
}
.toast button{
  color:#c3f2d2;
  font-weight:700;
  white-space:nowrap
}

/* 設定画面 */
.settings-modal{
  width:min(610px,100%);
  padding:0;
  overflow:hidden
}
.settings-head{
  display:flex;
  align-items:center;
  gap:12px;
  padding:23px 25px 17px;
  border-bottom:1px solid var(--line)
}
.settings-head h2{
  margin:0;
  flex:1;
  font-size:20px
}
.settings-head small{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px
}
.settings-close{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#edf1eb;
  font-size:20px
}
.settings-tabs{
  display:flex;
  gap:5px;
  padding:12px 18px;
  border-bottom:1px solid var(--line);
  overflow-x:auto
}
.settings-tab{
  flex:1;
  min-width:68px;
  padding:10px 8px;
  border-radius:10px;
  color:var(--muted);
  font-size:12px;
  white-space:nowrap
}
.settings-tab.active{
  background:var(--green);
  color:white
}
.settings-content{
  padding:10px 23px 22px;
  max-height:60dvh;
  overflow-y:auto
}
.settings-row{
  display:flex;
  align-items:center;
  gap:15px;
  justify-content:space-between;
  padding:15px 0;
  border-bottom:1px solid #edf0e9
}
.settings-row:last-child{border-bottom:0}
.settings-text{flex:1;min-width:0}
.settings-text strong{
  display:block;
  margin-bottom:5px;
  font-size:14px;
  font-weight:650
}
.settings-text small{
  display:block;
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}
.switch{
  position:relative;
  display:block;
  width:45px;
  height:26px;
  flex-shrink:0;
  border-radius:20px;
  background:#cbd4cb;
  transition:background .15s
}
.switch::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:white;
  box-shadow:0 1px 4px #0002;
  transition:transform .15s
}
.switch.on{background:var(--green2)}
.switch.on::after{transform:translateX(19px)}
.settings-foot{
  padding:13px 24px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:11px;
  line-height:1.6
}
.mobile{display:none}
@media(max-width:700px){
  .app{display:block}
  .side{
    position:fixed;
    inset:0;
    z-index:10;
    transform:translateX(-100%);
    transition:transform .12s ease
  }
  .side.open{transform:translateX(0)}
  .editor{height:100dvh}
  .mobile{display:grid}
  .edit{
    width:100%;
    margin:0;
    padding:12px 19px;
    border:0;
    border-radius:0;
    box-shadow:none
  }
  #title{font-size:21px}
  .btn{min-width:35px;width:35px}
  .toolbar{padding:7px 9px}
  .settings-content{max-height:58dvh}
  .settings-tabs{padding:10px}
  .settings-tab{padding:9px 5px}
}
@media(min-width:701px){
  .item-icon:not(.on):not(.pin-on){opacity:.72}
  .item:hover .item-icon{opacity:1}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side" class="side">
    <header class="toolbar">
      <button id="closeList" class="btn mobile" title="一覧を閉じる">‹</button>
      <div class="brand">SUGU<small>YOUR LITTLE NOTEBOOK</small></div>
      <button id="settingsSide" class="btn" title="設定">⚙</button>
      <button id="import" class="btn" title="バックアップを取り込む">⇩</button>
      <button id="export" class="btn" title="JSONバックアップを保存">⇧</button>
    </header>

    <div id="syncbar" class="syncbar">
      <span id="account">ログインしていません</span>
      <button id="login" class="syncbtn">Googleログイン</button>
      <button id="logout" class="syncbtn hide">ログアウト</button>
      <button id="startSync" class="syncbtn hide">同期を開始</button>
    </div>

    <div class="search-wrap">
      <input id="search" class="search" placeholder="メモを検索…" aria-label="メモを検索">
    </div>

    <div class="filters">
      <button class="chip active" data-filter="all">すべて</button>
      <button id="favoriteFilter" class="chip" data-filter="ear">★ お気に入り</button>
      <button id="trashFilter" class="chip" data-filter="trash">ゴミ箱</button>
    </div>

    <div class="sortbar">
      <span id="count" class="count"></span>
      <select id="sort" class="sort-select" aria-label="並べ替え">
        <option value="updated">更新が新しい順</option>
        <option value="created">作成が新しい順</option>
        <option value="title">タイトル順</option>
      </select>
    </div>

    <div id="list" class="list" aria-label="メモ一覧"></div>

    <div class="side-bottom">
      <button id="paste" class="bottom-icon" title="コピーした文章からメモ">▣</button>
      <button id="sideNew" class="create-button">＋ すぐメモ</button>
      <button id="stats" class="bottom-icon" title="どうでもいい記録">▥</button>
    </div>
  </aside>

  <main class="editor">
    <header class="toolbar editor-header">
      <button id="openList" class="btn mobile" title="メモ一覧">‹</button>
      <span id="status" class="status">読み込み中</span>
      <div class="spacer"></div>
      <button id="syncMenu" class="btn" title="Googleログイン・同期">☁</button>
      <button id="settingsMain" class="btn" title="設定">⚙</button>
      <button id="new" class="btn" title="新規メモ">＋</button>
      <button id="copy" class="btn" title="本文をコピー">□</button>
      <button id="pin" class="btn" title="ピン留め">♧</button>
      <button id="ear" class="btn" title="お気に入り">☆</button>
      <button id="remove" class="btn danger" title="メモ削除">⌫</button>
    </header>

    <div id="editArea" class="edit">
      <input id="title" placeholder="タイトル" autocomplete="off" aria-label="タイトル">
      <div class="edit-tools">
        <button id="mode" class="mode-button">☑ チェックリストにする</button>
        <span id="modeHint" class="mode-hint"></span>
      </div>
      <textarea id="body" placeholder="メモを書く…" aria-label="メモ本文" spellcheck="false"></textarea>
      <div id="checklist" class="checklist hide"></div>
      <div id="links" class="link-preview"></div>
    </div>

    <div id="emptyEditor" class="empty-editor hide">
      一覧からメモを選んでください
    </div>
  </main>
</div>

<input id="file" type="file" accept=".json,application/json" class="hide">
<div id="dialogs"></div>

<div id="toast" class="toast hide">
  <span id="toastText"></span>
  <button id="toastUndo" class="hide">元に戻す</button>
</div>

<script type="module">

const $ = id => document.getElementById(id);
const DB = 'mimi-sync-db';

  copy:true,
  paste:true,
  stats:true,
  trash:true,
  undo:true,
  syncUI:true

const SETTING_GROUPS = {
  list:[
    ['favorite','お気に入り','★で分類します。並び順は変えません。'],
    ['pin','ピン留め','指定したメモだけを先頭に固定します。'],

    ['ghost','メモの亡霊','30日以上開いていないメモを時々紹介します。'],
    ['listDelete','一覧の削除ボタン','★の下に削除ボタンを表示します。'],
    ['deleteKey','Deleteキーで削除','PCの一覧で選択したメモを削除できます。'],
    ['sort','並べ替え','更新順・作成順・タイトル順を切り替えます。']
  ],
  edit:[
    ['checklist','チェックリスト編集','ボタンで通常メモとチェックリストを切り替えます。'],
    ['links','本文中のURL一覧','本文の下にクリックできるリンクを表示します。'],
    ['copy','本文コピー','本文をクリップボードにコピーします。']
  ],
  extras:[
    ['paste','コピーした文章からメモ','クリップボードの文章で新しいメモを作ります。'],
    ['stats','どうでもいい記録','メモ数や文字数などの統計を表示します。'],
    ['trash','ゴミ箱','削除したメモを一覧から復元できます。'],
    ['undo','削除直後の取り消し','削除後に「元に戻す」を表示します。']
  ],
  system:[
    ['syncUI','クラウド同期の操作','Googleログイン・同期操作を表示します。']
  ]
};

let settingsTab = 'list';

let db;
let notes = [];
let selected = null;
let filter = 'all';
let sortMode = 'updated';
let visibleLimit = 10;
let screen = 'list';
let copiedId = null;
let ghostDismissedDay = '';
let queue = Promise.resolve();
let failed = false;
let version = 0;
let toastTimer = null;
let undoInfo = null;
let modalOpen = false;

let firebase = null;
let auth = null;
let firestore = null;
let cloudUser = null;
let syncEnabled = false;
let syncing = false;
let syncAgain = false;
let syncTimer = null;
let syncInterval = null;
let accountGeneration = 0;
let syncError = '';

const iso = () => new Date().toISOString();
const mobile = () => matchMedia('(max-width:700px)').matches;

function localGet(key) {
  try { return localStorage.getItem(key); }
  catch(e) { return null; }
}

function localSet(key,value) {
  try { localStorage.setItem(key,String(value)); }
  catch(e) {}
}

function loadSettings() {
  try {
    const raw = JSON.parse(localGet('sugu-settings-v1') || '{}');
    for (const key of Object.keys(DEFAULT_SETTINGS)) {
      if (typeof raw[key] === 'boolean') settings[key] = raw[key];
    }
  } catch(e) {}
}

function saveSettings() {
  localSet('sugu-settings-v1',JSON.stringify(settings));
}

function enabled(key) {
  return settings[key] !== false;
}

function dateValue(s) {
  if (typeof s === 'number') return s < 1e11 ? s*1000 : s;
  if (!s) return 0;
  const v = String(s);
  const num = Number(v);
  if (/^\d{10,13}$/.test(v)) return num < 1e11 ? num*1000 : num;
  const d = Date.parse(v) || Date.parse(v.replace(' ','T'));
  return Number.isFinite(d) ? d : 0;
}

function dayKey() {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,'0'),
    String(d.getDate()).padStart(2,'0')
  ].join('-');
}

function openDB() {
  return new Promise((resolve,reject) => {
    const r = indexedDB.open(DB,2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(TABLE))
        d.createObjectStore(TABLE,{keyPath:'id'});
      if (!d.objectStoreNames.contains(META))
        d.createObjectStore(META,{keyPath:'key'});
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(Error('他のタブが保存領域を使用中です'));
  });
}

function getAll() {
  return new Promise((resolve,reject) => {
    const r = db.transaction(TABLE,'readonly').objectStore(TABLE).getAll();
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}

function getMeta(key) {
  return new Promise((resolve,reject) => {
    const r = db.transaction(META,'readonly').objectStore(META).get(key);
    r.onsuccess = () => resolve(r.result?.value);
    r.onerror = () => reject(r.error);
  });
}

function setMeta(key,value) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(META,'readwrite');
    tx.objectStore(META).put({key,value});
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function transaction(items) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(TABLE,'readwrite');
    const store = tx.objectStore(TABLE);
    for (const n of items) store.put({...n});
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function enqueue(job) {
  const task = queue.then(job);
  queue = task.catch(e => {
    failed = true;
    $('status').textContent = '保存失敗';
    console.error(e);
  });
  return task;
}

function normalizeNote(raw,id=raw.id) {
  return {
    id,
    title:String(raw.title ?? ''),
    body:String(raw.body ?? ''),
    ear:!!raw.ear,
    pinned:!!raw.pinned,
    checklist:!!raw.checklist,
    checks:Array.isArray(raw.checks) ? raw.checks.map(Boolean) : [],
    createdAt:String(raw.createdAt ?? ''),
    updatedAt:String(raw.updatedAt ?? ''),
    deleted:!!raw.deleted,
    deletedAt:String(raw.deletedAt ?? '')
  };
}

function current() {
  return notes.find(n => n.id === selected && !n.deleted);
}

function label(n) {
  return n.title || n.body.split('\n').find(Boolean) || '無題';
}

function sorted(includeDeleted=false) {
  const arr = notes.filter(n =>
    includeDeleted ? n.deleted : !n.deleted
  );

  arr.sort((a,b) => {
    if (!includeDeleted && enabled('pin') &&
        !!a.pinned !== !!b.pinned)
      return a.pinned ? -1 : 1;

    if (includeDeleted)
      return dateValue(b.deletedAt || b.updatedAt) -
             dateValue(a.deletedAt || a.updatedAt);

    if (sortMode === 'created')
      return dateValue(b.createdAt) - dateValue(a.createdAt);

    if (sortMode === 'title')
      return label(a).localeCompare(label(b),'ja');

    return dateValue(b.updatedAt) - dateValue(a.updatedAt);
  });

  return arr;
}

function toast(message,undo=false) {
  clearTimeout(toastTimer);
  $('toastText').textContent = message;
  $('toastUndo').classList.toggle('hide',!undo || !enabled('undo'));
  $('toast').classList.remove('hide');
  toastTimer = setTimeout(() => {
    $('toast').classList.add('hide');
    undoInfo = null;
  },6000);
}

function resetCopy() {
  copiedId = null;
  $('copy').textContent = '□';
  $('copy').classList.remove('copy-success');
}

function showScreen(next) {
  if (screen !== next) resetCopy();
  screen = next;
  localSet('sugu-screen',next);
  if (mobile()) $('side').classList.toggle('open',next === 'list');
}

function openEditorHistory() {
  if (mobile() && history.state?.sugu !== 'edit')
    history.pushState({sugu:'edit'},'',location.href);
  showScreen('edit');
}

function goList() {
  if (mobile() && history.state?.sugu === 'edit')
    history.back();
  else
    showScreen('list');
}

function updateLinks() {
  const root = $('links');
  root.replaceChildren();

  if (!enabled('links')) return;

  const n = current();
  if (!n) return;

  const matches = n.body.match(/https?:\/\/[^\s<>"'「」]+/g) || [];
  const urls = [...new Set(matches)].slice(0,20);
  if (!urls.length) return;

  const caption = document.createElement('small');
  caption.textContent = '本文中のリンク';
  root.append(caption);

  for (const raw of urls) {
    const clean = raw.replace(/[.,。、）)\]】]+$/g,'');
    try {
      const url = new URL(clean);
      if (!['http:','https:'].includes(url.protocol)) continue;
      const a = document.createElement('a');
      a.href = url.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = clean;
      root.append(a);
    } catch(e) {}
  }
}

function checklistLines(n) {
  return n.body ? n.body.split('\n') : [''];
}

function checklistProgress(n) {
  const lines = checklistLines(n);
  const total = lines.filter(x => x.trim()).length;
  const done = lines.reduce((count,line,i) =>
    count + (line.trim() && n.checks?.[i] ? 1 : 0),0
  );
  return {done,total};
}

function renderChecklist() {
  const n = current();
  const root = $('checklist');
  root.replaceChildren();
  if (!n || !n.checklist) return;

  const lines = checklistLines(n);

  lines.forEach((line,index) => {
    const row = document.createElement('div');
    row.className = 'check-row';

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = !!n.checks[index];
    box.setAttribute('aria-label',`${index+1}番目を完了`);

    const text = document.createElement('input');
    text.type = 'text';
    text.className = 'check-text' + (box.checked ? ' done' : '');
    text.value = line;
    text.placeholder = '項目を入力';
    text.setAttribute('aria-label',`${index+1}番目の項目`);

    const del = document.createElement('button');
    del.className = 'check-delete';
    del.textContent = '×';
    del.title = '項目を削除';

    box.onchange = () => {
      n.checks[index] = box.checked;
      text.classList.toggle('done',box.checked);
      persist(n);
      render();
    };

    text.oninput = () => {
      const updated = checklistLines(n);
      updated[index] = text.value;
      n.body = updated.join('\n');
      $('body').value = n.body;
      persist(n);
      render();
    };

    text.onkeydown = e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addChecklistRow(index+1);
      }
      if (e.key === 'Backspace' && !text.value && lines.length > 1) {
        e.preventDefault();
        deleteChecklistRow(index);
      }
    };

    del.onclick = () => deleteChecklistRow(index);

    row.append(box,text,del);
    root.append(row);
  });

  const add = document.createElement('button');
  add.className = 'check-add';
  add.textContent = '＋ 項目を追加';
  add.onclick = () => addChecklistRow(lines.length);
  root.append(add);
}

function deleteChecklistRow(index) {
  const n = current();
  if (!n) return;

  const lines = checklistLines(n);
  lines.splice(index,1);
  n.checks.splice(index,1);
  n.body = lines.join('\n');
  $('body').value = n.body;

  persist(n);
  renderChecklist();
  render();

  const inputs = $('checklist').querySelectorAll('.check-text');
  inputs[Math.max(0,index-1)]?.focus();
}

function addChecklistRow(index) {
  const n = current();
  if (!n) return;

  const lines = n.body ? n.body.split('\n') : [];
  lines.splice(index,0,'');
  n.checks.splice(index,0,false);
  n.body = lines.join('\n');
  $('body').value = n.body;

  persist(n);
  renderChecklist();
  render();

  const inputs = $('checklist').querySelectorAll('.check-text');
  inputs[index]?.focus();
}

function applySettings() {
  $('favoriteFilter').classList.toggle('hide',!enabled('favorite'));
  $('trashFilter').classList.toggle('hide',!enabled('trash'));
  $('sort').classList.toggle('hide',!enabled('sort'));
  $('paste').classList.toggle('hide',!enabled('paste'));
  $('stats').classList.toggle('hide',!enabled('stats'));
  $('syncbar').classList.toggle('hide',!enabled('syncUI'));
  $('syncMenu').classList.toggle('hide',!enabled('syncUI'));
  $('copy').classList.toggle('hide',!enabled('copy'));
  $('pin').classList.toggle('hide',!enabled('pin'));
  $('ear').classList.toggle('hide',!enabled('favorite'));
  $('mode').classList.toggle('hide',!enabled('checklist'));
  $('modeHint').classList.toggle('hide',!enabled('checklist'));

  if (!enabled('favorite') && filter === 'ear') filter = 'all';
  if (!enabled('trash') && filter === 'trash') filter = 'all';

}

function updateEditor() {
  const n = current();
  $('editArea').classList.toggle('hide',!n);
  $('emptyEditor').classList.toggle('hide',!!n);

  for (const id of ['copy','pin','ear','remove'])
    $(id).disabled = !n;

  $('body').classList.toggle('hide',n.checklist);
  $('checklist').classList.toggle('hide',!n.checklist);

  renderChecklist();
  updateLinks();

function viewedMap() {
  try { return JSON.parse(localGet('sugu-viewed-v1') || '{}'); }
  catch(e) { return {}; }
}

function recordView(id) {
  const map = viewedMap();
  map[id] = Date.now();
  const entries = Object.entries(map);

  if (entries.length > 1000) {
    entries.sort((a,b) => b[1]-a[1]);
    localSet('sugu-viewed-v1',JSON.stringify(
      Object.fromEntries(entries.slice(0,1000))
    ));
  } else {
    localSet('sugu-viewed-v1',JSON.stringify(map));
  }
}

function ghostCandidate(list) {
  if (!enabled('ghost')) return null;
  if (ghostDismissedDay === dayKey()) return null;

  const viewed = viewedMap();
  const cutoff = Date.now() - 30*86400000;

  const candidates = list.filter(n => {
    const last = viewed[n.id] ||
      dateValue(n.createdAt || n.updatedAt);
    return last > 0 && last < cutoff;
  });

  if (!candidates.length) return null;

  return candidates[
    Math.floor(Date.now()/86400000) % candidates.length
  ];
}

function makeGhostCard(n) {
  const card = document.createElement('div');
  card.className = 'item ghost-card';
  card.dataset.id = n.id;
  card.tabIndex = 0;

  const title = document.createElement('strong');
  title.textContent = '👻 メモの亡霊';

  const message = document.createElement('p');
  message.textContent = `「私のこと、覚えていますか。」 ${label(n)}`;

  const close = document.createElement('button');
  close.className = 'ghost-close';
  close.textContent = '×';
  close.title = '今日は表示しない';
  close.onclick = e => {
    e.stopPropagation();
    ghostDismissedDay = dayKey();
    localSet('sugu-ghost-dismiss',ghostDismissedDay);
    render();
  };

  card.append(title,message,close);
  return card;
}

function makeItem(n) {
  const item = document.createElement('div');
  item.className = 'item' + (n.id === selected ? ' active' : '');
  item.dataset.id = n.id;
  item.tabIndex = 0;

  const title = document.createElement('strong');
  title.textContent = label(n);

  const preview = document.createElement('p');
  preview.textContent = n.body.replace(/\s+/g,' ').slice(0,120);

  const time = document.createElement('small');
  time.textContent = String(n.updatedAt || '').slice(0,19);

  const meta = document.createElement('div');
  meta.className = 'item-meta';
  meta.append(time);

  if (n.checklist) {
    const progress = checklistProgress(n);
    const tag = document.createElement('span');
    tag.className = 'progress' +
      (progress.total > 0 && progress.done === progress.total
        ? ' complete' : '');

    tag.textContent = enabled('checkProgress')
      ? `☑ ${progress.done}/${progress.total}`
      : '☑ チェックリスト';

    meta.append(tag);
  }

  item.append(title,preview,meta);

  const actions = document.createElement('div');
  actions.className = 'item-actions';

  if (filter === 'trash') {
    const restore = document.createElement('button');
    restore.className = 'item-icon';
    restore.textContent = '↶';
    restore.title = 'メモを復元';
    restore.onclick = e => {
      e.stopPropagation();
      restoreNote(n.id);
    };
    actions.append(restore);
  } else {
    if (enabled('pin')) {
      const pin = document.createElement('button');
      pin.className = 'item-icon' + (n.pinned ? ' pin-on' : '');
      pin.textContent = n.pinned ? '📌' : '♧';
      pin.title = n.pinned ? 'ピン留め解除' : 'ピン留め';
      pin.onclick = e => {
        e.stopPropagation();
        toggleField(n.id,'pinned');
      };
      actions.append(pin);
    }

    if (enabled('favorite')) {
      const star = document.createElement('button');
      star.className = 'item-icon' + (n.ear ? ' on' : '');
      star.textContent = n.ear ? '★' : '☆';
      star.title = n.ear ? 'お気に入り解除' : 'お気に入り';
      star.onclick = e => {
        e.stopPropagation();
        toggleField(n.id,'ear');
      };
      actions.append(star);
    }

    if (enabled('listDelete')) {
      const del = document.createElement('button');
      del.className = 'item-icon delete';
      del.textContent = '⌫';
      del.title = 'メモを削除';
      del.onclick = e => {
        e.stopPropagation();
        removeById(n.id);
      };
      actions.append(del);
    }
  }

  item.append(actions);
  return item;
}

function render() {
  const q = $('search').value.toLocaleLowerCase();
  const inTrash = filter === 'trash';
  const all = sorted(inTrash);

  const filtered = all.filter(n =>
    (filter !== 'ear' || n.ear) &&
    (n.title+'\n'+n.body).toLocaleLowerCase().includes(q)
  );

  $('count').textContent = `${filtered.length}件`;

  const root = $('list');
  root.replaceChildren();

  const ghost = !q && filter === 'all'
    ? ghostCandidate(all) : null;

  const regular = ghost
    ? filtered.filter(n => n.id !== ghost.id)
    : filtered;

  const shown = regular.slice(0,visibleLimit);

  shown.forEach((n,i) => {
    if (i === 3 && ghost) root.append(makeGhostCard(ghost));
    root.append(makeItem(n));
  });

  if (ghost && shown.length < 4)
    root.append(makeGhostCard(ghost));

  if (regular.length > visibleLimit) {
    const more = document.createElement('button');
    more.className = 'more-button';
    more.textContent = 'さらに10件表示';
    more.onclick = () => {
      visibleLimit += 10;
      render();
    };
    root.append(more);
  }
}

function choose(id,focus=false) {
  const n = notes.find(x => x.id === id && !x.deleted);
  if (!n) return;

  selected = id;
  version++;
  resetCopy();
  localSet('mimi-last-id',id);
  recordView(id);

  updateEditor();
  $('status').textContent = failed ? '保存失敗' : '保存済み';
  openEditorHistory();
  render();

  if (focus) requestAnimationFrame(() => {
    if (n.checklist)
      $('checklist').querySelector('.check-text')?.focus();
    else
      $('body').focus();
  });
}

function scheduleSync() {
  if (!syncEnabled || !cloudUser) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(),1500);
}

function persist(n) {
  n.updatedAt = iso();

  const snapshot = {
    ...n,
    checks:[...(n.checks || [])]
  };

  const v = ++version;
  failed = false;
  $('status').textContent = '保存中';
  resetCopy();

  enqueue(() => transaction([snapshot])).then(() => {
    if (selected === snapshot.id && version === v)
      $('status').textContent = '保存済み';
    scheduleSync();
  }).catch(() => {});
}

function save() {
  const n = current();
  if (!n) return;

  const title = $('title').value;
  const body = n.checklist ? n.body : $('body').value;

  if (title === n.title && body === n.body) return;

  n.title = title;
  n.body = body;
  persist(n);
}

async function create(focus=true,body='',title='') {
  const now = iso();

  const n = {
    id:crypto.randomUUID(),
    title,body,
    ear:false,
    pinned:false,
    checklist:false,
    checks:[],
    createdAt:now,
    updatedAt:now,
    deleted:false,
    deletedAt:''
  };

  notes.push(n);

  try {
    await enqueue(() => transaction([n]));

    if (filter === 'trash') {
      filter = 'all';
      updateFilterUI();
    }

    choose(n.id,focus);
    scheduleSync();
  } catch(e) {
    notes = notes.filter(x => x.id !== n.id);
    await dialog('保存エラー','新しいメモを保存できませんでした。');
  }
}

async function toggleField(id,field) {
  const n = notes.find(x => x.id === id && !x.deleted);
  if (!n) return;

  const previous = {...n};
  n[field] = !n[field];
  n.updatedAt = iso();

  const snapshot = {...n,checks:[...(n.checks || [])]};

  if (selected === id) updateEditor();
  render();

  try {
    await enqueue(() => transaction([snapshot]));
    scheduleSync();
  } catch(e) {
    Object.assign(n,previous);
    if (selected === id) updateEditor();
    render();
    await dialog('保存エラー',String(e.message || e));
  }
}

function toggleChecklist() {
  if (!enabled('checklist')) return;

  const n = current();
  if (!n) return;

  n.checklist = !n.checklist;

  if (n.checklist) {
    const lines = checklistLines(n);
    n.checks = lines.map((_,i) => !!n.checks[i]);
  }

  persist(n);
  updateEditor();
  render();
}

async function copyBody() {
  if (!enabled('copy')) return;

  const n = current();
  if (!n) return;

  const id = n.id;
  const body = n.body;

  try {
    await navigator.clipboard.writeText(body);

    if (selected !== id || screen !== 'edit' ||
        current()?.body !== body) return;

    copiedId = id;
    $('copy').textContent = '✓';
    $('copy').classList.add('copy-success');
    toast('本文をコピーしました');
  } catch(e) {
    await dialog('コピーできません',
      'クリップボードへの書き込みが許可されていません。');
  }
}

async function pasteNew() {
  if (!enabled('paste')) return;

  try {
    const text = await navigator.clipboard.readText();

    if (!text) {
      await dialog('クリップボードが空です',
        'コピーした文章が見つかりません。');
      return;
    }

    await create(true,text);
  } catch(e) {
    await dialog('読み取りエラー',
      'クリップボードの権限を確認してください。');
  }
}

async function showStats() {
  if (!enabled('stats')) return;

  const all = notes.filter(n => !n.deleted);
  const lengths = all.map(n => (n.title+n.body).length);
  const total = lengths.reduce((a,b) => a+b,0);
  const longest = lengths.reduce((a,b) => Math.max(a,b),0);
  const shortest = lengths.length
    ? lengths.reduce((a,b) => Math.min(a,b),Infinity)
    : 0;

  await dialog(
    'どうでもいい記録',
    `メモ総数：${all.length}件\n`+
    `全文字数：${total.toLocaleString()}字\n`+
    `最長メモ：${longest}字\n`+
    `最短メモ：${shortest}字\n`+
    `チェックリスト：${all.filter(n => n.checklist).length}件\n`+
    `ピン留め：${all.filter(n => n.pinned).length}件\n\n`+
    'どうでもいい数字も、集めると少し気になります。'
  );
}

function dialog(title,message,choices=['閉じる']) {
  return new Promise(resolve => {
    modalOpen = true;

    const host = $('dialogs');
    host.replaceChildren();

    const overlay = document.createElement('div');
    overlay.className = 'overlay';

    const box = document.createElement('div');
    box.className = 'modal';

    const h = document.createElement('h2');
    h.textContent = title;

    const p = document.createElement('p');
    p.textContent = message;

    const actions = document.createElement('div');
    actions.className = 'actions';

    choices.forEach((choice,i) => {
      const b = document.createElement('button');
      b.className = 'action' +
        (i === choices.length-1 ? ' primary' : '');

      if (choice === 'ゴミ箱へ')
        b.classList.add('danger');

      b.textContent = choice;
      b.onclick = () => {
        host.replaceChildren();
        modalOpen = false;
        resolve(i);
      };

      actions.append(b);
    });

    box.append(h,p,actions);
    overlay.append(box);
    host.append(overlay);
  });
}

async function removeById(id) {
  if (modalOpen) return;

  const n = notes.find(x => x.id === id && !x.deleted);
  if (!n) return;

  const targetName = label(n);

  const choice = await dialog(
    'メモを削除しますか？',
    `「${targetName}」をゴミ箱に移動します。\n`+
    'ゴミ箱から復元できます。よろしいですか？',
    ['キャンセル','ゴミ箱へ']
  );

  if (choice !== 1) return;

  await queue;

  if (failed) {
    await dialog('保存エラー',
      '保存に失敗しているため削除を中止しました。');
    return;
  }

  const target = notes.find(x => x.id === id && !x.deleted);
  if (!target) return;

  const tombstone = {
    ...target,
    deleted:true,
    deletedAt:iso(),
    updatedAt:iso()
  };

  try {
    await enqueue(() => transaction([tombstone]));
    Object.assign(target,tombstone);

    if (selected === id) {
      selected = null;
      updateEditor();
    }

    render();
    scheduleSync();

    undoInfo = {id};
    toast('メモをゴミ箱に移動しました',true);
  } catch(e) {
    await dialog('削除エラー',String(e.message || e));
  }
}

async function remove() {
  if (selected) await removeById(selected);
}

async function restoreNote(id) {
  const n = notes.find(x => x.id === id && x.deleted);
  if (!n) return;

  const restored = {
    ...n,
    deleted:false,
    deletedAt:'',
    updatedAt:iso()
  };

  try {
    await enqueue(() => transaction([restored]));
    Object.assign(n,restored);
    render();
    scheduleSync();
    toast('メモを復元しました');
  } catch(e) {
    await dialog('復元エラー',String(e.message || e));
  }
}

async function exportJSON() {
  save();
  await queue;

  if (failed) {
    await dialog('保存エラー',
      'バックアップ前に保存状態を確認してください。');
    return;
  }

  const all = (await getAll()).filter(n => !n.deleted);

  const blob = new Blob([
    JSON.stringify({
      format:'mimi-sync-v1',
      exportedAt:iso(),
      notes:all
    },null,2)
  ],{type:'application/json'});

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = 'SUGUBackup_'+iso().slice(0,10)+'.json';

  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url),10000);
}

async function importJSON(file) {
  if (!file) return;

  try {
    const data = JSON.parse(await file.text());

    if (data.format !== 'mimi-sync-v1' ||
        !Array.isArray(data.notes))
      throw Error('対応していないJSONバックアップです');

    const incoming = new Map();

    for (const raw of data.notes) {
      if (!raw || typeof raw.id !== 'string' || !raw.id) continue;

      incoming.set(raw.id,{
        ...normalizeNote(raw),
        deleted:false,
        deletedAt:''
      });
    }

    const known = new Set(notes.map(n => n.id));
    const add = [...incoming.values()]
      .filter(n => !known.has(n.id));

    const choice = await dialog(
      'バックアップを取り込みますか？',
      `ファイル内：${incoming.size}件\n`+
      `新規追加：${add.length}件\n`+
      '既存メモは上書きしません。',
      ['キャンセル','取り込む']
    );

    if (choice !== 1) return;

    save();
    await queue;

    if (failed)
      throw Error('編集中のメモを保存できません');

    if (add.length)
      await enqueue(() => transaction(add));

    notes = await getAll();
    render();
    scheduleSync();

    await dialog('取り込み完了',`${add.length}件追加しました。`);
  } catch(e) {
    await dialog('取り込みエラー',String(e.message || e));
  }
}

function syncKey(uid) {
  return 'enabled:'+uid;
}

function updateAccountUI() {
  const name = cloudUser
    ? (cloudUser.email || 'Googleアカウント')
    : 'ログインしていません';

  $('account').textContent =
    cloudUser && syncEnabled ? name+' ・ 同期有効' : name;

  $('login').classList.toggle('hide',!!cloudUser);
  $('logout').classList.toggle('hide',!cloudUser);
  $('startSync').classList.toggle('hide',!cloudUser || syncEnabled);
}

async function loadFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/13.3.0/';

  const [appMod,authMod,dbMod] = await Promise.all([
    import(base+'firebase-app.js'),
    import(base+'firebase-auth.js'),
    import(base+'firebase-firestore.js')
  ]);

  const app = appMod.initializeApp(firebaseConfig);
  auth = authMod.getAuth(app);
  firestore = dbMod.getFirestore(app);
  firebase = {authMod,dbMod};

  authMod.onAuthStateChanged(auth,async user => {
    const generation = ++accountGeneration;

    clearTimeout(syncTimer);
    clearInterval(syncInterval);

    syncEnabled = false;
    cloudUser = user;
    syncError = '';

    if (user) {
      try {
        syncEnabled =
          (await getMeta(syncKey(user.uid))) === true;
      } catch(e) {
        console.error(e);
      }
    }

    if (generation !== accountGeneration) return;

    updateAccountUI();

    if (syncEnabled && user) {
      syncNow();
      syncInterval = setInterval(() => {
        if (!document.hidden && navigator.onLine)
          syncNow();
      },15000);
    }
  },error => {
    console.error(error);
    $('account').textContent = '認証エラー';
  });
}

async function login() {
  if (!firebase) {
    await dialog('準備中',
      'Firebaseを読み込んでいます。少し待ってから試してください。');
    return;
  }

  try {
    const provider = new firebase.authMod.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    await firebase.authMod.signInWithPopup(auth,provider);
  } catch(e) {
    console.error(e);
    await dialog(
      'Googleログインに失敗しました',
      String(e.code || e.message || e)+
      '\nAndroidでポップアップが開けない場合は、ChromeでSUGUのURLを直接開いてください。'
    );
  }
}

async function logout() {
  if (!auth || !cloudUser) return;

  const choice = await dialog(
    'ログアウトしますか？',
    '端末内のメモは残ります。',
    ['キャンセル','ログアウト']
  );

  if (choice !== 1) return;

  try {
    await firebase.authMod.signOut(auth);
  } catch(e) {
    await dialog('ログアウトエラー',String(e.message || e));
  }
}

async function startSync() {
  if (!cloudUser || syncEnabled) return;

  const user = cloudUser;

  const choice = await dialog(
    '初回同期を開始しますか？',
    `ログイン中：${user.email || 'Googleアカウント'}\n\n`+
    '端末内のメモとクラウドのメモを統合します。\n'+
    '同じIDのメモは更新日時が新しい方を優先します。\n'+
    '先にJSONバックアップを保存してください。',
    ['キャンセル','同期を開始']
  );

  if (choice !== 1 || cloudUser?.uid !== user.uid) return;

  save();
  await queue;

  if (failed) {
    await dialog('同期を中止',
      '端末内への保存に失敗しています。');
    return;
  }

  try {
    await setMeta(syncKey(user.uid),true);
    syncEnabled = true;
    updateAccountUI();

    syncInterval = setInterval(() => {
      if (!document.hidden && navigator.onLine)
        syncNow();
    },15000);

    await syncNow();
  } catch(e) {
    syncEnabled = false;
    await setMeta(syncKey(user.uid),false).catch(console.error);
    updateAccountUI();
    await dialog('同期開始エラー',String(e.message || e));
  }
}

async function syncNow() {
  if (!syncEnabled || !cloudUser ||
      !firebase || !navigator.onLine) return;

  if (syncing) {
    syncAgain = true;
    return;
  }

  syncing = true;

  const uid = cloudUser.uid;
  const generation = accountGeneration;
  const {dbMod} = firebase;
  const collection =
    dbMod.collection(firestore,'users',uid,'notes');

  try {
    save();
    await queue;

    if (failed)
      throw Error('端末内の保存に失敗しています');

    $('status').textContent = '同期中';

    const remoteSnap = await dbMod.getDocs(collection);

    if (generation !== accountGeneration ||
        cloudUser?.uid !== uid || !syncEnabled) return;

    const remote = new Map();
    remoteSnap.forEach(d =>
      remote.set(d.id,normalizeNote(d.data(),d.id))
    );

    const local = new Map(
      (await getAll()).map(n => [n.id,normalizeNote(n)])
    );

    const download = [];
    const upload = [];

    for (const [id,r] of remote) {
      const l = local.get(id);

      if (!l || dateValue(r.updatedAt) > dateValue(l.updatedAt))
        download.push(r);
    }

    for (const [id,l] of local) {
      const r = remote.get(id);

      if (!r || dateValue(l.updatedAt) > dateValue(r.updatedAt))
        upload.push(l);
    }

    if (generation !== accountGeneration ||
        cloudUser?.uid !== uid || !syncEnabled) return;

    await queue;

    const latest = new Map(
      (await getAll()).map(n => [n.id,n])
    );

    const safeDownload = download.filter(r => {
      const now = latest.get(r.id);
      const old = local.get(r.id);

      if (!now) return true;
      if (!old) return false;

      return dateValue(now.updatedAt) <=
             dateValue(old.updatedAt);
    });

    if (safeDownload.length) {
      await enqueue(() => transaction(safeDownload));
      notes = await getAll();

      if (!current() && selected) {
        selected = null;
        updateEditor();
        showScreen('list');
      } else if (
        safeDownload.some(n => n.id === selected) &&
        document.activeElement !== $('title') &&
        document.activeElement !== $('body') &&
        !document.activeElement?.classList.contains('check-text')
      ) {
        updateEditor();
      }

      render();
    }

    for (const n of upload) {
      if (generation !== accountGeneration ||
          cloudUser?.uid !== uid || !syncEnabled) return;

      const newest = (await getAll())
        .find(x => x.id === n.id);

      if (!newest) continue;

      const latestRemote = remote.get(n.id);

      if (latestRemote &&
          dateValue(latestRemote.updatedAt) >=
          dateValue(newest.updatedAt)) continue;

      await dbMod.setDoc(
        dbMod.doc(collection,n.id),
        normalizeNote(newest)
      );
    }

    syncError = '';
    $('status').textContent = '保存済み・同期済み';
  } catch(e) {
    console.error('SUGU sync:',e);
    syncError = String(e.code || e.message || e);
    $('status').textContent = '端末保存済み・同期失敗';
  } finally {
    syncing = false;

    if (syncAgain) {
      syncAgain = false;
      scheduleSync();
    }
  }
}

async function syncMenu() {
  if (!cloudUser) {
    if (!firebase) {
      await dialog('Googleログイン',
        'Firebaseの読み込みが完了していません。');
    } else {
      await login();
    }
    return;
  }

  if (!syncEnabled) {
    await startSync();
    return;
  }

  const choice = await dialog(
    'SUGU 自動同期',
    `アカウント：${cloudUser.email || ''}\n`+
    `状態：${syncError ? '同期エラー：'+syncError : '同期有効'}`,
    ['閉じる','今すぐ同期','ログアウト']
  );

  if (choice === 1) await syncNow();
  if (choice === 2) await logout();
}

async function receivePendingShare() {
  const id = await getMeta('sugu-pending-share')
    .catch(() => null);

  if (!id) return false;

  await queue;
  notes = await getAll();

  const n = notes.find(x => x.id === id && !x.deleted);

  if (n) {
    choose(n.id,false);
    scheduleSync();
  }

  await setMeta('sugu-pending-share',null)
    .catch(console.error);

  return !!n;
}

function updateFilterUI() {
  document.querySelectorAll('.chip').forEach(b =>
    b.classList.toggle('active',b.dataset.filter === filter)
  );
  render();
}

/* 設定画面 */
function openSettings() {
  if (modalOpen) return;

  modalOpen = true;
  settingsTab = 'list';

  const host = $('dialogs');
  host.replaceChildren();

  const overlay = document.createElement('div');
  overlay.className = 'overlay';

  const box = document.createElement('div');
  box.className = 'modal settings-modal';

  const head = document.createElement('div');
  head.className = 'settings-head';

  const titleBox = document.createElement('div');
  titleBox.style.flex = '1';

  const title = document.createElement('h2');
  title.textContent = 'SUGU 設定';

  const subtitle = document.createElement('small');
  subtitle.textContent = '自分にちょうどいいメモ帳に';

  titleBox.append(title,subtitle);

  const close = document.createElement('button');
  close.className = 'settings-close';
  close.textContent = '×';
  close.title = '設定を閉じる';
  close.onclick = () => {
    host.replaceChildren();
    modalOpen = false;
  };

  head.append(titleBox,close);

  const tabs = document.createElement('div');
  tabs.className = 'settings-tabs';

  const content = document.createElement('div');
  content.className = 'settings-content';

  const foot = document.createElement('div');
  foot.className = 'settings-foot';
  foot.textContent =
    '設定はこの端末に保存されます。機能をOFFにしても、保存済みのメモやチェック状態は削除されません。';

  const tabNames = [
    ['list','一覧'],
    ['edit','編集'],
    ['extras','便利機能'],
    ['system','同期']
  ];

  function drawSettings() {
    tabs.replaceChildren();
    content.replaceChildren();

    for (const [key,name] of tabNames) {
      const b = document.createElement('button');
      b.className = 'settings-tab' +
        (settingsTab === key ? ' active' : '');
      b.textContent = name;
      b.onclick = () => {
        settingsTab = key;
        drawSettings();
      };
      tabs.append(b);
    }

    for (const [key,name,description] of SETTING_GROUPS[settingsTab]) {
      const row = document.createElement('div');
      row.className = 'settings-row';

      const text = document.createElement('div');
      text.className = 'settings-text';

      const strong = document.createElement('strong');
      strong.textContent = name;

      const small = document.createElement('small');
      small.textContent = description;

      text.append(strong,small);

      const toggle = document.createElement('button');
      toggle.className = 'switch' +
        (enabled(key) ? ' on' : '');
      toggle.setAttribute('role','switch');
      toggle.setAttribute('aria-label',name);
      toggle.setAttribute('aria-checked',String(enabled(key)));

      toggle.onclick = () => {
        settings[key] = !enabled(key);
        saveSettings();
        applySettings();
        drawSettings();
      };

      row.append(text,toggle);
      content.append(row);
    }
  }

  box.append(head,tabs,content,foot);
  overlay.append(box);
  host.append(overlay);

  drawSettings();
}

async function init() {
  try {
    db = await openDB();
    notes = await getAll();

    loadSettings();

    ghostDismissedDay =
      localGet('sugu-ghost-dismiss') || '';

    sortMode = localGet('sugu-sort') || 'updated';
    $('sort').value = sortMode;

    const last = localGet('mimi-last-id');

    selected = last &&
      notes.some(n => n.id === last && !n.deleted)
      ? last : null;

    applySettings();

    const previous = localGet('sugu-screen') || 'list';

    history.replaceState({sugu:'list'},'',location.href);
    showScreen('list');

    if (previous === 'edit' && current())
      openEditorHistory();

    $('status').textContent = '保存済み';

    if (new URL(location.href).searchParams.has('shared')) {
      await receivePendingShare();

      const url = new URL(location.href);
      url.searchParams.delete('shared');

      history.replaceState(
        history.state,'',url.pathname+url.search+url.hash
      );
    }
  } catch(e) {
    await dialog(
      '起動エラー',
      '端末内の保存領域を開けませんでした。\n'+
      String(e.message || e)
    );
    return;
  }

  $('title').addEventListener('input',save);
  $('body').addEventListener('input',save);
  $('body').addEventListener('blur',updateLinks);

  $('new').onclick = () => create();
  $('sideNew').onclick = () => create();
  $('paste').onclick = pasteNew;
  $('stats').onclick = showStats;
  $('copy').onclick = copyBody;
  $('mode').onclick = toggleChecklist;

  $('pin').onclick = () => {
    if (selected) toggleField(selected,'pinned');
  };

  $('ear').onclick = () => {
    if (selected) toggleField(selected,'ear');
  };

  $('remove').onclick = remove;

  $('settingsSide').onclick = openSettings;
  $('settingsMain').onclick = openSettings;

  $('openList').onclick = goList;
  $('closeList').onclick = goList;

  $('list').onclick = e => {
    if (e.target.closest('button')) return;

    const item = e.target.closest('.item');
    if (!item?.dataset.id) return;

    if (filter === 'trash') {
      restoreNote(item.dataset.id);
    } else {
      choose(item.dataset.id,false);
    }
  };

  $('list').addEventListener('keydown',e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (e.target.closest('button')) return;

    const item = e.target.closest('.item');
    if (!item?.dataset.id) return;

    e.preventDefault();

    if (filter === 'trash')
      restoreNote(item.dataset.id);
    else
      choose(item.dataset.id,false);
  });

  $('search').oninput = () => {
    visibleLimit = 10;
    render();
  };

  $('sort').onchange = e => {
    sortMode = e.target.value;
    localSet('sugu-sort',sortMode);
    visibleLimit = 10;
    render();
  };

  document.querySelectorAll('.chip').forEach(b => {
    b.onclick = () => {
      filter = b.dataset.filter;
      visibleLimit = 10;
      updateFilterUI();
    };
  });

  $('toastUndo').onclick = async () => {
    if (!undoInfo) return;

    const id = undoInfo.id;
    undoInfo = null;

    $('toast').classList.add('hide');
    await restoreNote(id);
  };

  $('export').onclick = exportJSON;
  $('import').onclick = () => $('file').click();

  $('file').onchange = async e => {
    await importJSON(e.target.files[0]);
    e.target.value = '';
  };

  $('login').onclick = login;
  $('logout').onclick = logout;
  $('startSync').onclick = startSync;
  $('syncMenu').onclick = syncMenu;

  document.addEventListener('keydown',e => {
    if (modalOpen) return;

    if (e.ctrlKey && e.key.toLowerCase() === 'n') {
      e.preventDefault();
      create();
      return;
    }

    if (e.key === 'Escape') {
      goList();
      return;
    }

    if (e.key !== 'Delete' || !enabled('deleteKey')) return;
    if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) return;
    if (mobile()) return;
    if (filter === 'trash') return;
    if (!selected) return;

    const target = e.target;

    if (target instanceof Element) {
      if (target.closest('input,textarea,select,[contenteditable="true"]'))
        return;

      if (target.closest('button')) return;
    }

    // 一覧を操作中の場合に限定する。
    const active = document.activeElement;
    const listFocused =
      active === $('list') ||
      (active instanceof Element &&
       !!active.closest('#list'));

    if (!listFocused) return;

    e.preventDefault();
    removeById(selected);
  });

  window.addEventListener('popstate',e => {
    if (e.state?.sugu === 'edit' && current())
      showScreen('edit');
    else
      showScreen('list');
  });

  document.addEventListener('visibilitychange',() => {
    if (document.hidden) save();
    else if (syncEnabled) syncNow();
  });

  window.addEventListener('online',() => {
    if (syncEnabled) syncNow();
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message',async e => {
      if (e.data?.type !== 'SUGU_SHARED') return;

      await queue;
      notes = await getAll();

      const n = notes.find(x =>
        x.id === e.data.id && !x.deleted
      );

      if (n) {
        choose(n.id,false);
        scheduleSync();
      }

      render();
    });
  }

  if ('serviceWorker' in navigator &&
      location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js')
      .catch(console.warn);
  }

  // 端末内のメモを先に表示し、
  // Firebaseは後から読み込む。
  loadFirebase().catch(e => {
    console.error('Firebase initialization:',e);
    $('account').textContent = 'クラウド接続不可';
  });
}

init();
